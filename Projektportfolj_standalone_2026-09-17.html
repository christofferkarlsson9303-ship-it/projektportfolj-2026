function person(id){ return STATE.medarbetare.find(m=>m.id===id) || null; }
function aktivaPersoner(){ return STATE.medarbetare.filter(m=>m.aktiv!==false); }
function aktivitet(id){ return STATE.aktiviteter.find(a=>a.id===id) || null; }
function aktiviteterFor(pid){ return STATE.aktiviteter.filter(a=>a.projektId===pid); }
function otFaktor(v){ return Number(v)||1; }
function timkostnad(rad){
  const m=person(rad.personId);
  return (Number(rad.timmar)||0)*(m?Number(m.apris)||0:0)*otFaktor(rad.ot);
}

/* ---------- Vecka: mån–sön-datum för en ISO-veckosträng ---------- */
function veckansDagar(vstr){
  const [ar,v]=vstr.split("-v").map(Number);
  const d=new Date(Date.UTC(ar,0,4));
  const dag=(d.getUTCDay()||7);
  d.setUTCDate(d.getUTCDate()-dag+1+(v-1)*7);
  const ut=[];
  for(let i=0;i<7;i++){ const x=new Date(d); x.setUTCDate(d.getUTCDate()+i); ut.push(x.toISOString().slice(0,10)); }
  return ut;
}
const DAGNAMN=["Mån","Tis","Ons","Tor","Fre","Lör","Sön"];

/* ==========================================================================
   RESURSER — kapacitet och beläggning
   ========================================================================== */
let resursVecka=null;
let resursHorisont=6;

function bemanningsrad(personId,projektId,vecka){
  return STATE.bemanning.find(b=>b.personId===personId&&b.projektId===projektId&&b.vecka===vecka)||null;
}
function planeratPerson(personId,vecka){
  return STATE.bemanning.filter(b=>b.personId===personId&&b.vecka===vecka)
    .reduce((s,b)=>s+(Number(b.timmar)||0),0);
}
function planeratProjekt(projektId,vecka){
  return STATE.bemanning.filter(b=>b.projektId===projektId&&b.vecka===vecka)
    .reduce((s,b)=>s+(Number(b.timmar)||0),0);
}
function belaggningsklass(proc){
  if(proc>100) return "bl-over";
  if(proc>=85) return "bl-full";
  if(proc>0)   return "bl-del";
  return "bl-tom";
}
function satBemanning(personId,projektId,vecka,timmar){
  const t=Number(timmar)||0;
  let rad=bemanningsrad(personId,projektId,vecka);
  if(!rad){
    if(t<=0) return;
    rad={id:"bm"+Date.now()+Math.floor(Math.random()*999),personId,projektId,vecka,timmar:t};
    STATE.bemanning.push(rad);
  } else if(t<=0){
    STATE.bemanning=STATE.bemanning.filter(b=>b!==rad);
  } else rad.timmar=t;
  spara(); rita();
}
function bytResursVecka(steg){ resursVecka=veckaForskjut(resursVecka,steg); rita(); }
function satHorisont(n){ resursHorisont=Number(n)||6; rita(); }
function uppdPerson(id,falt,varde){
  const m=person(id); if(!m) return;
  m[falt]=(falt==="kapacitet"||falt==="apris")?Number(varde)||0:varde;
  spara(); rita();
}
function satPersonroll(id,roll){
  const m=person(id); if(!m) return;
  m.roll=roll;
  const träff=PRISLISTA_061.find(x=>x[0]===roll);
  if(träff) m.apris=träff[1];
  spara(); rita();
}
function nyMedarbetare(){
  STATE.medarbetare.push({id:"me"+Date.now(),namn:"Ny medarbetare",roll:"Montör",
    kapacitet:40,apris:945,aktiv:true});
  spara(); rita();
}
function taBortMedarbetare(id){
  if(STATE.tidrader.some(t=>t.personId===id)){ toast("Personen har rapporterad tid — avaktivera i stället.","warn"); return; }
  STATE.medarbetare=STATE.medarbetare.filter(m=>m.id!==id);
  STATE.bemanning=STATE.bemanning.filter(b=>b.personId!==id);
  spara(); rita();
}

function ritaResurser(){
  if(!resursVecka) resursVecka=veckaNu();
  const veckor=[]; let v=resursVecka;
  for(let i=0;i<resursHorisont;i++){ veckor.push(v); v=veckaForskjut(v,1); }
  const pers=aktivaPersoner();

  const kapTot=pers.reduce((s,m)=>s+(Number(m.kapacitet)||0),0)*veckor.length;
  const planTot=veckor.reduce((s,vk)=>s+pers.reduce((a,m)=>a+planeratPerson(m.id,vk),0),0);
  const belProc=kapTot?Math.round(planTot/kapTot*100):0;
  const overbel=[];
  pers.forEach(m=>veckor.forEach(vk=>{
    const p=planeratPerson(m.id,vk), k=Number(m.kapacitet)||0;
    if(k&&p>k) overbel.push({m,vk,p,k});
  }));
  const ledigt=Math.max(0,kapTot-planTot);

  const matris=`<div class="tscroll"><table class="belaggning"><thead><tr>
      <th style="min-width:190px">Medarbetare</th><th class="num" style="width:78px">Kap. h/v</th>
      ${veckor.map(vk=>`<th class="num" style="width:92px">${esc(veckaEtikett(vk))}</th>`).join("")}
      <th class="num" style="width:92px">Snitt</th></tr></thead><tbody>
    ${pers.length?pers.map(m=>{
      const k=Number(m.kapacitet)||0;
      const snitt=veckor.length?Math.round(veckor.reduce((s,vk)=>s+planeratPerson(m.id,vk),0)/veckor.length):0;
      const snittP=k?Math.round(snitt/k*100):0;
      return `<tr>
        <td><b>${esc(m.namn)}</b><small style="display:block;color:var(--ink-soft)">${esc(m.roll)}</small></td>
        <td class="num"><input type="number" min="0" max="80" step="1" value="${k}"
          onchange="uppdPerson('${m.id}','kapacitet',this.value)" style="max-width:66px;text-align:right"></td>
        ${veckor.map(vk=>{
          const p=planeratPerson(m.id,vk);
          const proc=k?Math.round(p/k*100):0;
          return `<td class="num"><span class="blcell ${belaggningsklass(proc)}"
            title="${p} h planerat av ${k} h">${p?p+" h":"–"}<i>${k?proc+" %":""}</i></span></td>`;
        }).join("")}
        <td class="num"><span class="blcell ${belaggningsklass(snittP)}">${snitt} h<i>${k?snittP+" %":""}</i></span></td>
      </tr>`;
    }).join(""):`<tr><td colspan="${veckor.length+3}" class="lead">Inga medarbetare upplagda.</td></tr>`}
    <tr class="sumrad"><td><b>Summa planerat</b></td><td class="num">${kapTot?Math.round(kapTot/veckor.length):0}</td>
      ${veckor.map(vk=>{
        const p=pers.reduce((s,m)=>s+planeratPerson(m.id,vk),0);
        const k=pers.reduce((s,m)=>s+(Number(m.kapacitet)||0),0);
        return `<td class="num"><b>${p} h</b><small style="display:block;color:var(--ink-soft)">${k?Math.round(p/k*100):0} %</small></td>`;
      }).join("")}<td class="num"><b>${belProc} %</b></td></tr>
  </tbody></table></div>`;

  const fordelning=`<div class="tscroll"><table><thead><tr>
      <th>Projekt</th>${veckor.map(vk=>`<th class="num">${esc(veckaEtikett(vk))}</th>`).join("")}
      <th class="num">Summa</th></tr></thead><tbody>
    ${STATE.projekt.map(p=>{
      const rad=veckor.map(vk=>planeratProjekt(p.id,vk));
      const sum=rad.reduce((a,b)=>a+b,0);
      if(!sum) return "";
      return `<tr><td>${taggProjekt(p.id)} ${esc(p.namn)}</td>
        ${rad.map(t=>`<td class="num">${t?t+" h":"–"}</td>`).join("")}
        <td class="num"><b>${sum} h</b></td></tr>`;
    }).join("")||`<tr><td colspan="${veckor.length+2}" class="lead">Ingen tid planerad ännu.</td></tr>`}
  </tbody></table></div>`;

  const planerare=`<div class="tscroll"><table><thead><tr>
      <th style="min-width:180px">Medarbetare</th>
      ${STATE.projekt.map(p=>`<th class="num" style="width:130px">${esc(p.nr||p.namn)}</th>`).join("")}
      <th class="num" style="width:96px">Summa</th><th class="num" style="width:96px">Kapacitet</th>
    </tr></thead><tbody>
    ${pers.map(m=>{
      const sum=planeratPerson(m.id,resursVecka), k=Number(m.kapacitet)||0;
      const proc=k?Math.round(sum/k*100):0;
      return `<tr><td><b>${esc(m.namn)}</b></td>
        ${STATE.projekt.map(p=>{
          const b=bemanningsrad(m.id,p.id,resursVecka);
          return `<td class="num"><input type="number" min="0" max="80" step="1"
            value="${b?b.timmar:""}" placeholder="0"
            onchange="satBemanning('${m.id}','${p.id}','${resursVecka}',this.value)"
            style="max-width:78px;text-align:right"></td>`;
        }).join("")}
        <td class="num"><span class="blcell ${belaggningsklass(proc)}">${sum} h<i>${k?proc+" %":""}</i></span></td>
        <td class="num">${k} h</td></tr>`;
    }).join("")}
  </tbody></table></div>`;

  document.getElementById("v-resurser").innerHTML=`
    <div class="grid g4" style="margin-bottom:20px">
      ${kpi("Beläggning","<span class=\""+(belProc>100?"bad":"")+"\">"+belProc+" %</span>",
        planTot+" h planerat av "+kapTot+" h över "+veckor.length+" veckor")}
      ${kpi("Ledig kapacitet",ledigt+" h",ledigt?"utrymme för ÄTA och tillkommande arbeten":"ingen buffert kvar",ledigt?"":"bad")}
      ${kpi("Överbelastningar",overbel.length,overbel.length?"person/vecka över kapacitet":"ingen över kapacitet",overbel.length?"bad":"")}
      ${kpi("Medarbetare",pers.length,"aktiva i planeringen")}
    </div>

    ${overbel.length?`<div class="note" style="border-left-color:var(--rod);background:var(--bad-bg);margin:0 0 20px">
      <b>⚠ Över kapacitet:</b> ${overbel.slice(0,6).map(o=>esc(o.m.namn)+" "+esc(veckaEtikett(o.vk))+" ("+o.p+"/"+o.k+" h)").join(" · ")}
      ${overbel.length>6?" … och "+(overbel.length-6)+" till":""}</div>`:""}

    <div class="card" style="margin-bottom:20px">
      <div class="kortrad">
        <div><h3>Beläggning per vecka</h3>
          <div class="lead">Planerade timmar mot kapacitet. Rött = över kapacitet, grönt = full beläggning, blått = utrymme kvar.</div></div>
        <div class="kortverktyg">
          <button class="btn sec mini" onclick="bytResursVecka(-1)">‹ Tidigare</button>
          <button class="btn sec mini" onclick="resursVecka=veckaNu();rita()">Denna vecka</button>
          <button class="btn sec mini" onclick="bytResursVecka(1)">Senare ›</button>
          <select onchange="satHorisont(this.value)" style="width:auto">
            ${[4,6,8,12].map(n=>`<option value="${n}"${n===resursHorisont?" selected":""}>${n} veckor</option>`).join("")}
          </select>
        </div>
      </div>
      ${matris}
      <div class="belleg">
        <span><i class="bl-del"></i>Utrymme kvar</span><span><i class="bl-full"></i>85–100 %</span>
        <span><i class="bl-over"></i>Över kapacitet</span>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px">
      <h3>Planera ${esc(veckaEtikett(resursVecka))}</h3>
      <div class="lead">Fyll i timmar per medarbetare och projekt. Summan uppdaterar beläggningen direkt.</div>
      ${planerare}
    </div>

    <div class="grid g2">
      <div class="card"><h3>Fördelning per projekt</h3>
        <div class="lead">Planerade timmar per projekt och vecka.</div>${fordelning}</div>
      <div class="card"><h3>Medarbetare och á-pris</h3>
        <div class="lead">Á-pris enligt Bilaga 06.1. Kapacitet och prissättning är <span class="ant">ANTAGANDE</span> tills du bekräftat dem.</div>
        <div class="tscroll"><table><thead><tr><th>Namn</th><th>Roll</th>
          <th class="num" style="width:110px">Á-pris</th><th style="width:58px"></th></tr></thead><tbody>
          ${STATE.medarbetare.map(m=>`<tr>
            <td><input type="text" value="${esc(m.namn)}" onchange="uppdPerson('${m.id}','namn',this.value)"></td>
            <td><select onchange="satPersonroll('${m.id}',this.value)">
              ${PRISLISTA_061.map(([r])=>`<option${r===m.roll?" selected":""}>${esc(r)}</option>`).join("")}</select></td>
            <td class="num"><input type="number" value="${m.apris||0}" step="5"
              onchange="uppdPerson('${m.id}','apris',this.value)" style="max-width:88px;text-align:right"></td>
            <td><button class="btn sec mini" onclick="taBortMedarbetare('${m.id}')" title="Ta bort">✕</button></td>
          </tr>`).join("")}
        </tbody></table></div>
        <div class="rowbtns"><button class="btn sec mini" onclick="nyMedarbetare()">+ Lägg till medarbetare</button></div>
      </div>
    </div>`;
}

let tidVecka=null;
let tidPerson=null;

function tidraderVecka(personId,vstr){
  const dagar=veckansDagar(vstr);
  return STATE.tidrader.filter(t=>t.personId===personId&&dagar.includes(t.datum));
}
function nyTidrad(datum){
  const pid=tidPerson||(aktivaPersoner()[0]||{}).id;
  if(!pid){ toast("Lägg upp en medarbetare först.","warn"); return; }
  STATE.tidrader.push({id:"td"+Date.now(),datum:datum||idag(),personId:pid,
    projektId:valtProjekt,aktivitetId:"",timmar:8,ot:1,ataRef:"",
    debiterbar:false,fakturerad:false,notering:""});
  spara(); rita();
}
function uppdTid(id,falt,varde){
  const r=STATE.tidrader.find(t=>t.id===id); if(!r) return;
  r[falt]=(falt==="timmar"||falt==="ot")?Number(varde)||0:varde;
  if(falt==="projektId") r.aktivitetId="";
  spara(); rita();
}
function uppdTidBool(id,falt,varde){
  const r=STATE.tidrader.find(t=>t.id===id); if(!r) return;
  if(r.fakturerad&&falt==="debiterbar"){ toast("Raden är fakturerad och kan inte ändras.","warn"); rita(); return; }
  r[falt]=!!varde; spara(); rita();
}
function taBortTid(id){
  const r=STATE.tidrader.find(t=>t.id===id);
  if(r&&r.fakturerad){ toast("Raden ingår i ett fakturaunderlag.","warn"); return; }
  STATE.tidrader=STATE.tidrader.filter(t=>t.id!==id); spara(); rita();
}
function bytTidVecka(steg){ tidVecka=veckaForskjut(tidVecka,steg); rita(); }
function satTidPerson(id){ tidPerson=id; rita(); }

function ritaTid(){
  if(!tidVecka) tidVecka=veckaNu();
  if(!tidPerson) tidPerson=(aktivaPersoner()[0]||{}).id||null;
  const dagar=veckansDagar(tidVecka);
  const rader=tidPerson?tidraderVecka(tidPerson,tidVecka):[];
  const m=person(tidPerson);
  const kap=m?Number(m.kapacitet)||0:0;
  const summa=rader.reduce((s,r)=>s+(Number(r.timmar)||0),0);
  const deb=rader.filter(r=>r.debiterbar).reduce((s,r)=>s+(Number(r.timmar)||0),0);
  const varde=rader.reduce((s,r)=>s+timkostnad(r),0);
  const planerat=tidPerson?planeratPerson(tidPerson,tidVecka):0;

  const dagrad=dagar.map((d,i)=>{
    const dr=rader.filter(r=>r.datum===d);
    const t=dr.reduce((s,r)=>s+(Number(r.timmar)||0),0);
    const helg=i>4;
    return `<div class="dagkol ${t?"har":""} ${helg?"helg":""}">
      <div class="dagnamn">${DAGNAMN[i]}</div>
      <div class="dagdat">${d.slice(8)}/${d.slice(5,7)}</div>
      <div class="dagtim">${t?t+" h":"–"}</div>
      <button class="btn sec mini" onclick="nyTidrad('${d}')">+</button>
    </div>`;
  }).join("");

  const tabell=`<div class="tscroll"><table><thead><tr>
      <th style="width:130px">Datum</th><th style="width:150px">Projekt</th><th>Aktivitet</th>
      <th style="width:88px" class="num">Timmar</th><th style="width:150px">Tidslag</th>
      <th style="width:110px">ÄTA/UR</th><th style="width:100px" class="num">Värde</th>
      <th style="width:96px">Debiterbar</th><th style="width:52px"></th></tr></thead><tbody>
    ${rader.length?rader.sort((a,b)=>a.datum.localeCompare(b.datum)).map(r=>`<tr${r.fakturerad?' class="fakturerad"':''}>
      <td><input type="date" value="${r.datum}" onchange="uppdTid('${r.id}','datum',this.value)"></td>
      <td><select onchange="uppdTid('${r.id}','projektId',this.value)">
        ${STATE.projekt.map(p=>`<option value="${p.id}"${p.id===r.projektId?" selected":""}>${esc(p.nr||p.namn)}</option>`).join("")}</select></td>
      <td><select onchange="uppdTid('${r.id}','aktivitetId',this.value)">
        <option value="">— välj aktivitet —</option>
        ${aktiviteterFor(r.projektId).map(a=>`<option value="${a.id}"${a.id===r.aktivitetId?" selected":""}>${esc(a.namn)}</option>`).join("")}</select></td>
      <td class="num"><input type="number" min="0" max="24" step="0.5" value="${r.timmar}"
        onchange="uppdTid('${r.id}','timmar',this.value)" style="max-width:72px;text-align:right"></td>
      <td><select onchange="uppdTid('${r.id}','ot',this.value)">
        ${OVERTID.map(([f,t])=>`<option value="${f}"${Number(f)===Number(r.ot)?" selected":""}>${esc(t.split(" (")[0])}</option>`).join("")}</select></td>
      <td><input type="text" value="${esc(r.ataRef||"")}" placeholder="UR00x"
        onchange="uppdTid('${r.id}','ataRef',this.value)"></td>
      <td class="num">${fmtSEK(Math.round(timkostnad(r)))}</td>
      <td><input type="checkbox" ${r.debiterbar?"checked":""} ${r.fakturerad?"disabled":""}
        onchange="uppdTidBool('${r.id}','debiterbar',this.checked)">
        ${r.fakturerad?'<span class="pill p-ok" style="margin-left:6px">Fakt.</span>':""}</td>
      <td><button class="btn sec mini" onclick="taBortTid('${r.id}')">✕</button></td>
    </tr>`).join(""):`<tr><td colspan="9" class="lead">Ingen tid rapporterad den här veckan.</td></tr>`}
  </tbody></table></div>`;

  /* Veckosammanställning per projekt */
  const perProjekt=STATE.projekt.map(p=>{
    const rr=rader.filter(r=>r.projektId===p.id);
    return {p, t:rr.reduce((s,r)=>s+(Number(r.timmar)||0),0), kr:rr.reduce((s,r)=>s+timkostnad(r),0)};
  }).filter(x=>x.t>0);

  document.getElementById("v-tid").innerHTML=`
    <div class="grid g4" style="margin-bottom:20px">
      ${kpi("Rapporterat",summa+" h",kap?("av "+kap+" h kapacitet"):"kapacitet ej satt",summa>kap&&kap?"warn":"")}
      ${kpi("Planerat",planerat+" h","enligt resursplanen"+(planerat&&summa?" · avvikelse "+(summa-planerat>0?"+":"")+(summa-planerat)+" h":""))}
      ${kpi("Debiterbart",deb+" h",deb?"går vidare till fakturaunderlaget":"inget märkt debiterbart")}
      ${kpi("Värde",fmtSEK(Math.round(varde)),"á-pris enligt Bilaga 06.1")}
    </div>

    <div class="card" style="margin-bottom:20px">
      <div class="kortrad">
        <div><h3>Tidrapport — ${esc(veckaEtikett(tidVecka))}</h3>
          <div class="lead">En rad per dag och arbetsmoment. Tid märkt debiterbar hamnar i fakturaunderlaget.</div></div>
        <div class="kortverktyg">
          <select onchange="satTidPerson(this.value)" style="width:auto">
            ${aktivaPersoner().map(x=>`<option value="${x.id}"${x.id===tidPerson?" selected":""}>${esc(x.namn)}</option>`).join("")}
          </select>
          <button class="btn sec mini" onclick="bytTidVecka(-1)">‹</button>
          <button class="btn sec mini" onclick="tidVecka=veckaNu();rita()">Denna vecka</button>
          <button class="btn sec mini" onclick="bytTidVecka(1)">›</button>
        </div>
      </div>
      <div class="dagrad">${dagrad}</div>
      ${tabell}
      <div class="rowbtns"><button class="btn mini" onclick="nyTidrad()">+ Ny tidrad</button></div>
    </div>

    <div class="card">
      <h3>Veckan per projekt</h3>
      <div class="lead">Summering av ${esc(m?m.namn:"vald medarbetare")}s tid.</div>
      <div class="tscroll"><table><thead><tr><th>Projekt</th><th class="num">Timmar</th>
        <th class="num">Värde</th></tr></thead><tbody>
        ${perProjekt.length?perProjekt.map(x=>`<tr><td>${taggProjekt(x.p.id)} ${esc(x.p.namn)}</td>
          <td class="num">${x.t} h</td><td class="num">${fmtSEK(Math.round(x.kr))}</td></tr>`).join("")
          :`<tr><td colspan="3" class="lead">Ingen tid registrerad.</td></tr>`}
      </tbody></table></div>
    </div>`;
}

/* ==========================================================================
   BUDGET OCH UTFALL
   ========================================================================== */
function utfallAktivitet(aid){
  const tr=STATE.tidrader.filter(t=>t.aktivitetId===aid);
  const timmar=tr.reduce((s,t)=>s+(Number(t.timmar)||0),0);
  const arbKr=tr.reduce((s,t)=>s+timkostnad(t),0);
  const kost=STATE.kostnader.filter(k=>k.aktivitetId===aid);
  const mtrl=kost.filter(k=>k.typ==="material").reduce((s,k)=>s+(Number(k.belopp)||0),0);
  const ue=kost.filter(k=>k.typ==="ue").reduce((s,k)=>s+(Number(k.belopp)||0),0);
  const ovr=kost.filter(k=>k.typ!=="material"&&k.typ!=="ue").reduce((s,k)=>s+(Number(k.belopp)||0),0);
  return {timmar, arbKr, mtrl, ue, ovr, kr:arbKr+mtrl+ue+ovr};
}
function budgetAktivitet(a){
  const snittpris=STATE.medarbetare.length
    ? STATE.medarbetare.reduce((s,m)=>s+(Number(m.apris)||0),0)/STATE.medarbetare.length : 0;
  const arb=(Number(a.budgetTim)||0)*snittpris;
  return {tim:Number(a.budgetTim)||0, arb, mtrl:Number(a.budgetMtrl)||0, ue:Number(a.budgetUE)||0,
          kr:arb+(Number(a.budgetMtrl)||0)+(Number(a.budgetUE)||0), snittpris};
}
function uppdAktivitet(id,falt,varde){
  const a=aktivitet(id); if(!a) return;
  a[falt]=(falt==="namn"||falt==="ansvarig")?varde:Number(varde)||0;
  spara(); rita();
}
function nyAktivitet(){
  STATE.aktiviteter.push({id:"ak"+Date.now(),projektId:valtProjekt,namn:"Ny aktivitet",
    budgetTim:0,budgetMtrl:0,budgetUE:0,ansvarig:""});
  spara(); rita();
}
function taBortAktivitet(id){
  if(STATE.tidrader.some(t=>t.aktivitetId===id)||STATE.kostnader.some(k=>k.aktivitetId===id)){
    toast("Aktiviteten har rapporterad tid eller kostnad.","warn"); return; }
  STATE.aktiviteter=STATE.aktiviteter.filter(a=>a.id!==id); spara(); rita();
}
function nyKostnad(){
  STATE.kostnader.push({id:"ko"+Date.now(),projektId:valtProjekt,aktivitetId:"",datum:idag(),
    typ:"material",benamning:"",belopp:0,debiterbar:false,fakturerad:false});
  spara(); rita();
}
function uppdKostnad(id,falt,varde){
  const k=STATE.kostnader.find(x=>x.id===id); if(!k) return;
  k[falt]=(falt==="belopp")?Number(varde)||0:varde;
  spara(); rita();
}
function uppdKostnadBool(id,falt,varde){
  const k=STATE.kostnader.find(x=>x.id===id); if(!k) return;
  if(k.fakturerad&&falt==="debiterbar"){ toast("Kostnaden är fakturerad.","warn"); rita(); return; }
  k[falt]=!!varde; spara(); rita();
}
function taBortKostnad(id){
  const k=STATE.kostnader.find(x=>x.id===id);
  if(k&&k.fakturerad){ toast("Kostnaden ingår i ett fakturaunderlag.","warn"); return; }
  STATE.kostnader=STATE.kostnader.filter(x=>x.id!==id); spara(); rita();
}

function ritaBudget(){
  const pid=valtProjekt, p=projekt(pid);
  const akt=aktiviteterFor(pid);
  const bud=akt.reduce((s,a)=>{const b=budgetAktivitet(a);return{tim:s.tim+b.tim,kr:s.kr+b.kr};},{tim:0,kr:0});
  const utf=akt.reduce((s,a)=>{const u=utfallAktivitet(a.id);return{tim:s.tim+u.timmar,kr:s.kr+u.kr};},{tim:0,kr:0});
  const kvar=bud.kr-utf.kr;
  const forbrukat=bud.kr?Math.round(utf.kr/bud.kr*100):0;
  const kv=p.kontraktsvarde;

function ofaktureradTid(pid){
  return STATE.tidrader.filter(t=>t.projektId===pid&&t.debiterbar&&!t.fakturerad);
}
function ofakturKostnad(pid){
  return STATE.kostnader.filter(k=>k.projektId===pid&&k.debiterbar&&!k.fakturerad);
}
function ARVODE(){ return 10; }  /* entreprenadarvode på självkostnad, ABT 06 kap. 6 §9 */

function skapaFakturaunderlag(){
  const pid=valtProjekt;
  const tid=ofaktureradTid(pid), kost=ofakturKostnad(pid);
  if(!tid.length&&!kost.length){ toast("Inget ofakturerat att sammanställa.","warn"); return; }
  const arb=tid.reduce((s,t)=>s+timkostnad(t),0);
  const netto=kost.reduce((s,k)=>s+(Number(k.belopp)||0),0);
  const arvode=netto*ARVODE()/100;
  const nr="FU"+String(STATE.fakturor.filter(f=>f.projektId===pid).length+1).padStart(3,"0");
  const datum=tid.map(t=>t.datum).concat(kost.map(k=>k.datum)).sort();
  STATE.fakturor.push({
    id:"fu"+Date.now(), projektId:pid, nr, skapad:idag(), status:"utkast",
    period:datum.length?(datum[0]+" – "+datum[datum.length-1]):idag(),
    timmar:tid.reduce((s,t)=>s+(Number(t.timmar)||0),0),
    arbete:Math.round(arb), kostnadNetto:Math.round(netto), arvode:Math.round(arvode),
    summa:Math.round(arb+netto+arvode),
    tidIds:tid.map(t=>t.id), kostIds:kost.map(k=>k.id),
    atan:[...new Set(tid.map(t=>t.ataRef).filter(Boolean))].join(", ")
  });
  tid.forEach(t=>t.fakturerad=true);
  kost.forEach(k=>k.fakturerad=true);
  spara(); rita();
  toast("Fakturaunderlag "+nr+" skapat.");
}
function angraFaktura(id){
  const f=STATE.fakturor.find(x=>x.id===id); if(!f) return;
  if(f.status==="fakturerad"){ toast("Underlaget är skickat till fakturering.","warn"); return; }
  (f.tidIds||[]).forEach(tid=>{ const t=STATE.tidrader.find(x=>x.id===tid); if(t) t.fakturerad=false; });
  (f.kostIds||[]).forEach(kid=>{ const k=STATE.kostnader.find(x=>x.id===kid); if(k) k.fakturerad=false; });
  STATE.fakturor=STATE.fakturor.filter(x=>x.id!==id);
  spara(); rita();
}
function uppdFaktura(id,falt,varde){
  const f=STATE.fakturor.find(x=>x.id===id); if(!f) return;
  f[falt]=varde; spara(); rita();
}

/* ==========================================================================
   DATA OCH BACKUP
   Datan ligger i den delade Artifact-databasen (server), inte i webbläsaren.
   Den här vyn visar var den ligger och låter dig ta ut den som fil —
   JSON för fullständig säkerhetskopia, CSV för Excel.
   ========================================================================== */

let DL = null;                 // downloads-capability, eller null
let dlKlar = false;
let importVarning = "";

async function hamtaDownloads(){
  if(dlKlar) return DL;
  dlKlar = true;
  try{
    DL = (window.claude && typeof window.claude.use==="function")
       ? await window.claude.use("downloads") : null;
  }catch(e){ DL = null; }
  if(aktivVy==="data") rita();
  return DL;
}

const CSV_TABELLER = [
  ["ur","ÄTA och hinder"], ["risker","Risker"], ["punkter","Öppna punkter"],
  ["tidrader","Tidrader"], ["kostnader","Kostnader"], ["bemanning","Bemanning"],
  ["aktiviteter","Aktiviteter och budget"], ["fakturor","Fakturaunderlag"],
  ["milstolpar","Milstolpar"], ["leveranser","Leveranser"], ["betalplan","Betalplan"],
  ["dagbok","Dagbok"], ["storningar","Störningar"], ["veckokoll","Veckokoll"],
  ["kontakter","Kontakter"], ["medarbetare","Medarbetare"], ["andringslogg","Ändringslogg"]
];

function csvVarde(v){
  if(v===null||v===undefined) return "";
  if(typeof v==="object") return JSON.stringify(v).replace(/"/g,"'");
  return String(v);
}
function byggCsv(lista){
  if(!lista || !lista.length) return "";
  const kol=[]; lista.forEach(r=>Object.keys(r).forEach(k=>{ if(!kol.includes(k)) kol.push(k); }));
  const rad=v=>{ const s=csvVarde(v); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return "﻿" + kol.join(";") + "\n" +
    lista.map(r=>kol.map(k=>rad(r[k])).join(";")).join("\n");
}

function backupPayload(){
  return {
    _format:"one-nordic-projektportfolj",
    _version:1,
    _skapad:new Date().toISOString(),
    _av:hamtaNamn()||"",
    state:packa(STATE)
  };
}

async function laddaNer(filnamn,innehall,typ){
  const dl = await hamtaDownloads();
  if(!dl){ toast("Filnedladdning är inte tillgänglig i den här vyn.","warn"); return; }
  try{
    await dl.save({filename:filnamn, data:innehall});
    toast("Sparad: "+filnamn);
  }catch(e){
    const kod=(e&&e.code)||"";
    if(kod==="declined") return;
    if(kod==="rate_limited"){ toast("Vänta en stund och försök igen.","warn"); return; }
    toast("Kunde inte spara filen"+(kod?" ("+kod+")":"")+".","bad");
  }
}

function exportJson(){
  const d=idag();
  laddaNer("Projektportfolj_backup_"+d+".json",
    JSON.stringify(backupPayload(),null,1));
}
function exportCsv(nyckel){
  const lista=STATE[nyckel]||[];
  if(!lista.length){ toast("Tabellen är tom.","warn"); return; }
  const namn=(CSV_TABELLER.find(t=>t[0]===nyckel)||[,nyckel])[1].replace(/[^\wåäöÅÄÖ]+/g,"_");
  laddaNer("Portfolj_"+namn+"_"+idag()+".csv", byggCsv(lista));
}

function valjImportfil(){ document.getElementById("importfil")?.click(); }
function lasImportfil(input){
  const f=input.files&&input.files[0];
  if(!f) return;
  const lasare=new FileReader();
  lasare.onload=async ()=>{
    try{
      const d=JSON.parse(lasare.result);
      const s=d&&d.state ? d.state : d;
      if(!s || !Array.isArray(s.projekt)) throw new Error("Filen innehåller ingen portföljdata.");
      const antal=Object.keys(s).filter(k=>Array.isArray(s[k])).reduce((n,k)=>n+s[k].length,0);
      if(!await bekrafta("All data i portföljen ersätts med filens innehåll: "+antal+" rader i "+
         Object.keys(s).length+" tabeller. Åtgärden går inte att ångra.",
         {titel:"Skriv över portföljen?",ok:"Skriv över"}))
        { input.value=""; return; }
      STATE=normalisera(s);
      efterInlasning();
      spara(); byggNav(); rita();
      toast("Säkerhetskopian är återställd.");
      importVarning="";
    }catch(e){
      importVarning=String(e.message||e);
      rita();
    }
    input.value="";
  };
  lasare.onerror=()=>{ importVarning="Filen kunde inte läsas."; rita(); };
  lasare.readAsText(f);
}

/* ==========================================================================
   BILAGOR — foton och filer på ÄTA, milstolpar, dagbok och störning
   Filen lagras i artifactens egen assetlagring. Raden i STATE.bilagor är
   indexet: den håller assetId, var bilagan hör hemma och beskrivningen.
   ========================================================================== */

let ASSETS=null, assetsKlar=false, laddarBilaga="";

async function hamtaAssets(){
  if(assetsKlar) return ASSETS;
  assetsKlar=true;
  try{
    ASSETS = (window.claude && typeof window.claude.use==="function")
      ? await window.claude.use("assets") : null;
  }catch(e){ ASSETS=null; }
  rita();
  return ASSETS;
}

function bilagor(typ,refId){
  return (STATE.bilagor||[]).filter(b=>b.typ===typ&&b.refId===refId);
}
function arBild(b){ return /^image\//.test(b.contentType||""); }
function bilagaUrl(b){ return "/_blob/"+b.assetId; }
function fmtStorlek(n){
  if(!n) return "";
  return n>=1048576 ? (n/1048576).toFixed(1).replace(".",",")+" MB"
       : Math.max(1,Math.round(n/1024))+" kB";
}

async function laddaUppBilagor(typ,refId,projektId,input){
  const filer=[...(input.files||[])];
  input.value="";
  return laddaUppFiler(typ,refId,projektId,filer);
}

/* Gemensam väg för filväljare, kamera och urklipp. */
async function laddaUppFiler(typ,refId,projektId,filer){
  if(!filer||!filer.length) return;
  const a=await hamtaAssets();
  if(!a){ toast("Bilagor kräver att sidan öppnas via artifact-länken.","warn"); return; }
  if(!Array.isArray(STATE.bilagor)) STATE.bilagor=[];
  laddarBilaga=typ+":"+refId; rita();
  let n=0, fel=0;
  for(const f of filer){
    try{
      const res=await a.upload(f, f.type?undefined:{type:"application/pdf"});
      STATE.bilagor.push({
        id:"bl"+Date.now()+"_"+Math.floor(Math.random()*9999),
        assetId:res.id, typ, refId, projektId:projektId||valtProjekt,
        namn:f.name||"bilaga", contentType:res.contentType||f.type||"",
        storlek:res.sizeBytes||f.size||0,
        uppladdad:new Date().toISOString(), av:hamtaNamn()||"", notering:""
      });
      n++;
    }catch(e){
      fel++;
      const k=(e&&e.code)||"";
      if(k==="too_large") toast("Filen är för stor (max 20 MB).","bad");
      else if(k==="invalid_request") toast("Filtypen stöds inte.","bad");
      else if(k==="not_granted") toast("Uppladdning kräver skrivbehörighet.","warn");
    }
  }
  laddarBilaga="";
  if(n){ spara(); toast(n+(n===1?" bilaga":" bilagor")+" uppladdad"+(n===1?"":"e")+"."); }
  rita();
}

async function taBortBilaga(id){
  const b=(STATE.bilagor||[]).find(x=>x.id===id);
  if(!b) return;
  if(!await bekrafta("Bilagan tas bort ur portföljen och ur lagringen.",{titel:"Ta bort "+(b.namn||"bilagan")+"?"})) return;
  const a=await hamtaAssets();
  if(a){ try{ await a.delete(b.assetId); }catch(e){} }
  STATE.bilagor=STATE.bilagor.filter(x=>x.id!==id);
  spara(); rita();
}
function uppdBilaga(id,falt,v){
  const b=(STATE.bilagor||[]).find(x=>x.id===id); if(!b) return;
  b[falt]=v; spara();
}

/* ---------- Visningskomponent ---------- */
let pasteMal=null;
function satPasteMal(typ,refId,projektId){ pasteMal={typ,refId,projektId}; }
document.addEventListener("paste", ev=>{
  if(!pasteMal) return;
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&ae.type!=="file") return;
  const bilder=[...((ev.clipboardData&&ev.clipboardData.items)||[])]
    .filter(i=>i.kind==="file"&&/^image\//.test(i.type));
  if(!bilder.length) return;
  ev.preventDefault();
  const filer=bilder.map((i,n)=>{
    const f=i.getAsFile();
    if(!f) return null;
    const ext=(i.type.split("/")[1]||"png").replace("jpeg","jpg");
    return new File([f],"urklipp-"+idag()+(n?"-"+(n+1):"")+"."+ext,{type:i.type});
  }).filter(Boolean);
  laddaUppFiler(pasteMal.typ,pasteMal.refId,pasteMal.projektId,filer);
});

function skrivUtAvisering(id){
  const u=STATE.ur.find(x=>x.id===id);
  if(!u){ toast("Posten hittades inte.","bad"); return; }
  let ruta=document.getElementById("aviseringutskrift");
  if(!ruta){
    ruta=document.createElement("div");
    ruta.id="aviseringutskrift";
    document.body.appendChild(ruta);
  }
  ruta.innerHTML=ataAvisering(u);
  const gammal=document.title;
  document.title=(u.klass==="hinder"?"Hinderunderrattelse_":"ATA_avisering_")+
    (projekt(u.projektId).nr||"")+"_"+u.nr+"_"+idag();
  const bilder=[...ruta.querySelectorAll("img")];
  const kor=()=>{ window.print();
    setTimeout(()=>{ document.title=gammal; ruta.innerHTML=""; },900); };
  const oladdade=bilder.filter(i=>!i.complete);
  if(!oladdade.length) return kor();
  let kvar=oladdade.length;
  const klar=()=>{ if(--kvar<=0) kor(); };
  oladdade.forEach(i=>{ i.addEventListener("load",klar,{once:true});
    i.addEventListener("error",klar,{once:true}); });
  setTimeout(()=>{ if(kvar>0){ kvar=0; kor(); } },4000);
}

function forhandsgranskaAvisering(id){
  const u=STATE.ur.find(x=>x.id===id); if(!u) return;
  const ruta=document.getElementById("avforhand");
  if(!ruta) return;
  if(ruta.dataset.for===id && !ruta.classList.contains("hidden")){
    ruta.classList.add("hidden"); ruta.dataset.for=""; return;
  }
  ruta.dataset.for=id;
  ruta.innerHTML=ataAvisering(u);
  ruta.classList.remove("hidden");
  ruta.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ==========================================================================
   AGENDA — det som brinner och det som ligger närmast
   Tre spår: frister som löper, 30 dagar framåt, och möten.
   ========================================================================== */

function fristrader(){
  const ut=[];
  STATE.ur.forEach(u=>{
    if(u.status==="stangd"||u.status==="utgar") return;
    const l=underrattelseLage(u);
    if(!l||l.ok) return;
    const h=u.handelseDatum?timmarSedan(u.handelseDatum):null;
    ut.push({
      niva: l.varning?"forfallen":(h!==null&&h>=12?"akut":(h===null?"oklar":"snart")),
      titel: u.nr+" "+(u.benamning||""),
      text: l.txt, pid: u.projektId, typ:"ÄTA-frist",
      timmar: h, sort: l.varning?0:(h===null?2:1), id:u.id, vy:"ata"
    });
  });
  (STATE.hseqIncidenter||[]).forEach(i=>{
    if(i.rapporterad) return;
    const l=incidentLage(i);
    if(l.ok) return;
    const h=timmarSedan(i.datum);
    ut.push({
      niva: l.varning?"forfallen":"akut",
      titel: (INCIDENTTYP.find(t=>t[0]===i.typ)||[,"Incident"])[1]+" "+(i.datum||""),
      text: l.txt, pid: i.projektId, typ:"Incidentrapport",
      timmar: h, sort: l.varning?0:1, id:i.id, vy:"hseq"
    });
  });
  return ut.sort((a,b)=>a.sort-b.sort||(b.timmar||0)-(a.timmar||0));
}
/* Poster där fristen inte ens kan räknas — egen rad, inte bland de löpande. */
function fristUtanDatum(){
  return STATE.ur.filter(u=>u.status!=="stangd"&&u.status!=="utgar"
    &&!u.underrattelseDatum&&!u.handelseDatum);
}

function agendarader(dagar){
  const ut=[];
  const lagg=(datum,titel,typ,pid,extra)=>{
    if(!datum) return;
    const d=dagarTill(datum);
    if(d===null||d<0||d>dagar) return;
    ut.push({datum,d,titel,typ,pid,extra:extra||""});
  };
  STATE.milstolpar.forEach(m=>{ if(m.status!=="klar") lagg(m.datum,m.titel,"Milstolpe",m.projektId); });
  STATE.leveranser.forEach(l=>lagg(l.datum,l.benamning+(l.leverantor&&l.leverantor!=="—"?" — "+l.leverantor:""),
    "Leverans",l.projektId,l.status==="avvikelse"?"avvikelse":""));
  STATE.betalplan.forEach(b=>{ if(b.status!=="fakturerad")
    lagg(b.datum,b.kod+" "+b.benamning,"Fakturering",b.projektId); });
  STATE.punkter.forEach(p=>{ if(p.status!=="klarmarkerad")
    lagg(p.forfaller,p.titel,"Punkt",p.projektId); });
  (STATE.byggmoten||[]).forEach(m=>{ if(m.status!=="justerat")
    lagg(m.datum,"Byggmöte "+(m.nr||""),"Möte",m.projektId); });
  STATE.projekt.forEach(p=>lagg(p.fardigstallande,"Kontrakterad färdigställandetid","Kontrakt",p.id));
  return ut.sort((a,b)=>a.datum.localeCompare(b.datum));
}

let agendaHorisont=30;
function satAgendaHorisont(n){ agendaHorisont=Number(n)||30; rita(); }

const AGENDAIKON={Milstolpe:"◆",Leverans:"▣",Fakturering:"◈",Punkt:"●",Möte:"▤",Kontrakt:"★"};

function agendaPanel(){
  const frister=fristrader().filter(f=>f.niva!=="oklar");
  const utanDatum=fristUtanDatum();
  const forfallna=frister.filter(f=>f.niva==="forfallen");
  const rader=agendarader(agendaHorisont);
  const denVecka=rader.filter(r=>r.d<=7);

  return `<div class="agenda">
    <div class="agendahead">
      <div>
        <h3>Att hantera</h3>
        <div class="lead">Frister som löper, och allt med datum de närmaste ${agendaHorisont} dagarna.</div>
      </div>
      <div class="kortverktyg">
        <select onchange="satAgendaHorisont(this.value)" style="width:auto">
          ${[14,30,60,90].map(n=>`<option value="${n}"${n===agendaHorisont?" selected":""}>${n} dagar</option>`).join("")}
        </select>
      </div>
    </div>

    <div class="agendakol">
      <div class="agendafrister ${forfallna.length?"larm":frister.length?"varning":"lugn"}">
        <div class="afhead">
          <b>${forfallna.length?"⚠ Frist överskriden":frister.length?"⏱ Frister som löper":"✓ Inga öppna frister"}</b>
          ${frister.length?`<span class="afcount">${frister.length}</span>`:""}
        </div>
        ${frister.length?`<div class="aflista">
          ${frister.slice(0,6).map(f=>`<div class="afrad ${f.niva}" onclick="visa('${f.vy}')">
            <span class="afprick"></span>
            <div class="aftxt"><b>${esc(f.titel)}</b><span>${esc(f.text)}</span></div>
            ${taggProjekt(f.pid)}
          </div>`).join("")}
          ${frister.length>6?`<div class="afmer">och ${frister.length-6} till — se ÄTA och hinder</div>`:""}
        </div>`:`<div class="aftom">Alla ÄTA och hinder med händelsedatum är underrättade,
          alla incidenter rapporterade.</div>`}
        ${utanDatum.length?`<div class="afsaknas" onclick="visa('ata')">
          <b>${utanDatum.length} post${utanDatum.length===1?"":"er"} saknar händelsedatum</b>
          <span>24-timmarsfristen kan inte räknas förrän datumet är ifyllt:
            ${utanDatum.slice(0,5).map(u=>esc(u.nr)).join(", ")}${utanDatum.length>5?" m.fl.":""}</span>
        </div>`:""}
      </div>

      <div class="agendalista">
        <div class="alhead">
          <b>Kommande</b>
          <span>${denVecka.length} inom 7 dagar · ${rader.length} inom ${agendaHorisont}</span>
        </div>
        ${rader.length?`<div class="altabell">
          ${rader.slice(0,14).map(r=>`<div class="alrad ${r.d<=3?"nara":r.d<=7?"snart":""}">
            <span class="aldag">${r.d===0?"idag":r.d===1?"i morgon":r.d+" d"}</span>
            <span class="altyp" title="${esc(r.typ)}">${AGENDAIKON[r.typ]||"•"}</span>
            <span class="altitel">${esc(r.titel)}
              ${r.extra==="avvikelse"?'<span class="pill p-bad">Avvikelse</span>':""}</span>
            <span class="aldatum">${esc(r.datum)}</span>
            ${taggProjekt(r.pid)}
          </div>`).join("")}
          ${rader.length>14?`<div class="afmer">och ${rader.length-14} till — se Tidplan</div>`:""}
        </div>`:`<div class="aftom">Inget med datum de närmaste ${agendaHorisont} dagarna.</div>`}
      </div>
    </div>
  </div>`;
}

/* ==========================================================================
   PROJEKTUPPSTART — ett klick från vunnet anbud till komplett struktur
   Skapar projekt, betalplan M1–M7, milstolpar, underlagsrader, aktiviteter,
   rapportstatus och en första UR-post. Handbokens 11 kapitel och
   veckochecklistan är redan per projekt och blir aktiva direkt.
   ========================================================================== */

let uppstartFalt={
  nr:"", namn:"", ort:"", mw:"", mwh:"", fardigstallande:"",
  natagare:"", natkontakt:"", fiber:"", kontraktsvarde:"",
  mapp:"", bestallare:"Ingrid Capacity AB", mall:"bess"
};

function oppnaUppstart(){ uppstartOppen=true; rita(); }
function stangUppstart(){ uppstartOppen=false; rita(); }
function satUppstart(falt,v){ uppstartFalt[falt]=v; }

  bess: {namn:"BESS EPC under ABT 06",
    beskrivning:"Batteripark med M1–M7, BESS-milstolpar, slutdokumentation enligt Appendix 03.7 och sju standardaktiviteter.",
    andelar:[["M1",10,"Lyft 1"],["M2",25,"Lyft 2"],["M3",25,"Lyft 3"],["M4",20,"Lyft 4"],
             ["M5",15,"Lyft 5"],["M6",3,"Lyft 6 — avslut"],["M7",2,"Lyft 7 — slutavräkning"]],
    aktiviteter:["Projektering och handlingar","Mark och kanalisation","Betong och fundament",
                 "MV-montage och ställverk","LV, AC och jordning","Driftsättning och provning",
                 "Dokumentation och avslut"],
    milstolpar:true},
  nat: {namn:"Nätentreprenad / Lokalnätstjänst",
    beskrivning:"Nätprojekt utan BESS-specifika milstolpar. Betalplan och aktiviteter sätts efter kontraktet.",
    andelar:[["M1",20,"Lyft 1"],["M2",30,"Lyft 2"],["M3",30,"Lyft 3"],["M4",15,"Lyft 4"],
             ["M5",5,"Slutavräkning"]],
    aktiviteter:["Beredning och projektering","Schakt och kanalisation","Kabelförläggning",
                 "Stationsarbeten","Driftsättning","Dokumentation och avslut"],
    milstolpar:false},
  tom: {namn:"Tomt projekt",
    beskrivning:"Endast projektuppgifter. Betalplan, milstolpar och aktiviteter lägger du upp själv.",
    andelar:[], aktiviteter:[], milstolpar:false}
};

function skapaProjekt(){
  const f=uppstartFalt;
  const namn=String(f.namn||"").trim();
  if(!namn){ toast("Projektet behöver ett namn.","warn"); return; }

  let id=namn.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"") || ("p"+Date.now());
  if(String(f.nr||"").trim()) id=String(f.nr).trim();
  if(STATE.projekt.some(p=>p.id===id)) id=id+"-"+Date.now().toString().slice(-4);

  const mall=UPPSTART_MALLAR[f.mall]||UPPSTART_MALLAR.bess;
  const num=v=>{ const n=Number(String(v).replace(/\s/g,"").replace(",",".")); return isFinite(n)&&n>0?n:null; };

  /* 1 — projektet */
  STATE.projekt.push({
    id, nr:String(f.nr||"").trim(), namn, ort:String(f.ort||"").trim()||namn,
    mw:num(f.mw), mwh:num(f.mwh), kontraktsvarde:num(f.kontraktsvarde),
    natagare:String(f.natagare||"").trim(), natkontakt:String(f.natkontakt||"").trim(),
    fiber:String(f.fiber||"").trim(), fardigstallande:f.fardigstallande||"",
    status:"Planering", anteckning:"",
    mapp:String(f.mapp||"").trim(), bestallare:String(f.bestallare||"").trim()
  });

  /* 2 — betalplan */
  mall.andelar.forEach(([kod,andel,benamning],i)=>{
    STATE.betalplan.push({id:"b"+Date.now()+"_"+i, projektId:id, kod, andel,
      benamning, status:"kvar", datum:""});
  });

  /* 3 — milstolpar i huvudtidplanen */
  if(mall.milstolpar){
    ONEP_MILSTOLPAR.forEach((titel,i)=>{
      STATE.milstolpar.push({id:"m"+Date.now()+"_"+i, projektId:id, titel, datum:"", status:"planerad"});
    });
  }

  /* 4 — underlagsrader för M1–M7 */
  mall.andelar.forEach(([kod])=>{
    if(MILSTOLPE_MODELL.some(m=>m.kod===kod)) mstatusRad(id,kod);
  });

  /* 5 — aktiviteter med budget */
  mall.aktiviteter.forEach((namnA,i)=>{
    STATE.aktiviteter.push({id:"ak"+Date.now()+"_"+i, projektId:id, namn:namnA,
      budgetTim:0, budgetMtrl:0, budgetUE:0, ansvarig:""});
  });

  /* 6 — rapportstatus och beställare */
  const r=rapportRad(id);
  r.mottagare=String(f.bestallare||"").trim()||"Beställaren";

  /* 7 — första UR-posten: projektering är nästan alltid ett eget ärende */
  if(f.mall!=="tom"){
    STATE.ur.push({id:"u"+Date.now(), projektId:id, nr:"UR001",
      benamning:"Projektering", status:"oppen", klass:"ata",
      datum:idag(), handelseDatum:"", underrattelseDatum:""});
  }

  /* 8 — en öppen punkt som startar kontraktsdisciplinen */
  STATE.punkter.push({id:"p"+Date.now(), projektId:id,
    titel:"Startmöte — kalla, förbered kontraktshandlingar och meddela behörigheter",
    agare:hamtaNamn()||"Projektledare",
    forfaller:"", status:"oppen"});

  loggaHandelse("projekt",id,"—","projekt skapat ur mall: "+mall.namn);
  valtProjekt=id;
  uppstartOppen=false;
  uppstartFalt={nr:"",namn:"",ort:"",mw:"",mwh:"",fardigstallande:"",natagare:"",natkontakt:"",
    fiber:"",kontraktsvarde:"",mapp:"",bestallare:"Ingrid Capacity AB",mall:"bess"};
  spara(); byggNav(); visa("oversikt");
  toast("Projektet är upplagt. Gå igenom kapitel 2.1 i handboken för att organisera entreprenaden.");
}

}

/* ---------- Mobiltabeller: etiketter från kolumnrubrikerna ---------- */
function mobilTabeller(){
  document.querySelectorAll("main table").forEach(t=>{
    const rub=[...t.querySelectorAll("thead th")].map(th=>th.textContent.trim());
    if(!rub.length) return;
    t.querySelectorAll("tbody tr").forEach(tr=>{
      [...tr.children].forEach((td,i)=>{
        if(rub[i]&&!td.getAttribute("data-label")) td.setAttribute("data-label",rub[i]);
      });
    });
  });
}
