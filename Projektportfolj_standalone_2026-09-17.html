<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ONE Nordic Projektportfölj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  /* ONE Nordic-paletten — oförändrad */
  --one-bla:#00b6de; --one-djup:#005f76; --turkos:#3cb8ba; --duvbla:#5b9bd5;
  --himmel:#aee0e8; --rod:#ea5549; --orange:#f38d3d;
  --web1:#F5F7F9; --web2:#bdd5d7; --morkgra:#304047;
  --font-h:'Roboto Slab',Arial,serif; --font-b:'Open Sans',Arial,sans-serif;

  /* Semantiska ytor — styr ljust/mörkt */
  --surface:#ffffff; --ground:#F5F7F9; --sunken:#eef2f4; --raised:#ffffff;
  --ink:#263840; --ink-soft:#61757e; --ink-faint:#8a9aa1;
  --hairline:#e6edf0; --hairline-stark:#d8e2e6;
  --sidebar-1:#005f76; --sidebar-2:#053f4c; --sidebar-3:#043540;

  /* Funktionella toner */
  --ok-bg:#e3f4f4; --ok-ink:#0f6b6d;
  --warn-bg:#fdefe2; --warn-ink:#a85a12;
  --bad-bg:#fde9e7; --bad-ink:#b8322a;
  --info-bg:#e2f5fa; --info-ink:#00728f;

  --r:14px; --r-sm:10px; --border:1px solid var(--hairline);
  --sidebar-w:252px;
  --sh-sm:0 1px 2px rgba(13,45,54,.04),0 2px 10px rgba(13,45,54,.05);
  --sh-md:0 4px 14px rgba(0,95,118,.09),0 12px 32px rgba(0,95,118,.08);
  --sh-lift:0 10px 24px rgba(0,95,118,.14),0 22px 48px rgba(0,95,118,.12);
  --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface:#16272e; --ground:#0d1b21; --sunken:#11222a; --raised:#1b2f37;
    --ink:#e8f1f4; --ink-soft:#9ab0b9; --ink-faint:#7b929c;
    --hairline:#24404a; --hairline-stark:#2e4d58;
    --web1:#11222a; --morkgra:#e8f1f4;
    --sidebar-1:#06323e; --sidebar-2:#042833; --sidebar-3:#03202a;
    --ok-bg:#10393b; --ok-ink:#6fd4d0;
    --warn-bg:#3d2a16; --warn-ink:#f0ac6a;
    --bad-bg:#3d1e1c; --bad-ink:#f0958c;
    --info-bg:#0d3644; --info-ink:#63d2ee;
    --sh-sm:0 1px 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.28);
    --sh-md:0 6px 18px rgba(0,0,0,.45);
    --sh-lift:0 14px 34px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --surface:#16272e; --ground:#0d1b21; --sunken:#11222a; --raised:#1b2f37;
  --ink:#e8f1f4; --ink-soft:#9ab0b9; --ink-faint:#7b929c;
  --hairline:#24404a; --hairline-stark:#2e4d58;
  --web1:#11222a; --morkgra:#e8f1f4;
  --sidebar-1:#06323e; --sidebar-2:#042833; --sidebar-3:#03202a;
  --ok-bg:#10393b; --ok-ink:#6fd4d0;
  --warn-bg:#3d2a16; --warn-ink:#f0ac6a;
  --bad-bg:#3d1e1c; --bad-ink:#f0958c;
  --info-bg:#0d3644; --info-ink:#63d2ee;
  --sh-sm:0 1px 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.28);
  --sh-md:0 6px 18px rgba(0,0,0,.45);
  --sh-lift:0 14px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-b);color:var(--ink);background:var(--sunken);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--font-h);margin:0}
a{color:var(--one-djup)}

/* ---------- App shell ---------- */
.appshell{display:flex;align-items:stretch;min-height:100vh}
.navback{display:none;position:fixed;inset:0;background:rgba(8,26,32,.5);z-index:29}
.navback.show{display:block}

/* ---------- Sidebar ---------- */
.sidebar{width:var(--sidebar-w);flex:0 0 auto;display:flex;flex-direction:column;
  background:linear-gradient(175deg,var(--one-djup) 0%,#053f4c 78%,#043540 100%);color:#fff;
  position:sticky;top:0;align-self:flex-start;height:100vh;z-index:30;transition:transform .28s ease;
  box-shadow:var(--sh-md)}
.sidebar-top{display:flex;align-items:center;padding:22px 22px 14px}
.sidebar-top .mark-img{display:block;height:26px;width:auto;filter:brightness(0) invert(1)}
.sidebar-top .dom{font-size:10.5px;color:rgba(255,255,255,.6);margin-top:5px;letter-spacing:.02em}
.sidebar-title{padding:2px 22px 18px}
.sidebar-title h1{font-size:16.5px;font-weight:600;color:#fff;line-height:1.3}
.sidebar-title .sub{font-size:10.5px;color:rgba(255,255,255,.55);margin-top:5px;line-height:1.5}
.spacer{flex:1}

.sidenav{flex:1;overflow-y:auto;padding:6px 14px;display:flex;flex-direction:column;gap:2px}
.sidenav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;
  border:none;border-radius:9px;color:rgba(255,255,255,.75);font-family:var(--font-b);font-size:13.5px;
  font-weight:600;padding:10px 12px;cursor:pointer;position:relative;
  transition:background .16s ease,color .16s ease}
.sidenav button svg{flex:0 0 auto;width:17px;height:17px;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8;transition:stroke .16s ease}
.sidenav button:hover{background:rgba(255,255,255,.09);color:#fff}
.sidenav button:hover svg{opacity:1}
.sidenav button.on{background:rgba(255,255,255,.15);color:#fff}
.sidenav button.on svg{stroke:var(--one-bla);opacity:1}
.sidenav button.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;
  border-radius:0 4px 4px 0;background:var(--one-bla)}

.sidebar-curve{padding:8px 22px 2px;opacity:.95}
.sidebar-foot{padding:16px 22px 22px;border-top:1px solid rgba(255,255,255,.13)}
.namnfalt{display:flex;flex-direction:column;gap:5px;font-size:10.5px;color:rgba(255,255,255,.6);
  text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.namnfalt input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.08);color:#fff;font-size:12.5px;text-transform:none;letter-spacing:0;
  font-weight:400;transition:background .15s,border-color .15s}
.namnfalt input::placeholder{color:rgba(255,255,255,.4)}
.namnfalt input:focus{outline:none;border-color:var(--one-bla);background:rgba(255,255,255,.16)}
.conn{display:flex;align-items:center;gap:7px;font-size:11px;color:rgba(255,255,255,.6);margin-top:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--orange);flex:0 0 auto;transition:background .2s}
.dot.ok{background:var(--turkos)}.dot.err{background:var(--rod)}

/* ---------- Topbar ---------- */
.appmain{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:17px 30px;background:var(--surface);
  border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:15}
.navtoggle{display:none;background:none;border:none;font-size:21px;line-height:1;color:var(--one-djup);
  cursor:pointer;padding:2px 4px}
.pagetitle{font-family:var(--font-h);font-size:20px;font-weight:600;color:var(--ink)}

main{max-width:1240px;margin:0 auto;padding:26px 30px 64px;width:100%}
section{display:none}
section.on{display:block;animation:sectionIn .3s ease}
@keyframes sectionIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

@media(max-width:980px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .navtoggle{display:block}
  main{padding:20px 16px 56px}
  .topbar{padding:14px 16px}
}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:16px}
.g5{grid-template-columns:repeat(5,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
@media(max-width:520px){.g5,.g4{grid-template-columns:1fr}}
.grid>*{min-width:0}
.card{background:var(--surface);border-radius:var(--r);border:var(--border);padding:18px;min-width:0}
.card h3{font-size:15px;color:var(--one-djup);margin-bottom:4px}
.card .lead{font-size:12px;color:var(--ink-soft);margin-bottom:14px}

.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600}
.kpi .val{font-family:var(--font-h);font-size:30px;font-weight:700;color:var(--one-djup);margin-top:6px;line-height:1}
.kpi .val.warn{color:var(--orange)}.kpi .val.bad{color:var(--rod)}
.kpi .hint{font-size:12px;color:var(--ink-soft);margin-top:6px}

/* ---------- Project card ---------- */
.pcard{background:var(--surface);border-radius:var(--r);border:var(--border);border-top:4px solid var(--one-bla);padding:18px;min-width:0}
.pcard.b{border-top-color:var(--turkos)}
.pcard.c{border-top-color:var(--duvbla)}
.pcard.d{border-top-color:var(--orange)}
.pnr{font-family:var(--font-b);font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--one-bla)}
.pcard.b .pnr{color:var(--turkos)}
.pcard.c .pnr{color:var(--duvbla)}
.pcard.d .pnr{color:var(--orange)}
.pcard h2{font-size:19px;margin:4px 0 2px}
.pcard h2 a{transition:color .15s}
.pcard h2 a:hover{color:var(--one-bla)}
.pmeta{font-size:12px;color:var(--ink-soft)}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 6px}
.pstat{background:var(--sunken);border-radius:6px;padding:10px}
.pstat .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600}
.pstat .v{font-family:var(--font-h);font-size:17px;font-weight:700;color:var(--ink);margin-top:3px}
.bar{height:8px;background:var(--hairline);border-radius:4px;overflow:hidden;margin-top:12px}
.bar>span{display:block;height:100%;background:var(--one-bla)}
.pcard.b .bar>span{background:var(--turkos)}
.pcard.c .bar>span{background:var(--duvbla)}
.pcard.d .bar>span{background:var(--orange)}
.barlab{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:5px}
.pctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pctop select{width:auto;font-size:11px;font-weight:700;letter-spacing:.03em;padding:4px 8px;
  border-radius:20px;background:var(--sunken);border-color:var(--hairline-stark);color:var(--ink)}
.pnext{display:flex;align-items:center;gap:8px;font-size:12px;background:var(--sunken);
  border-radius:6px;padding:8px 10px;margin:12px 0}
.pnext.bess{background:var(--ok-bg);border:1px solid #bfe9de}
.pnext-d{font-family:var(--font-h);font-weight:700;font-size:14px;color:var(--one-djup);white-space:nowrap}

/* ---------- Hub: BESS-nedräkning + gantt ---------- */
.bhero{display:flex;align-items:center;gap:18px;background:var(--one-djup);color:#fff;
  border-radius:var(--r);padding:18px 22px;margin-bottom:16px}
.bhero.urgent{background:#0d4a5c}
.bhero.past{background:#3f5560}
.bh-num{font-family:var(--font-h);font-size:40px;font-weight:700;line-height:1;white-space:nowrap}
.bh-lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.bh-sub{font-size:14px;margin-top:2px}
.gwrap{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-top:12px}

/* ---------- Site Header — kompakt statusrad per site ---------- */
.sitebar{border:1px solid var(--hairline);border-radius:var(--r);background:var(--surface);
  overflow:hidden;margin-bottom:16px}
.sitebar-top{background:var(--one-djup);color:#fff;padding:10px 18px;font-size:12.5px;
  font-weight:600;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.sitebar-top b{font-family:var(--font-h);font-size:14.5px;font-weight:700}
.sitebar-top span{opacity:.88}
.sitebar-cols{display:grid;grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.sitebar-cols{grid-template-columns:1fr}}
.sitebar-col{padding:12px 18px;border-left:1px solid var(--hairline)}
.sitebar-col:first-child{border-left:none}
@media(max-width:820px){.sitebar-col{border-left:none;border-top:1px solid var(--hairline)}
  .sitebar-col:first-child{border-top:none}}
.sitebar-col h5{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-faint);font-weight:700}
.sitebar-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
  padding:3px 0;color:var(--ink)}
.sitebar-row span:first-child{color:var(--ink-soft)}
.sitebar-row b{font-variant-numeric:tabular-nums}
.card,.pcard{overflow-x:clip}
@media(max-width:640px){main td[data-label]::before{flex-basis:38%;min-width:0;word-break:break-word}main td{min-width:0}main td>*{max-width:100%}}
.gchip{flex:0 0 auto;min-width:132px;background:var(--sunken);border-radius:8px;padding:10px 12px;
  border-left:3px solid var(--web2)}
.gchip.soon{border-left-color:var(--duvbla)}
.gchip.urgent{border-left-color:var(--orange)}
.gchip.past{border-left-color:var(--rod);opacity:.75}
.gchip.bess{background:var(--ok-bg)}
.gd{font-family:var(--font-h);font-weight:700;font-size:18px;color:var(--one-djup)}
.gd span{font-size:11px;font-weight:400;margin-left:2px}
.gt{font-size:12px;font-weight:600;margin:3px 0 6px;min-height:2.4em}
.gp{margin-bottom:4px}
.gdatum{font-size:11px;color:var(--ink-soft)}

/* ---------- Hub: avvikelser & flaggor ---------- */
.flaggor h3{display:flex;align-items:center;gap:8px}
.fcount{background:var(--rod);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 9px}
.flist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.fitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:6px;background:var(--sunken);
  flex-wrap:wrap;transition:background .15s}
.fitem.hog{background:var(--bad-bg)}
.fitem:hover{background:var(--hairline)}
.fitem.hog:hover{background:var(--bad-bg)}
.fdot{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:0 0 auto}
.fitem.hog .fdot{background:var(--rod)}
.ftxt{flex:1;font-size:13px;min-width:200px}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
  font-weight:700;padding:8px 10px;border-bottom:2px solid var(--hairline);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--hairline);vertical-align:top}
tbody tr:hover{background:var(--sunken)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Pills / badges ---------- */
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok-ink)}
.p-go{background:var(--info-bg);color:var(--info-ink)}
.p-wait{background:var(--hairline);color:var(--ink-soft)}
.p-warn{background:var(--warn-bg);color:var(--warn-ink)}
.p-bad{background:var(--bad-bg);color:var(--bad-ink)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:4px;background:var(--info-bg);color:var(--info-ink);white-space:nowrap}
.tag.b{background:var(--ok-bg);color:var(--ok-ink)}
.tag.c{background:var(--info-bg);color:var(--info-ink)}
.tag.d{background:var(--warn-bg);color:var(--warn-ink)}
.ant{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;
  border-radius:4px;background:var(--warn-bg);color:var(--warn-ink);border:1px solid #f6d5b4}
.lockbadge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 8px;
  border-radius:4px;background:var(--sunken);color:var(--ink);border:1px solid var(--hairline-stark);
  vertical-align:middle;margin-left:8px}

/* ---------- Inputs ---------- */
select,input[type=text],input[type=date],input[type=number],textarea{
  font-family:var(--font-b);font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--hairline-stark);border-radius:5px;padding:5px 7px;width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--one-bla);outline-offset:-1px;border-color:var(--one-bla)}
.btn{font-family:var(--font-b);font-weight:600;font-size:13px;border-radius:6px;padding:8px 15px;
  cursor:pointer;border:none;background:var(--one-bla);color:#fff}
.btn:hover{background:#00a3c7}
.btn.sec{background:transparent;border:2px solid var(--one-bla);color:var(--one-bla);padding:6px 13px}
.btn.sec:hover{background:var(--info-bg)}
.btn.mini{font-size:12px;padding:5px 10px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---------- Risk matrix ---------- */
.rv{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;
  border-radius:5px;font-weight:700;font-size:13px;color:#fff}
.rv.l{background:var(--turkos)}.rv.m{background:var(--orange)}.rv.h{background:var(--rod)}

/* ---------- Timeline ---------- */
.tl{position:relative;background:var(--surface);border:var(--border);border-radius:var(--r);padding:18px 18px 8px;overflow-x:auto}
.tlinner{min-width:720px;position:relative}
.tlmonths{display:flex;border-bottom:1px solid var(--hairline);margin-bottom:6px}
.tlmonths div{flex:1;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;
  letter-spacing:.06em;padding:0 0 6px 6px;border-left:1px solid var(--hairline)}
.tlname{font-size:11.5px;font-weight:700;color:var(--one-djup);padding:14px 0 2px}
.tlrow{position:relative;height:104px;border-bottom:1px solid var(--hairline)}
.tlrow:last-child{border-bottom:none}
.tlaxis{position:absolute;left:0;right:0;top:50px;height:2px;background:var(--hairline)}
.tlmark{position:absolute;top:0;height:104px;width:108px;transform:translateX(-50%);
  text-align:center;z-index:3}
.tlmark i{position:absolute;top:45px;left:50%;margin-left:-6px;width:12px;height:12px;
  border-radius:50%;background:var(--one-bla);border:2px solid #fff;box-shadow:0 0 0 1px var(--one-bla)}
.tlmark.b i{background:var(--turkos);box-shadow:0 0 0 1px var(--turkos)}
.tlmark.fin i{background:var(--one-djup);box-shadow:0 0 0 1px var(--one-djup)}
.tlmark span{position:absolute;left:0;right:0;font-size:9.5px;line-height:1.3;color:var(--ink-soft);
  background:var(--surface);padding:2px 3px;border-radius:3px}
.tlmark span b{display:block;color:var(--one-djup);font-size:9px}
.tlmark.up span{bottom:64px}
.tlmark.dn span{top:64px}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--rod);z-index:1}
.today b{position:absolute;bottom:2px;left:5px;font-size:10px;color:var(--rod);font-weight:700;
  white-space:nowrap;background:var(--surface);padding:1px 4px;border-radius:3px}

.note{background:var(--warn-bg);border-left:3px solid var(--orange);border-radius:0 6px 6px 0;
  padding:12px 14px;font-size:12.5px;margin-top:16px}
.note b{color:var(--warn-ink)}
footer{background:var(--morkgra);color:#cfd8dc;font-size:12px;padding:16px 24px;margin-top:40px}
.fwrap{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hidden{display:none!important}

/* ---------- Segmenterade svarsknappar ---------- */
.seg{display:inline-flex;border:1px solid var(--hairline-stark);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{font-family:var(--font-b);font-size:13px;font-weight:600;border:none;background:var(--surface);
  color:var(--ink-soft);padding:9px 16px;cursor:pointer;border-left:1px solid var(--hairline);min-width:62px}
.seg button:first-child{border-left:none}
.seg button:hover{background:var(--sunken)}
.seg button.on-ja{background:var(--turkos);color:#fff}
.seg button.on-nej{background:var(--rod);color:#fff}
.seg button.on-osaker{background:var(--orange);color:#fff}
.seg button.on-neutral{background:var(--one-djup);color:#fff}

/* ---------- Fråga / åtgärdskort ---------- */
.q{border:var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;background:var(--surface)}
.q.flag{border-left:4px solid var(--rod);background:var(--bad-bg)}
.q.ok{border-left:4px solid var(--turkos)}
.qh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.qt{font-weight:600;font-size:13.5px;flex:1;min-width:220px}
.qn{font-family:var(--font-h);font-weight:700;color:var(--one-bla);margin-right:7px}
.qa{margin-top:11px;font-size:12.5px;background:var(--sunken);border-radius:6px;padding:10px 12px;color:#3d5158}
.q.flag .qa{background:var(--bad-bg);color:#8f2a22}
.qa .ref{display:block;margin-top:6px;font-size:11px;color:var(--ink-soft);font-weight:600}

/* ---------- Progress ---------- */
.prog{height:6px;background:var(--hairline);border-radius:3px;overflow:hidden}
.prog>span{display:block;height:100%;background:var(--one-bla)}
.prog.done>span{background:var(--turkos)}

/* ---------- Accordion ---------- */
.acc{border:var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:12px;overflow:hidden}
.acch{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;user-select:none}
.acch:hover{background:var(--sunken)}
.acch .num{font-family:var(--font-h);font-weight:700;color:#fff;background:var(--one-djup);
  border-radius:5px;padding:3px 8px;font-size:12px}
.acch .ttl{flex:1;font-weight:700;font-size:14px;color:var(--one-djup);min-width:0}
.acch .cnt{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.acch .prog{width:80px;flex-shrink:0}
.accb{padding:0 16px 16px;border-top:1px solid var(--hairline)}
.grp{margin-top:14px}
.grp h4{font-family:var(--font-b);font-size:12px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);margin:0 0 4px}
.grp .info{font-size:12px;color:var(--ink-soft);margin-bottom:8px;font-style:normal}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--hairline)}
.chk:last-child{border-bottom:none}
.chk input[type=checkbox]{width:19px;height:19px;margin:1px 0 0;flex-shrink:0;accent-color:var(--one-bla)}
.chk label{font-size:13px;flex:1;cursor:pointer}
.chk label s{color:var(--ink-faint);text-decoration:none}
.chk .hint{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px}

/* ---------- Formulär ---------- */
.f{margin-bottom:14px}
.f label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);font-weight:700;margin-bottom:4px}
.f .guide{font-size:11.5px;color:var(--ink-soft);margin:0 0 6px;line-height:1.45}
.f textarea{min-height:74px;resize:vertical;line-height:1.5}
.frow{display:grid;gap:14px;grid-template-columns:repeat(4,1fr)}
.frow.c3{grid-template-columns:repeat(3,1fr)}
.frow.c2{grid-template-columns:repeat(2,1fr)}
@media(max-width:800px){.frow,.frow.c3,.frow.c2{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.frow,.frow.c3,.frow.c2{grid-template-columns:1fr}}
.cbrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
.cbrow input{width:19px;height:19px;margin:1px 0 0;flex-shrink:0;accent-color:var(--one-bla)}
.cbrow label{font-size:13px}

/* ---------- Kalkylator ---------- */
.calc .out{background:var(--sunken);border-radius:6px;padding:14px;margin-top:12px;font-size:13px}
.calc .out .big{font-family:var(--font-h);font-size:16px;font-weight:700;color:var(--one-djup);
  display:block;margin-bottom:6px}
.calc .out.yes{background:var(--ok-bg)}
.calc .out.yes .big{color:var(--ok-ink)}
.calc .out.no{background:var(--hairline)}
.calc .out ul{margin:8px 0 0;padding-left:18px}
.calc .out li{margin:3px 0}


/* ---------- Premiumpolish: kort, knappar, tabeller ---------- */
.card,.pcard,.tl,.acc,.q,.atarad,.riskkort{border-radius:var(--r)}
.card:hover,.pcard:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.card,.pcard{transition:box-shadow .22s var(--ease),transform .22s var(--ease),border-color .22s}
.kpi .val{letter-spacing:-.02em}
.btn{border-radius:9px;transition:transform .16s var(--ease),box-shadow .16s var(--ease),background .16s}
.btn:active{transform:translateY(0) scale(.985)}
th{border-bottom:1px solid var(--hairline-stark);background:transparent}
tbody tr{transition:background .14s var(--ease)}
main{padding-top:30px}
.lead{line-height:1.55}
section.on{animation:sectionIn .34s var(--ease)}
@keyframes sectionIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* sidomenyns gradient följer temat */
.sidebar{background:linear-gradient(175deg,var(--sidebar-1) 0%,var(--sidebar-2) 78%,var(--sidebar-3) 100%)}

/* ---------- Toast ---------- */
.toast{position:fixed;right:22px;bottom:22px;z-index:80;display:flex;align-items:center;gap:10px;
  background:var(--raised);color:var(--ink);border:1px solid var(--hairline);border-radius:12px;
  padding:12px 16px;font-size:13px;font-weight:600;box-shadow:var(--sh-lift);
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease)}
.toast.visa{opacity:1;transform:none}
.toast .tdot{width:8px;height:8px;border-radius:50%;background:var(--turkos);flex:0 0 auto}
.toast.warn .tdot{background:var(--orange)}
.toast.bad .tdot{background:var(--rod)}
@media(max-width:560px){.toast{left:14px;right:14px;bottom:14px;justify-content:center}}

/* ---------- Kommandopalett ---------- */
/* ---------- Dialogruta (ersätter prompt/confirm — blockerade i sandbox) ---------- */
.mdl{position:fixed;inset:0;background:rgba(4,25,32,.5);backdrop-filter:blur(2px);display:none;
  align-items:flex-start;justify-content:center;padding:10vh 16px 16px;z-index:90;overflow-y:auto}
.mdl.on{display:flex;animation:cmdIn .16s var(--ease)}
.mdl .mbox{width:min(480px,100%);background:var(--surface);border:1px solid var(--hairline);
  border-radius:16px;box-shadow:var(--sh-lift);overflow:hidden;animation:cmdBox .2s var(--ease)}
.mdl .mhd{padding:20px 22px 4px}
.mdl .mhd h3{font-size:17px;color:var(--ink);letter-spacing:-.01em}
.mdl .mhd p{font-size:12.5px;color:var(--ink-soft);margin:6px 0 0;line-height:1.5}
.mdl .mkropp{padding:16px 22px 4px}
.mdl .mkropp .f:last-child{margin-bottom:6px}
.mdl .mfot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px;flex-wrap:wrap}
.mdl .btn.fara{background:var(--rod)}
.mdl .btn.fara:hover{background:#d8443a;box-shadow:0 6px 18px rgba(234,85,73,.3)}
@media(max-width:560px){.mdl{padding-top:6vh}.mdl .mfot .btn{flex:1}}

/* --- Kommandopalett --- */background:rgba(4,25,32,.5);backdrop-filter:blur(2px);display:none;
  align-items:flex-start;justify-content:center;padding-top:12vh;z-index:70}
.cmdk.on{display:flex;animation:cmdIn .18s var(--ease)}
@keyframes cmdIn{from{opacity:0}to{opacity:1}}
.cmdk .box{width:min(580px,94vw);background:var(--surface);border:1px solid var(--hairline);
  border-radius:16px;box-shadow:var(--sh-lift);overflow:hidden;animation:cmdBox .22s var(--ease)}
@keyframes cmdBox{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--hairline);padding:16px 18px;
  font-size:15px;font-family:inherit;background:none;color:var(--ink)}
.cmdk input:focus{outline:0}
.cmdk ul{list-style:none;margin:0;padding:7px;max-height:52vh;overflow-y:auto}
.cmdk li{padding:10px 12px;border-radius:9px;font-size:13.5px;cursor:pointer;display:flex;
  gap:11px;align-items:center}
.cmdk li .ct{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);border:1px solid var(--hairline);border-radius:5px;padding:2px 6px;flex:0 0 auto}
.cmdk li .cl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdk li .cs{font-size:11.5px;color:var(--ink-soft);flex:0 0 auto}
.cmdk li[aria-selected="true"]{background:var(--info-bg)}
.cmdk li.ctom{color:var(--ink-soft);cursor:default;justify-content:center}

/* ---------- Snabbfilter ---------- */
.qfilter{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.qf{background:var(--surface);border:1px solid var(--hairline);color:var(--ink-soft);
  border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:600;cursor:pointer;
  font-family:var(--font-b);transition:all .16s var(--ease)}
.qf:hover{border-color:var(--one-bla);color:var(--one-djup)}
.qf.on{background:var(--orange);border-color:var(--orange);color:#fff}

/* ---------- Mätare ---------- */
.matargrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:14px}
@media(max-width:900px){.matargrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.matargrid{grid-template-columns:1fr}}
.matare{display:flex;align-items:center;gap:13px;background:var(--sunken);border-radius:12px;padding:13px}
.ringsvg{width:58px;height:58px;flex:0 0 auto;transform:rotate(-90deg)}
.ringbg{fill:none;stroke:var(--hairline-stark);stroke-width:7}
.ringfg{fill:none;stroke:var(--one-bla);stroke-width:7;stroke-linecap:round;
  transition:stroke-dashoffset .7s var(--ease)}
.matare.warn .ringfg{stroke:var(--orange)}
.matare.bad .ringfg{stroke:var(--rod)}
.mtxt b{display:block;font-family:var(--font-h);font-size:19px;color:var(--ink);line-height:1.1}
.mtxt span{display:block;font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.35}

/* ---------- Topbar-knappar ---------- */
.tsp{flex:1}
.kbd{border:1px solid var(--hairline);background:var(--sunken);color:var(--ink-soft);border-radius:8px;
  padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-b);
  transition:all .16s var(--ease)}
.kbd:hover{border-color:var(--one-bla);color:var(--one-djup)}

/* ---------- Mobil: tabeller blir kort ---------- */
@media(max-width:640px){
  main table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  main table,main tbody,main tr,main td{display:block;width:100%}
  main tbody tr{background:var(--surface);border:1px solid var(--hairline);border-radius:12px;
    padding:6px 4px;margin-bottom:10px;box-shadow:var(--sh-sm)}
  main tbody tr:hover{background:var(--surface)}
  main td{border:none;padding:7px 12px;display:flex;gap:12px;align-items:flex-start;
    justify-content:space-between;text-align:right}
  main td[data-label]::before{content:attr(data-label);flex:0 0 42%;text-align:left;
    font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;
    color:var(--ink-soft);padding-top:2px}
  main td.num{text-align:right}
  main td input,main td select,main td textarea{max-width:58%}
  main .tscroll{overflow:visible}
  .btn,.qf{min-height:40px}
  .kcard select,.punktmeta select{min-height:36px}
}

/* ---------- Tidslinje: kommande leveranser och grindar ---------- */
.tlista{list-style:none;margin:14px 0 0;padding:0}
.tl-man{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;
  color:var(--ink-faint);padding:14px 0 8px 62px}
.tl-man:first-child{padding-top:2px}
.tl-item{display:grid;grid-template-columns:46px 18px 1fr;align-items:stretch;gap:0}
.tl-dat{text-align:right;padding:2px 0 18px}
.tl-dat b{display:block;font-family:var(--font-h);font-size:17px;line-height:1;color:var(--ink)}
.tl-dat span{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:2px;text-transform:uppercase;
  letter-spacing:.05em}
.tl-spar{position:relative;display:flex;justify-content:center}
.tl-spar::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--hairline-stark)}
.tl-item:last-child .tl-spar::before{bottom:auto;height:12px}
.tl-spar i{position:relative;z-index:1;width:11px;height:11px;border-radius:50%;margin-top:4px;
  background:var(--surface);border:2px solid var(--one-bla);flex:0 0 auto}
.tl-inn{padding:0 0 18px 14px;min-width:0}
.tl-titel{font-size:13.5px;font-weight:600;line-height:1.4}
.tl-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px}
.tl-kvar{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tl-typ{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;
  color:var(--ink-faint);border:1px solid var(--hairline);border-radius:4px;padding:1px 6px}
.tl-item.soon .tl-spar i{border-color:var(--duvbla)}
.tl-item.urgent .tl-spar i{background:var(--orange);border-color:var(--orange)}
.tl-item.urgent .tl-dat b{color:var(--warn-ink)}
.tl-item.past .tl-spar i{background:var(--rod);border-color:var(--rod)}
.tl-item.past .tl-dat b,.tl-item.past .tl-kvar{color:var(--bad-ink)}
.tl-item.okant .tl-spar i{background:var(--hairline-stark);border-color:var(--hairline-stark)}
.tl-item.okant .tl-dat b{color:var(--ink-faint)}
.tl-item.bess .tl-titel::before{content:"🔋 ";}
@media(max-width:640px){
  .tl-item{grid-template-columns:40px 16px 1fr}
  .tl-man{padding-left:56px}
  .tl-dat b{font-size:15px}
}

/* markering när en flagga öppnas */
.puls{animation:pulsa 1.4s var(--ease)}
@keyframes pulsa{
  0%{box-shadow:0 0 0 0 rgba(243,141,61,.55)}
  70%{box-shadow:0 0 0 12px rgba(243,141,61,0)}
  100%{box-shadow:0 0 0 0 rgba(243,141,61,0)}
}


/* ---------- Utskrift ---------- */
#utskrift{display:none}
@media print{
  .sidebar,.topbar,footer,.noprint,main>section{display:none!important}
  .rapverktyg,.sekretessbanner{display:none!important}
  body{background:#fff;font-size:11pt}
  #utskrift{display:block!important;padding:0}
  #utskrift h1{font-size:16pt;color:#005f76;margin-bottom:2px}
  #utskrift .sub{font-size:9pt;color:#555;margin-bottom:14px}
  #utskrift table{width:100%;border-collapse:collapse;margin-bottom:10px}
  #utskrift th,#utskrift td{border:1px solid #999;padding:5px 7px;font-size:9.5pt;
    vertical-align:top;text-align:left}
  #utskrift th{background:#eef4f6;width:150px;font-weight:700}
  #utskrift .box{border:1px solid #999;padding:8px;margin-bottom:9px;min-height:46px}
  #utskrift .box b{display:block;font-size:9pt;color:#005f76;margin-bottom:4px}
  #utskrift .fot{margin-top:16px;font-size:8.5pt;color:#555;border-top:1px solid #ccc;padding-top:8px}
  #utskrift .raphead{background:#005f76;color:#fff;padding:10px 14px;margin-bottom:12px}
  #utskrift .raphead h1{color:#fff;margin:0;font-size:15pt}
  #utskrift .raphead .s{font-size:8.5pt;color:#cfe8ef;margin-top:3px}
  #utskrift .raphead.med-logo{display:flex;align-items:center;gap:14px}
  #utskrift .raphead.med-logo .logo{height:28px;width:auto;flex:0 0 auto;filter:brightness(0) invert(1)}
  #utskrift .rapgrid5{display:table;width:100%;table-layout:fixed;border-collapse:collapse;margin-bottom:10px}
  #utskrift .rapgrid5 .c{display:table-cell;border:1px solid #999;padding:6px;font-size:9pt;vertical-align:top}
  #utskrift .tlp{display:inline-block;width:9pt;height:9pt;border-radius:50%;margin-right:4pt}
  #utskrift h2{font-size:11pt;color:#005f76;margin:13px 0 5px;font-family:'Roboto Slab',Arial,serif}
  #utskrift table{page-break-inside:auto}
  #utskrift tr{page-break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:18mm}
}

/* ---------- ÄTA-kalkylator ---------- */
.kalkyl{background:var(--web1);border-radius:10px;padding:16px;margin:16px 0}
.kalkylhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.kalkylhead h4{font-size:14px;color:var(--one-djup);margin:0}
.krub{font-family:var(--font-b);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:#6c7d85;margin:18px 0 6px;font-weight:700}
.ktab{background:#fff;border-radius:8px}
.ktab th{background:#fff}
.ktab input,.ktab select{font-size:12.5px;padding:4px 6px}
.ksum{background:#fff;border-radius:8px;padding:12px 14px;margin-top:16px}
.ksum>div{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:13px}
.ksum>div>b{font-variant-numeric:tabular-nums}
.ksum .ktot{border-top:2px solid #e7edf0;margin-top:6px;padding-top:9px;font-size:15px}
.ksum .ktot b{font-family:var(--font-h);font-size:18px;color:var(--one-djup)}

/* ---------- Byggmöten ---------- */
.para{border-top:1px solid #eef2f4;padding:14px 0 4px;margin-top:6px}
.parahead{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;margin-bottom:10px}
.parahead b{color:var(--one-djup);font-family:var(--font-h)}
.parahead .btn{margin-left:auto}
.punkt{background:var(--web1);border-radius:8px;padding:11px 12px;margin-bottom:8px}
.punkt.saknar{background:#fdece9;border:1px solid #f3c9c4}
.punkttext textarea{background:#fff;min-height:46px}
.punktmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.punktmeta select{width:auto;font-size:12px;padding:4px 7px}
.punktvarning{font-size:11.5px;color:#b8322a;font-weight:600;margin-top:8px}

/* ---------- Riskmatris ---------- */
.matris{width:auto;border-collapse:separate;border-spacing:3px;margin:10px 0}
.matris td.mtx{width:44px;height:38px;border-radius:6px;text-align:center;vertical-align:middle;
  font-weight:700;font-size:13px;color:#fff;border:none;padding:0}
.matris td.mtx.gron{background:var(--turkos)}
.matris td.mtx.gul{background:var(--orange)}
.matris td.mtx.rod{background:var(--rod)}
.matris th.mtxax{border:none;background:none;font-size:11px;color:#6c7d85;text-align:center;padding:2px}
.matleg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:#54666e;margin-top:8px}
.matleg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.matleg i.gron{background:var(--turkos)}
.matleg i.gul{background:var(--orange)}.matleg i.rod{background:var(--rod)}
.riskkort{border:1px solid #e4eaed;border-left:4px solid var(--web2);border-radius:10px;
  padding:14px;margin-bottom:12px;background:#fff}
.riskkort.n-rod{border-left-color:var(--rod)}
.riskkort.n-gul{border-left-color:var(--orange)}
.riskkort.n-gron{border-left-color:var(--turkos)}
.rk-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rk-titel{flex:1;min-width:220px;font-weight:600;font-size:13.5px}
.frow.c4{grid-template-columns:repeat(4,1fr)}
.frow.c5{grid-template-columns:repeat(5,1fr)}
@media(max-width:900px){.frow.c4,.frow.c5{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.frow.c4,.frow.c5{grid-template-columns:1fr}}

/* ---------- ÄTA och hinder ---------- */
.atalista{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.atarad{border:1px solid #e4eaed;border-radius:10px;overflow:hidden;background:#fff;
  transition:box-shadow .15s ease}
.atarad:hover{box-shadow:var(--sh-sm)}
.atarad.flagg{border-color:#f3c9c4}
.atatop{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;flex-wrap:wrap}
.atatop:hover{background:var(--web1)}
.atatop b{font-size:12.5px;letter-spacing:.02em;min-width:64px}
.atanamn{flex:1;font-size:13px;font-weight:600;min-width:180px}
.atabelopp{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;color:var(--one-djup);
  min-width:96px;text-align:right}
.atapil{color:#8a9aa1;font-size:12px;width:14px;text-align:center}
.klasstag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 8px;border-radius:4px;background:var(--web1);color:#54666e;white-space:nowrap}
.klasstag.k-ata{background:#e2f5fa;color:#00728f}
.klasstag.k-hinder{background:#fdefe2;color:#a85a12}
.klasstag.k-bada{background:#efe7f7;color:#5c4180}
.atagrindar{display:flex;gap:8px;flex-wrap:wrap;padding:0 13px 11px}
.grind{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;
  background:#fdefe2;color:#a85a12}
.grind.bad{background:#fde9e7;color:#b8322a}
.grind.ok{background:#e3f4f4;color:#0f6b6d}
.ataform{padding:14px 13px 4px;border-top:1px solid #eef2f4;background:var(--web1)}
.ataform .note{background:#fff}

/* ---------- Milstolpar M1–M7 ---------- */
.mspine{display:flex;gap:4px;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.mstop{flex:1;min-width:78px;text-align:center;padding:10px 4px 8px;border-radius:8px;
  background:var(--web1);border-top:3px solid #dfe6ea}
.mstop.klar{border-top-color:var(--turkos);background:#eafaf7}
.mstop.redo{border-top-color:var(--one-bla)}
.mstop.nu{border-top-color:var(--orange);background:#fff8f0;box-shadow:var(--sh-sm)}
.mdot{display:none}
.mkod{display:block;font-family:var(--font-h);font-weight:700;font-size:15px;color:var(--one-djup)}
.mandel{display:block;font-size:11px;color:#6c7d85;margin-top:2px}
.mhead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.mhead-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mprocent{font-family:var(--font-h);font-weight:700;font-size:17px;color:var(--one-djup)}
.mbelopp{font-size:12.5px;color:#6c7d85;font-variant-numeric:tabular-nums}
.card.mnu{border-left:4px solid var(--orange)}
.mgrid{display:grid;grid-template-columns:1fr 300px;gap:24px;margin-top:16px}
@media(max-width:900px){.mgrid{grid-template-columns:1fr}}
.mrub{font-family:var(--font-b);font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:#6c7d85;margin:0 0 8px;font-weight:700}

/* ---------- Menysektioner ---------- */
.navsek{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.42);
  font-weight:700;padding:15px 12px 6px}

/* ---------- Tavla (kanban) ---------- */
.kfilter{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}
.kfilter .f{margin:0;min-width:170px}
.kboard{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
@media(max-width:1100px){.kboard{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.kboard{grid-template-columns:1fr}}
.kcol{background:#e9eef1;border-radius:var(--r);padding:12px;min-height:110px;
  max-height:calc(100vh - 250px);overflow-y:auto;
  transition:background .15s ease,box-shadow .15s ease}
@media(max-width:640px){.kcol{max-height:none}}
.kcol.over{background:#e2f5fa;box-shadow:inset 0 0 0 2px var(--one-bla)}
.kcolh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.kcolh b{font-family:var(--font-b);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#54666e}
.kcount{background:#fff;border-radius:10px;font-size:11px;font-weight:700;color:#54666e;padding:1px 9px}
.kcard{background:#fff;border-radius:9px;padding:11px 12px;margin-bottom:9px;box-shadow:var(--sh-sm);
  border-left:3px solid var(--one-bla);cursor:grab;transition:box-shadow .15s ease,transform .15s ease}
.kcard:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.kcard.dragging{opacity:.4}
.kcard.t-punkter{border-left-color:var(--turkos)}
.kcard.t-storningar{border-left-color:var(--orange)}
.ktop{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.ktyp{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8a9aa1}
.ktitel{font-size:12.5px;font-weight:600;line-height:1.45;margin-bottom:8px}
.kmeta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11px;color:#6c7d85}
.kcard select{font-size:11px;padding:3px 6px;width:auto;max-width:100%}
.krad{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.ktom{font-size:12px;color:#8a9aa1;padding:4px 2px}
.kadd{background:none;border:1px dashed var(--hairline-stark);color:var(--ink-soft);
  border-radius:8px;font-family:var(--font-b);font-size:12px;font-weight:600;
  padding:7px 10px;cursor:pointer;width:100%;text-align:left;
  transition:border-color .15s var(--ease),color .15s var(--ease),background .15s var(--ease)}
.kadd:hover{border-color:var(--one-bla);color:var(--one-djup);background:var(--info-bg)}
.kplus{background:none;border:none;color:var(--ink-faint);font-size:17px;line-height:1;
  cursor:pointer;padding:2px 7px;border-radius:7px;font-family:var(--font-b);
  transition:background .15s var(--ease),color .15s var(--ease)}
.kplus:hover{background:var(--info-bg);color:var(--one-djup)}
.kcolh .kspace{flex:1}

/* ---------- Beställarrapport ---------- */
.rapgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1000px){.rapgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.rapgrid{grid-template-columns:1fr}}
.styr{background:var(--web1);border:1px solid #e4eaed;border-radius:10px;padding:12px}
.styr .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#6c7d85;font-weight:700}
.tl-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.tl-gron{background:var(--turkos)}.tl-gul{background:var(--orange)}.tl-rod{background:var(--rod)}
.tl-txt{font-size:12.5px;font-weight:600;margin:8px 0 9px;display:block}
.priobar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#e7edf0}
.priobar span{display:block;height:100%}
.priolegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:#54666e;margin-top:9px}
.priolegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sysrad{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eef2f4;flex-wrap:wrap}
.sysrad:last-child{border-bottom:none}
.sysnamn{flex:1;min-width:200px;font-size:13px;font-weight:600}
.sysnamn small{display:block;font-weight:400;font-size:11px;color:#6c7d85;margin-top:2px}
.sysrad select{width:auto;min-width:150px}
.framdrift{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px}
.framdrift .stor{font-family:var(--font-h);font-size:32px;font-weight:700;color:var(--one-djup);line-height:1}

/* ---------- Elevation & motion polish ---------- */
.card,.pcard,.tl,.acc,.q{box-shadow:var(--sh-sm);transition:box-shadow .18s ease,transform .18s ease}
.card:hover,.pcard:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.acch:hover{box-shadow:none}
.btn{transition:transform .14s ease,box-shadow .14s ease,background .14s ease}
.btn:not(.sec):hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,182,222,.35)}
.btn.sec:hover{transform:translateY(-1px)}
.pill,.tag,.rv{transition:transform .12s ease}
tbody tr{transition:background .12s ease}
.fitem{transition:background .15s ease,transform .15s ease}
.gchip{transition:transform .15s ease,box-shadow .15s ease}
.gchip:hover{transform:translateY(-2px);box-shadow:var(--sh-sm)}
.bhero{box-shadow:var(--sh-md)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c9d5da;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

/* ==========================================================================
   LAYOUT 2.0 — ljus, luftig arbetsyta. ONE Nordics palett behålls oförändrad,
   men ytorna är vita, navigationen ljus och rytmen glesare.
   ========================================================================== */
:root{
  --ground:#ffffff; --sunken:#f4f7f9; --surface:#ffffff;
  --hairline:#e7edf1; --hairline-stark:#d6e0e6;
  --r:18px; --r-sm:12px;
  --sidebar-w:268px;
  --sh-sm:0 1px 2px rgba(16,45,58,.04);
  --sh-md:0 4px 16px rgba(16,45,58,.07);
  --sh-lift:0 12px 34px rgba(16,45,58,.12);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0e1e25; --surface:#15272f; --sunken:#0e1e25;
    --hairline:#23404a; --hairline-stark:#2d4d58;
  }
}
:root[data-theme="dark"]{
  --ground:#0e1e25; --surface:#15272f; --sunken:#0e1e25;
  --hairline:#23404a; --hairline-stark:#2d4d58;
}

body{background:var(--ground);font-size:14.5px;line-height:1.55}

/* ---------- Ljus sidomeny ---------- */
.sidebar{
  background:var(--surface)!important;
  border-right:1px solid var(--hairline);
  box-shadow:none;
  color:var(--ink);
  width:var(--sidebar-w);
}
.sidebar-top{padding:26px 24px 8px}
.sidebar-top .mark-img{filter:none;height:30px}
:root[data-theme="dark"] .sidebar-top .mark-img{filter:brightness(0) invert(1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sidebar-top .mark-img{filter:brightness(0) invert(1)}}
.sidebar-top .dom{color:var(--ink-faint)}
.sidebar-title{padding:2px 24px 20px}
.sidebar-title h1{color:var(--ink);font-size:17px;letter-spacing:-.01em}
.sidebar-title .sub{color:var(--ink-soft)}
.sidenav{padding:4px 14px}
.sidenav button{
  color:var(--ink-soft);border-radius:11px;font-weight:600;font-size:13.5px;padding:10px 13px;
}
.sidenav button svg{stroke:var(--ink-faint);opacity:1}
.sidenav button:hover{background:var(--sunken);color:var(--one-djup)}
.sidenav button:hover svg{stroke:var(--one-djup)}
.sidenav button.on{background:var(--info-bg);color:var(--one-djup)}
.sidenav button.on svg{stroke:var(--one-djup)}
.sidenav button.on::before{display:none}
.navsek{color:var(--ink-faint);padding:18px 13px 6px;letter-spacing:.11em}
.sidebar-curve{opacity:.55}
.sidebar-foot{border-top:1px solid var(--hairline);padding:18px 24px 22px}
.namnfalt{color:var(--ink-faint)}
.namnfalt input{
  background:var(--sunken);border:1px solid var(--hairline-stark);color:var(--ink);border-radius:10px;padding:9px 11px;
}
.namnfalt input::placeholder{color:var(--ink-faint)}
.namnfalt input:focus{background:var(--surface);border-color:var(--one-bla)}
.conn{color:var(--ink-faint)}

/* ---------- Topbar med sidhuvud ---------- */
.topbar{
  padding:20px 38px 18px;background:var(--surface);
  border-bottom:1px solid var(--hairline);align-items:flex-start;gap:18px;
}
.topbar .navtoggle{margin-top:4px}
.tophead{min-width:0;flex:1}
.pagetitle{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.pagelead{font-size:13.5px;color:var(--ink-soft);margin-top:5px;max-width:62ch;line-height:1.5}
.topbar .kbd{border-radius:999px;padding:9px 16px;margin-top:3px}
main{max-width:1320px;padding:32px 38px 80px}
section.on{animation:sectionIn .3s var(--ease)}

@media(max-width:980px){
  .topbar{padding:15px 18px}
  main{padding:22px 18px 60px}
  .pagetitle{font-size:22px}
  .pagelead{display:none}
}

/* ---------- Kort ---------- */
.card,.pcard,.tl,.acc,.q,.riskkort,.atarad{
  border-radius:var(--r);border:1px solid var(--hairline);box-shadow:none;background:var(--surface);
}
.card{padding:24px}
.card:hover,.pcard:hover{box-shadow:var(--sh-md);transform:none;border-color:var(--hairline-stark)}
.card h3{font-size:17px;letter-spacing:-.01em;color:var(--ink)}
.card .lead{font-size:13px;margin-bottom:18px;max-width:78ch}
.grid{gap:20px}
.kpi .label{font-size:11px;letter-spacing:.09em;color:var(--ink-faint)}
.kpi .val{font-size:34px;margin-top:10px}
.kpi .val .warn{color:var(--orange)}
.kpi .val .bad{color:var(--rod)}
.pcard{border-top-width:0;padding:22px;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--one-bla)}
.pcard.b::before{background:var(--turkos)}
.pcard.c::before{background:var(--duvbla)}
.pcard.d::before{background:var(--orange)}

/* ---------- Knappar ---------- */
.btn{border-radius:999px;padding:10px 20px;letter-spacing:.01em}
.btn.mini{padding:7px 14px}
.btn.sec{border-width:1.5px;padding:8.5px 18.5px}
.btn.sec.mini{padding:5.5px 12.5px}
.btn:not(.sec):hover{box-shadow:0 6px 18px rgba(0,182,222,.3)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.qf{border-radius:999px;padding:8px 17px}

/* ---------- Tabeller ---------- */
th{font-size:10.5px;letter-spacing:.08em;padding:11px 12px;color:var(--ink-faint)}
td{padding:11px 12px}
tbody tr:hover{background:var(--sunken)}
select,input[type=text],input[type=date],input[type=number],textarea{
  border-radius:9px;padding:7px 10px;border-color:var(--hairline-stark);
}

/* ---------- Kortrubrik med verktyg till höger ---------- */
.kortrad{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.kortverktyg{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sumrad{background:var(--sunken)}
.sumrad td{border-top:1px solid var(--hairline-stark);border-bottom:none}
td.neg,.neg{color:var(--rod)}
tr.fakturerad{opacity:.62}

/* ---------- Beläggning ---------- */
.blcell{display:inline-flex;flex-direction:column;align-items:flex-end;gap:1px;
  min-width:62px;padding:6px 10px;border-radius:9px;font-weight:700;font-size:13px;line-height:1.15}
.blcell i{font-style:normal;font-weight:600;font-size:10px;opacity:.8}
.bl-tom{background:var(--sunken);color:var(--ink-faint)}
.bl-del{background:var(--info-bg);color:var(--info-ink)}
.bl-full{background:var(--ok-bg);color:var(--ok-ink)}
.bl-over{background:var(--bad-bg);color:var(--bad-ink)}
.belleg{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-top:14px}
.belleg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.belleg i.bl-del{background:#aee0e8}.belleg i.bl-full{background:#3cb8ba}.belleg i.bl-over{background:#ea5549}
table.belaggning td{vertical-align:middle}

/* ---------- Minibar (budgetförbrukning) ---------- */
.minibar{height:7px;border-radius:4px;background:var(--hairline);overflow:hidden;min-width:64px;margin-bottom:3px}
.minibar>span{display:block;height:100%;background:var(--turkos)}
.minibar>span.over{background:var(--rod)}
.budgettab td small{font-size:10.5px;color:var(--ink-soft)}

/* ---------- Tidrapportens veckorad ---------- */
.dagrad{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:4px 0 20px}
@media(max-width:760px){.dagrad{grid-template-columns:repeat(4,1fr)}}
@media(max-width:460px){.dagrad{grid-template-columns:repeat(2,1fr)}}
.dagkol{background:var(--sunken);border:1px solid var(--hairline);border-radius:12px;
  padding:12px 10px;text-align:center}
.dagkol.har{background:var(--info-bg);border-color:#bde4f0}
.dagkol.helg{opacity:.72}
.dagnamn{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);font-weight:700}
.dagdat{font-size:11px;color:var(--ink-soft);margin-top:2px}
.dagtim{font-family:var(--font-h);font-weight:700;font-size:17px;color:var(--one-djup);margin:6px 0 8px}

/* ---------- Diverse justeringar ---------- */
.note{border-radius:0 12px 12px 0;padding:14px 16px}
footer{background:var(--surface);color:var(--ink-soft);border-top:1px solid var(--hairline)}
.gchip,.pstat,.matare,.styr,.punkt,.kalkyl{border-radius:12px}
.kcol{background:var(--sunken);border:1px solid var(--hairline)}
.kcard{border-radius:12px;box-shadow:none;border:1px solid var(--hairline);border-left-width:3px}
.bhero{border-radius:var(--r);box-shadow:none;padding:24px 26px}

/* ---------- Projektuppstart ---------- */
.uppstart{background:var(--surface);border:2px solid var(--one-bla);border-radius:var(--r);
  padding:26px 28px;margin-bottom:20px;box-shadow:var(--sh-md)}
.uppstarthead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
  flex-wrap:wrap;margin-bottom:20px}
.uppstarthead h3{font-size:19px;color:var(--ink)}
.mallval{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.mallval{grid-template-columns:1fr}}
.mallkort{display:block;background:var(--sunken);border:1.5px solid var(--hairline);
  border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .16s var(--ease)}
.mallkort:hover{border-color:var(--hairline-stark)}
.mallkort.pa{background:var(--info-bg);border-color:var(--one-bla)}
.mallkort input{position:absolute;opacity:0;pointer-events:none}
.mallkort b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:5px}
.mallkort.pa b{color:var(--one-djup)}
.mallkort span{display:block;font-size:11.5px;color:var(--ink-soft);line-height:1.55}
.uppstartvad{background:var(--sunken);border-radius:12px;padding:16px 18px;margin:18px 0}
.uppstartvad b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-faint);margin-bottom:9px}
.uppstartvad ul{margin:0;padding-left:20px}
.uppstartvad li{font-size:12.5px;color:var(--ink);line-height:1.75}


/* ==========================================================================
   AGENDA
   ========================================================================== */
.agenda{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);
  padding:24px;margin-bottom:20px}
.agendahead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
  flex-wrap:wrap;margin-bottom:18px}
.agendahead h3{font-size:17px;color:var(--ink)}
.agendakol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px}
.agendakol>*{min-width:0}
@media(max-width:1000px){.agendakol{grid-template-columns:1fr}}
@media(max-width:520px){.afrad{flex-wrap:wrap}.afrad .tag{margin-left:20px}}

.agendafrister{border-radius:12px;padding:16px 18px;border:1px solid}
.agendafrister.lugn{background:var(--ok-bg);border-color:#a9ddd8;color:var(--ok-ink)}
.agendafrister.varning{background:var(--warn-bg);border-color:#f2d4b0;color:var(--warn-ink)}
.agendafrister.larm{background:var(--bad-bg);border-color:#f2bdb7;color:var(--bad-ink)}
.afhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.afhead b{font-size:14px}
.afcount{background:rgba(255,255,255,.75);border-radius:10px;font-size:11px;
  font-weight:700;padding:1px 9px;margin-left:auto}
:root[data-theme="dark"] .afcount{background:rgba(0,0,0,.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .afcount{background:rgba(0,0,0,.3)}}
.aflista{display:flex;flex-direction:column;gap:7px}
.afrad{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:9px;
  padding:10px 12px;cursor:pointer;transition:transform .14s var(--ease),box-shadow .14s var(--ease)}
.afrad:hover{transform:translateX(2px);box-shadow:var(--sh-sm)}
.afprick{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--orange)}
.afrad.forfallen .afprick{background:var(--rod)}
.afrad.akut .afprick{background:var(--orange)}
.afrad.snart .afprick{background:var(--duvbla)}
.afrad.oklar .afprick{background:var(--ink-faint)}
.aftxt{flex:1;min-width:0}
.aftxt b{display:block;font-size:13px;color:var(--ink);font-weight:600;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aftxt span{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.aftom{font-size:12.5px;line-height:1.6;opacity:.92}
.afsaknas{margin-top:10px;background:var(--surface);border:1px dashed var(--hairline-stark);border-radius:9px;padding:10px 12px;cursor:pointer;transition:border-color .15s var(--ease)}
.afsaknas:hover{border-color:var(--one-bla)}
.afsaknas b{display:block;font-size:12.5px;color:var(--ink)}
.afsaknas span{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5}
.afmer{font-size:11.5px;color:var(--ink-soft);padding:7px 2px 0}

.agendalista{min-width:0}

.kapb{padding:4px 22px 20px;border-top:1px solid var(--hairline)}
.kapingress{font-size:13.5px;color:var(--ink-soft);line-height:1.6;max-width:84ch;margin:18px 0 16px;
  padding-left:14px;border-left:3px solid var(--himmel)}
.kaplista{margin:6px 0 4px;padding-left:20px}
.kaplista li{font-size:13px;color:var(--ink);line-height:1.6;margin:5px 0}
.kap .grp{margin-top:20px}
.kap .grp h4{font-size:12px;color:var(--one-djup);letter-spacing:.05em}
@media(max-width:700px){
  .kaph{flex-wrap:wrap;gap:11px;padding:15px 16px}
  .kaptxt{flex:1 1 100%;order:2}
  .kapprog{order:3;justify-content:flex-start;min-width:0}
  .kappil{order:4;margin-left:auto}
  .kapb{padding:4px 16px 18px}
}

.toast{border-radius:14px}

function idag(){ const d=new Date(); return d.toISOString().slice(0,10); }
function dagarTill(iso){
  if(!iso) return null;
  const a=new Date(idag()+"T00:00:00"), b=new Date(iso+"T00:00:00");
  return Math.round((b-a)/86400000);
}
function fmtSEK(n){
  if(n===null||n===undefined) return "—";
  return new Intl.NumberFormat("sv-SE",{maximumFractionDigits:0}).format(n)+" kr";
}
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function setConn(cls,txt){
  document.getElementById("dot").className="dot "+cls;
  document.getElementById("connTxt").textContent=txt;
}

/* Plocka fram rena JSON-data (inga undefined) inför skrivning till db. */
function packa(s){ return JSON.parse(JSON.stringify(s)); }

/* Ekonomidata som egen payload: {kontraktsvarde:{projektid:kr}, betalplan:[...]}. */
function packaEkonomi(){
  const kv={};
  for(const p of STATE.projekt) kv[p.id] = p.kontraktsvarde ?? null;
  return { kontraktsvarde: kv, betalplan: packa(STATE.betalplan||[]) };
}

/* Lägg in mottagen/bekräftad ekonomidata i STATE (projektens kontraktsvärde + betalplan). */
function tillampaEkonomi(ek){
  if(!ek) return;
  for(const p of STATE.projekt){
    if(ek.kontraktsvarde && Object.prototype.hasOwnProperty.call(ek.kontraktsvarde,p.id)){
      p.kontraktsvarde = ek.kontraktsvarde[p.id];
    }
  }
  if(Array.isArray(ek.betalplan)) STATE.betalplan = ek.betalplan;
}

/* Payload till portfolj/state: hela STATE UTOM de administratörslåsta
   ekonomifälten (de synkas separat via portfolj/ekonomi, se ovan). */
function packaStatePayload(){
  const clean = packa(STATE);
  if(Array.isArray(clean.projekt)) clean.projekt = clean.projekt.map(p=>{ const {kontraktsvarde,...rest}=p; return rest; });
  delete clean.betalplan;
  return clean;
}

/* Läs lokal spegelkopia — används som första vy och som reservläge. */
function laddaLokalt(){
  let raw=null;
  try{ raw=localStorage.getItem(CONFIG.storageKey); }catch(e){}
  return raw ? normalisera(JSON.parse(raw)) : structuredClone(SEED);
}

function normalisera(d){
  const bas=structuredClone(SEED);
  for(const k of Object.keys(bas)) if(Array.isArray(d?.[k])) bas[k]=d[k];
  return bas;
}
/* Kör efter varje inläsning: äldre UR-statusar mappas till ÄTA-loggens lägen. */
const KANDA_MAPPAR = {
  "36037": {mapp:"Växjö · EAC- Växjö BESS", bestallare:"Ingrid Capacity AB"},
  "36038": {mapp:"Alvesta · EAC- Alvesta BESS", bestallare:"Ingrid Capacity AB"},

  "gotene": {mapp:"Götene", bestallare:"Ingrid Capacity AB"}

/* Sätter projektmapp och beställare en gång på de projekt som fanns före fältet. */
function migreraMappar(){
  let andrat=false;
  STATE.projekt.forEach(p=>{
    const k=KANDA_MAPPAR[p.id];
    if(k){
      if(p.mapp===undefined||p.mapp===""){ p.mapp=k.mapp; andrat=true; }
      if(p.bestallare===undefined||p.bestallare===""){ p.bestallare=k.bestallare; andrat=true; }
    }
    if(!p.underlag){
      p.underlag = (p.id==="36037"||p.id==="36038")
        ? {kalla:"Byggmötesprotokoll BM7/BM8", datum:"2026-08-17", infort:"2026-09-12", av:""}
        : {kalla:"", datum:"", infort:"", av:""};
      andrat=true;
    }
  });
  return andrat;
}
function efterInlasning(){
  try{ if(typeof migreraUr==="function") migreraUr(); }catch(e){ console.warn("Migrering:",e); }
  try{ if(typeof migreraMappar==="function") migreraMappar(); }catch(e){ console.warn("Mappar:",e); }
}

/* Anslut till den delade Artifact-databasen och håll STATE i synk.
   Två dokument: portfolj/state (öppet för alla) och portfolj/ekonomi
   (kontraktsvärde + betalplan, skrivskyddat till administratör). */
async function anslut(){
  try{
    DB = (window.claude && typeof window.claude.use==="function")
       ? await window.claude.use("db") : null;
  }catch(e){ DB=null; }

  if(!DB){
    setConn("","Lokalt läge — sparas i den här webbläsaren");
    return;
  }

  const ref = DB.doc(CONFIG.dbPath);

  try{
    const snap = await ref.get();
    if(snap.exists && snap.data()){
      senastSynkad = JSON.stringify(packa(snap.data()));
      STATE = normalisera(snap.data());
      efterInlasning();
      byggNav(); rita();
      setConn("ok","Delad · hämtad "+nu());
    }else{
      // Första gången: så databasen från grunddatan (utan ekonomifälten).
      const start = packaStatePayload();
      senastSynkad = JSON.stringify(start);
      await ref.set(start);
      setConn("ok","Delad · databasen skapad "+nu());
    }
  }catch(e){
    console.warn("Delad läsning misslyckades:",e);
    setConn("err","Delad lagring svarar inte — lokalt läge");
    return;
  }

  // Live: ta emot andras ändringar av det öppna dokumentet.
  ref.onSnapshot(snap=>{
    if(!snap.exists || snap.metadata.hasPendingWrites) return;
    const inkommande = JSON.stringify(packa(snap.data()));
    if(inkommande === senastSynkad) return;
    senastSynkad = inkommande;

    const ae = document.activeElement;
    const redigerar = ae && ae.closest && ae.closest("main")
      && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
    if(redigerar){
      vantarFjarr = true;
      setConn("ok","Ny delad ändring — läses in när du är klar");
      return;
    }
    const kvSpar = STATE.projekt.map(p=>[p.id,p.kontraktsvarde]);
    const bpSpar = STATE.betalplan;
    STATE = normalisera(JSON.parse(inkommande));
    efterInlasning();
    // Ekonomifälten ingår inte i detta dokument — behåll det vi redan visste.
    for(const [pid,kv] of kvSpar){ const p=STATE.projekt.find(x=>x.id===pid); if(p) p.kontraktsvarde=kv; }
    STATE.betalplan = bpSpar;
    rita();
    setConn("ok","Delad · uppdaterad "+nu());
  }, err=>{
    setConn("err","Delningen avbröts ("+err.code+") — lokalt läge");
    DB=null;
  });

  anslutEkonomi();
}

/* Andra dokumentet: kontraktsvärde + betalplan, skrivskyddat write:admin. */
async function anslutEkonomi(){
  const ref = DB.doc(CONFIG.dbPathEkonomi);

  try{
    const snap = await ref.get();
    if(snap.exists && snap.data()){
      const data = snap.data();
      ekonomiLast = data;
      senastSynkadEk = JSON.stringify(data);
      tillampaEkonomi(data);
      rita();
    }else{
      // Första gången: så ekonomidokumentet från grunddatan.
      const start = packaEkonomi();
      ekonomiLast = start;
      senastSynkadEk = JSON.stringify(start);
      try{ await ref.set(start); }catch(e){ console.warn("Kunde inte så ekonomidokumentet:",e); }
    }
  }catch(e){
    console.warn("Ekonomiläsning misslyckades:",e);
    return;
  }

  ref.onSnapshot(snap=>{
    if(!snap.exists || snap.metadata.hasPendingWrites) return;
    const data = snap.data();
    const inkommande = JSON.stringify(data);
    if(inkommande === senastSynkadEk) return;
    senastSynkadEk = inkommande;
    ekonomiLast = data;

    const ae = document.activeElement;
    const redigerar = ae && ae.closest && ae.closest("main")
      && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
    if(redigerar){
      vantarFjarrEk = true;
      return;
    }
    tillampaEkonomi(data);
    rita();
  }, err=>{
    console.warn("Ekonomi-delningen avbröts:",err && err.code);
  });
}

function spara(){

  saveTimer=setTimeout(async()=>{
    try{ localStorage.setItem(CONFIG.storageKey,JSON.stringify(STATE)); }catch(e){}
    if(!DB){ setConn("","Lokalt läge · sparad "+nu()); return; }
    try{
      setConn("","Sparar…");

      vantarFjarr = false;

      console.warn("Delad skrivning misslyckades:",e);
      setConn("err","Kunde inte spara delat ("+(e.code||e.message||"fel")+") — finns lokalt");
    }
  },CONFIG.autosaveMs);
}

/* Spara kontraktsvärde/betalplan — eget dokument, write:admin.
   Vid nekad skrivning (icke-administratör) återställs vyn och ett
   tydligt meddelande visas i Ekonomi-vyn. */
function sparaEkonomi(){
  clearTimeout(saveTimerEk);
  saveTimerEk=setTimeout(async()=>{
    try{ localStorage.setItem(CONFIG.storageKey,JSON.stringify(STATE)); }catch(e){}
    if(!DB){ ekonomiLast=packaEkonomi(); setConn("","Lokalt läge · sparad "+nu()); return; }
    const forsok = packaEkonomi();
    try{
      setConn("","Sparar…");
      senastSynkadEk = JSON.stringify(forsok);
      await DB.doc(CONFIG.dbPathEkonomi).set(forsok);
      ekonomiLast = forsok;
      ekonomiFel = "";
      vantarFjarrEk = false;
      setConn("ok","Delad · sparad "+nu());
    }catch(e){
      console.warn("Ekonomi-skrivning nekad:",e);
      if(ekonomiLast) tillampaEkonomi(ekonomiLast);
      senastSynkadEk = JSON.stringify(ekonomiLast||forsok);
      ekonomiFel = "Kunde inte spara — kontraktsvärde och betalplan kan bara ändras av administratören. Ändringen har återställts.";
      setConn("err","Ekonomiändring nekad — endast administratör");
      rita();
    }
  },CONFIG.autosaveMs);
}

/* ==========================================================================
   UNDERLAGSSTÄMPEL — vilket underlag portföljens data faktiskt bygger på.
   Sätts per projekt när nytt underlag förs in, manuellt eller av Claude.
   ========================================================================== */
function underlagsrad(pid){
  const p=projekt(pid);
  if(!p) return null;
  if(!p.underlag||typeof p.underlag!=="object") p.underlag={kalla:"",datum:"",infort:"",av:""};
  return p.underlag;
}
function uppdUnderlag(pid,falt,v){
  const u=underlagsrad(pid); if(!u) return;
  u[falt]=v;
  if(falt==="kalla"||falt==="datum"){ u.infort=idag(); u.av=hamtaNamn()||""; }
  spara(); rita();
}
function underlagsstampel(){
  const rader=STATE.projekt.map(p=>{
    const u=(p.underlag&&p.underlag.kalla)?p.underlag:null;
    if(!u) return null;
    return (p.nr||p.namn)+": "+u.kalla+(u.datum?" "+u.datum:"");
  }).filter(Boolean);
  return rader.length
    ? "Underlag — "+rader.join(" · ")
    : "Inget underlag registrerat — ange källa per projekt under Projektuppgifter";
}

/* ISO-vecka: returnerar t.ex. "2026-v37" */
function isoVecka(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dag=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-dag);
  const nyar=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  const v=Math.ceil(((t-nyar)/86400000+1)/7);
  return t.getUTCFullYear()+"-v"+String(v).padStart(2,"0");
}
function veckaNu(){ return isoVecka(new Date()); }
function veckaForskjut(vstr,steg){
  const [ar,v]=vstr.split("-v").map(Number);
  const d=new Date(Date.UTC(ar,0,4));
  d.setUTCDate(d.getUTCDate()-((d.getUTCDay()||7)-1)+(v-1+steg)*7);
  return isoVecka(d);
}
function veckaEtikett(vstr){ return "v. "+vstr.split("-v")[1]+" "+vstr.split("-v")[0]; }

function veckorad(pid,vecka){
  return STATE.veckokoll.find(r=>r.projektId===pid&&r.vecka===vecka)||null;
}
function veckaFlaggor(rad){
  if(!rad) return [];
  return VECKOFRAGOR.filter(f=>rad["q"+f.n]&&f.flagga.includes(rad["q"+f.n]));
}
function veckaBesvarade(rad){
  if(!rad) return 0;
  return VECKOFRAGOR.filter(f=>rad["q"+f.n]).length;
}

function rutinNyckel(rid,gi,pn){ return rid+"|"+gi+"|"+pn; }
function rutinKlar(pid,nyckel){
  return STATE.rutinstatus.some(r=>r.projektId===pid&&r.punkt===nyckel&&r.klar);
}
function rutinAntal(pid,rutin){
  let tot=0,klar=0;
  rutin.grupper.forEach((g,gi)=>(g.punkter||[]).forEach(p=>{
    tot++; if(rutinKlar(pid,rutinNyckel(rutin.id,gi,p.n))) klar++;
  }));
  return {tot,klar};
}

function visa(id){
  aktivVy=id;

/* ---------- Hub: BESS-nedräkning + gemensam gantt/nedräkningsrad ---------- */

function bessLeveranser(){
  return STATE.leveranser.filter(l=>l.datum&&BESS_MATCH.test(l.benamning));
}
/* ---------- Site Header — kompakt statusrad per site (kravspec modul 5) ---------- */

  const godkant=STATE.ur.filter(u=>u.projektId===pid&&["godkand","fakturerad","stangd"].includes(u.status))
    .reduce((s,u)=>s+(Number(u.belopp)||0),0);
  const pending=STATE.ur.filter(u=>u.projektId===pid&&["prissattning","skickad_best","godkand_dok"].includes(u.status))
    .reduce((s,u)=>s+(Number(u.belopp)||0),0);
  const dagarR=dagarSedanRond(pid);
  const avv=oppnaRondavvikelser(pid).length;
  const ar=idag().slice(0,4);
  const tillbudYTD=STATE.hseqIncidenter.filter(i=>i.projektId===pid&&i.typ==="tillbud"&&(i.datum||"").slice(0,4)===ar).length;
  const levTxt={
    bekraftad:l=>"Bekräftad"+(l.datum?" · ETA "+l.datum:""),
    pa_vag:l=>"På väg"+(l.datum?" · ETA "+l.datum:""),
    levererad:l=>"Levererad"+(l.datum?" "+l.datum:""),
    avvikelse:l=>"Avvikelse — nytt datum saknas"
  };
  const lev=STATE.leveranser.filter(l=>l.projektId===pid)
    .sort((a,b)=>(a.datum||"9999").localeCompare(b.datum||"9999")).slice(0,3);
  return `<div class="sitebar">
    <div class="sitebar-top">
      <b>SITE: ${esc(p.namn.toUpperCase())}</b>
      <span>${p.mw} MW / ${p.mwh??"—"} MWh</span><span>·</span>
      <span>Anslutning: ${esc(p.natagare||"—")}</span><span>·</span>
      <span>Planerad drift: ${esc(p.fardigstallande||"—")}</span>
    </div>
    <div class="sitebar-cols">
      <div class="sitebar-col"><h5>ÄTA-status</h5>
        <div class="sitebar-row"><span>Godkända</span><b>${fmtSEK(godkant)}</b></div>
        <div class="sitebar-row"><span>Pending</span><b>${fmtSEK(pending)}</b></div>
        <div class="sitebar-row"><span>Totalt</span><b>${fmtSEK(godkant+pending)}</b></div>
      </div>
      <div class="sitebar-col"><h5>BAS-U / HMS-statistik</h5>
        <div class="sitebar-row"><span>Senaste skyddsrond</span><b>${dagarR===null?"—":dagarR+" d sedan"}</b></div>
        <div class="sitebar-row"><span>Öppna avvikelser</span><b>${avv} st</b></div>

      </div>
      <div class="sitebar-col"><h5>Leveransstatus (long-lead)</h5>
        ${lev.length?lev.map(l=>`<div class="sitebar-row">
            <span>${esc((l.benamning||"").split(" (")[0])}</span>
            <b>${esc((levTxt[l.status]||(x=>x.status))(l))}</b></div>`).join("")
          :`<div class="sitebar-row"><span>Ingen leverans registrerad</span></div>`}
      </div>
    </div>
  </div>`;
}
function bessNedrakning(){
  const rader=bessLeveranser().map(l=>({...l,d:dagarTill(l.datum)})).sort((a,b)=>a.d-b.d);
  if(!rader.length) return null;
  const kommande=rader.filter(r=>r.d>=0);
  return kommande.length?kommande[0]:rader[rader.length-1];
}
function bessHero(){
  const b=bessNedrakning();
  if(!b) return "";
  const forsenad=b.d<0;
  return `<div class="bhero ${forsenad?"past":b.d<=14?"urgent":""}">
    <div class="bh-num">${forsenad?"−"+Math.abs(b.d):b.d}</div>
    <div>
      <div class="bh-lbl">${forsenad?"dagar sedan senaste BESS-leverans":"dagar till nästa BESS-leverans"}</div>
      <div class="bh-sub">${taggProjekt(b.projektId)} ${esc(b.benamning)}${b.leverantor&&b.leverantor!=="—"?" · "+esc(b.leverantor):""} · ${b.datum}</div>
    </div>
  </div>`;
}
/* Alla kommande leveranser/grindar (ej klara/passerade äldre än 3 dagar), sorterat, för gantt-raden. */
function ganttHandelser(n){
  const rader=[];
  STATE.leveranser.forEach(l=>{ if(l.datum) rader.push({datum:l.datum,titel:l.benamning,pid:l.projektId,bess:BESS_MATCH.test(l.benamning)}); });
  STATE.milstolpar.forEach(m=>{ if(m.datum&&m.status!=="klar"&&!/leverans/i.test(m.titel)) rader.push({datum:m.datum,titel:m.titel,pid:m.projektId,bess:BESS_MATCH.test(m.titel)}); });
  return rader.filter(r=>dagarTill(r.datum)>=-3).sort((a,b)=>a.datum.localeCompare(b.datum)).slice(0,n);
}
function ganttRad(){
  const rader=ganttHandelser(10);
  if(!rader.length) return "";
  return `<div class="card" style="margin-bottom:20px">
    <h3>Kommande — alla projekt</h3>
    <div class="lead">Leveranser och grindar, närmast överst. Bläddra i sidled på mobil.</div>
    <div class="gwrap">${rader.map(r=>{
      const d=dagarTill(r.datum);
      const kl=d<0?"past":d<=7?"urgent":d<=30?"soon":"";
      return `<div class="gchip ${kl}${r.bess?" bess":""}">
        <div class="gd">${d<0?"−"+Math.abs(d):d}<span>d</span></div>
        <div class="gt">${r.bess?"🔋 ":""}${esc(r.titel)}</div>
        <div class="gp">${taggProjekt(r.pid)}</div>
        <div class="gdatum">${r.datum}</div>
      </div>`;
    }).join("")}</div>
  </div>`;
}
/* Nästa kommande händelse (leverans/milstolpe) för ETT projekt — visas på projektkortet. */
function nastaHandelse(pid){
  const rader=[];
  STATE.leveranser.forEach(l=>{ if(l.datum&&l.projektId===pid) rader.push({datum:l.datum,titel:l.benamning,bess:BESS_MATCH.test(l.benamning)}); });
  STATE.milstolpar.forEach(m=>{ if(m.datum&&m.projektId===pid&&m.status!=="klar"&&!/leverans/i.test(m.titel)) rader.push({datum:m.datum,titel:m.titel,bess:BESS_MATCH.test(m.titel)}); });
  const kommande=rader.filter(r=>dagarTill(r.datum)>=0).sort((a,b)=>a.datum.localeCompare(b.datum));
  if(!kommande.length) return null;
  const r=kommande[0];
  return {...r,d:dagarTill(r.datum)};
}

/* ---------- Hub: avvikelser & flaggor ---------- */
