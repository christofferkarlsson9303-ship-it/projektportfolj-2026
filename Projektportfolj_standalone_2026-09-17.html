    }
  });
  STATE.punkter.filter(p=>p.status==="oppen"&&p.forfaller).forEach(pt=>{
    const d=dagarTill(pt.forfaller);
    if(d<0) fl.push({niva:"hog",text:`Öppen punkt har förfallit — ${pt.titel}`,projektId:pt.projektId,vy:"punkter"});
    else if(d<=7) fl.push({niva:"medel",text:`Öppen punkt förfaller om ${d} dag${d===1?"":"ar"} — ${pt.titel}`,projektId:pt.projektId,vy:"punkter"});
  });
  STATE.projekt.forEach(p=>{
    const saknas=[];
    if(p.kontraktsvarde===null||p.kontraktsvarde===undefined) saknas.push("kontraktsvärde");
    if(!p.mw) saknas.push("MW");
    if(!p.mwh) saknas.push("MWh");
    if(!p.natagare) saknas.push("nätägare");
    if(!p.fardigstallande) saknas.push("färdigställandetid");
    if(saknas.length) fl.push({niva:"medel",text:`Kärndata saknas (${saknas.join(", ")}) — ${p.nr?p.nr+" ":""}${p.namn}`,projektId:p.id,vy:"oversikt",extra:"projektdata"});
  });
  STATE.risker.filter(r=>r.status!=="stangd"&&riskMatrisFarg(r.sannolikhet,r.konsekvens)==="rod").forEach(r=>{
    fl.push({niva:"hog",text:`Röd risk (RV ${riskvarde(r)}) — ${r.titel}`,projektId:r.projektId,vy:"risker"});
  });

  /* Modellens egna grindar: 24-timmarsfristen, prisgodkännande före start,
     fakturering samma vecka och underlag inför nästa betalningsmilstolpe. */
  (STATE.ur||[]).forEach(u=>{
    const und=typeof underrattelseLage==="function"?underrattelseLage(u):null;
    if(und&&und.varning) fl.push({niva:"hog",
      text:`Underrättelse om störning saknas mer än 24 h — ${u.nr} ${u.benamning}`,
      projektId:u.projektId,vy:"ata"});
    const pg=typeof prisGrind==="function"?prisGrind(u):null;
    if(pg&&pg.varning) fl.push({niva:"hog",
      text:`Arbete startat utan skriftligt godkänt pris — ${u.nr} ${u.benamning}`,
      projektId:u.projektId,vy:"ata"});
    if(u.status==="godkand"&&u.godkantDatum){
      const d=dagarTill(u.godkantDatum);
      if(d!==null&&d<-7) fl.push({niva:"medel",
        text:`Godkänd ÄTA ej fakturerad sedan ${u.godkantDatum} — ${u.nr} ${u.benamning}`,
        projektId:u.projektId,vy:"ata"});
    }
  });
  /* HSEQ: skyddsrond varannan vecka, incidentrapport inom 24 h */
  if(typeof dagarSedanRond==="function"){
    STATE.projekt.forEach(p=>{
      const d=dagarSedanRond(p.id);
      if(d!==null&&d>=14) fl.push({niva:"hog",
        text:`Skyddsronden är ${d} dagar gammal — kravet är varannan vecka`,projektId:p.id,vy:"hseq"});
      if(!ampAktuell(p.id)&&STATE.hseqRonder.some(r=>r.projektId===p.id)) fl.push({niva:"medel",
        text:`Arbetsmiljöplan saknas i portföljen`,projektId:p.id,vy:"hseq"});
    });
    (STATE.hseqIncidenter||[]).forEach(i=>{
      const l=incidentLage(i);
      if(l&&l.varning) fl.push({niva:"hog",
        text:`Incident saknar rapport mer än 24 h — ${(INCIDENTTYP.find(t=>t[0]===i.typ)||["","Incident"])[1]} ${i.datum}`,
        projektId:i.projektId,vy:"hseq"});
    });
  }
  /* Byggmöten: ÄTA eller hinder som saknar formell registrering */
  (STATE.byggmoten||[]).forEach(m=>{
    const saknar=(m.punkter||[]).filter(pt=>(pt.para==="4"||pt.para==="5")&&!pt.urId&&pt.text);
    if(saknar.length) fl.push({niva:"hog",
      text:`${m.nr}: ${saknar.length} punkt${saknar.length>1?"er":""} under §4/§5 saknar registrerat ärende — risk för preskription`,
      projektId:m.projektId,vy:"moten"});
  });
  /* Slutdokumentation inför M6 */
  if(typeof slutdokIndex==="function"){
    STATE.projekt.forEach(p=>{
      const d6=dagarTillM6(p.id);
      if(d6===null||d6>=14) return;
      const ix=slutdokIndex(p.id);
      if(ix.proc<80) fl.push({niva:"hog",
        text:`Kritiska överlämningshandlingar saknas inför slutbesiktning — index ${ix.proc} %, ${d6} dagar kvar`,
        projektId:p.id,vy:"slutdok"});
    });
  }
  /* Röda risker utan förebyggande åtgärd — systemvarning enligt kravspecen */
  STATE.risker.filter(r=>r.status!=="stangd"&&riskMatrisFarg(r.sannolikhet,r.konsekvens)==="rod"
    &&!r.forebygg&&!r.atgard).forEach(r=>{
    fl.push({niva:"hog",text:`Röd risk saknar förebyggande åtgärd — ${r.titel}`,
      projektId:r.projektId,vy:"risker"});
  });

  if(typeof MILSTOLPE_MODELL!=="undefined"){
    STATE.projekt.forEach(p=>{
      const nasta=MILSTOLPE_MODELL.find(m=>{
        const b=STATE.betalplan.find(x=>x.projektId===p.id&&x.kod===m.kod);
        return !b||b.status!=="fakturerad";
      });
      if(!nasta) return;
      const u=mUnderlagKlart(p.id,nasta);
      if(!u.allt&&STATE.betalplan.some(x=>x.projektId===p.id)) fl.push({niva:"medel",
        text:`${nasta.kod} ${nasta.namn}: ${u.av-u.klara} underlag återstår innan lyftet kan aviseras`,
        projektId:p.id,vy:"milstolpar"});
    });
  }
  return fl.sort((a,b)=>(a.niva==="hog"?0:1)-(b.niva==="hog"?0:1));
}
function flaggRad(f){

  return `<div class="fitem ${f.niva}">

function kommandeHandelser(){
  const rader=[];
  STATE.leveranser.forEach(l=>rader.push({datum:l.datum,
    titel:l.benamning+(l.leverantor&&l.leverantor!=="—"?" ("+l.leverantor+")":""),
    pid:l.projektId,typ:"lev",status:l.status}));
  STATE.milstolpar.forEach(m=>{ if(!/leverans/i.test(m.titel))
    rader.push({datum:m.datum,titel:m.titel,pid:m.projektId,typ:"ms",status:m.status}); });
  return rader
    .filter(r=>!r.datum||dagarTill(r.datum)>=-14)
    .sort((a,b)=>(a.datum||"9999").localeCompare(b.datum||"9999"))
    .slice(0,12);
}
const MANADER=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
function kortDatum(d){
  const dd=new Date(d+"T00:00:00");
  if(isNaN(dd)) return {dag:"—",man:""};
  return {dag:String(dd.getDate()), man:MANADER[dd.getMonth()]};
}
/* Tidslinje i stället för tabell — kronologisk med spår, punkter och månadsskiljare. */
function kommandeTidslinje(){
  const rader=kommandeHandelser();
  if(!rader.length) return `<p class="lead">Inga kommande händelser.</p>`;
  let senasteManad="";
  const ut=rader.map(r=>{
    const d=r.datum?dagarTill(r.datum):null;
    const kd=r.datum?kortDatum(r.datum):{dag:"?",man:""};
    const kl = d===null?"okant":(d<0?"past":(d<=14?"urgent":(d<=45?"soon":"")));
    const bess=BESS_MATCH.test(r.titel)?" bess":"";
    let manadsrad="";
    const nyckel=r.datum?r.datum.slice(0,7):"okant";
    if(nyckel!==senasteManad){
      senasteManad=nyckel;
      manadsrad=`<li class="tl-man">${r.datum
        ? esc(MANADER[new Date(r.datum+"T00:00:00").getMonth()]+" "+r.datum.slice(0,4))
        : "Utan bekräftat datum"}</li>`;
    }
    return manadsrad+`<li class="tl-item ${kl}${bess}">
      <div class="tl-dat"><b>${esc(kd.dag)}</b><span>${esc(kd.man)}</span></div>
      <div class="tl-spar"><i></i></div>
      <div class="tl-inn">
        <div class="tl-titel">${esc(r.titel)}</div>
        <div class="tl-meta">
          ${taggProjekt(r.pid)}
          <span class="tl-kvar">${d===null?"datum saknas":(d<0?Math.abs(d)+" dagar sedan":d+" dagar kvar")}</span>
          ${r.status==="avvikelse"?pill("avvikelse"):""}
          ${r.typ==="ms"?`<span class="tl-typ">grind</span>`:`<span class="tl-typ">leverans</span>`}
        </div>
      </div>
    </li>`;
  }).join("");
  return `<ol class="tlista">${ut}</ol>`;
}

/* Öppna en flagga: byt projekt och vy, fäll ut det som behöver åtgärdas och
   rulla dit — annars ser det ut som att knappen inte gör något när man redan
   står på rätt vy. */
function oppnaFlagga(pid,vy,extra){
  if(pid) valtProjekt=pid;
  if(extra==="projektdata") visaProjektredigering=true;
  if(aktivVy!==vy) visa(vy); else rita();
  setTimeout(()=>{
    let mal=null;
    if(extra==="projektdata") mal=document.querySelector("#v-oversikt .projektred");
    if(!mal) mal=document.querySelector("main section.on .card");
    if(mal){
      mal.scrollIntoView({behavior:"smooth",block:"start"});
      mal.classList.add("puls");
      setTimeout(()=>mal.classList.remove("puls"),1400);
    }
  },80);
}
function flaggPanel(){

function bytVecka(steg){ visadVecka=veckaForskjut(visadVecka,steg); rita(); }

function sakraVeckorad(){
  let rad=veckorad(valtProjekt,visadVecka);
  if(!rad){
    rad={id:"v"+Date.now()+Math.floor(Math.random()*99),projektId:valtProjekt,vecka:visadVecka,
         datum:idag(),anteckning:"",klar:false};
    VECKOFRAGOR.forEach(f=>rad["q"+f.n]="");
    STATE.veckokoll.push(rad);
  }
  return rad;
}
function svaraVecka(n,varde){
  const rad=sakraVeckorad();
  rad["q"+n]=rad["q"+n]===varde?"":varde;
  rad.datum=idag();
  spara(); rita();
}
function anteckningVecka(v){ sakraVeckorad().anteckning=v; spara(); }
function klarmarkVecka(){
  const rad=sakraVeckorad();
  rad.klar=!rad.klar; rad.datum=idag();
  spara(); rita();
}
function punktFranVecka(n){
  const f=VECKOFRAGOR.find(x=>x.n===n);
  const rad=veckorad(valtProjekt,visadVecka);
  const svar=rad?rad["q"+n]:"";
  STATE.punkter.push({
    id:"p"+Date.now(),projektId:valtProjekt,

const DAGBOK_FALT = ["startdatum","omfattning","vader","kostnad","forvantadTid","faktiskTid"];

function dagbokKomplett(rad){
  return DAGBOK_FALT.every(f=>String(rad[f]??"").trim()!=="");
}
function dagbokGrupper(pid){
  const rader=STATE.dagbok.filter(d=>d.projektId===pid);
  const map=new Map();
  rader.forEach(d=>{
    const nyckel=d.ataRef||"(utan ÄTA-nummer)";
    if(!map.has(nyckel)) map.set(nyckel,[]);
    map.get(nyckel).push(d);
  });
  return [...map.entries()].map(([ataRef,rader])=>({
    ataRef, rader,
    kostnad: rader.reduce((s,r)=>s+(Number(r.kostnad)||0),0),
    komplett: rader.every(dagbokKomplett),
    kravSignering: rader.some(r=>r.kravSignering),
    signering: rader.filter(r=>r.kravSignering).every(r=>r.signerad),
    fakturerad: rader.every(r=>r.fakturerad)
  })).sort((a,b)=>a.ataRef.localeCompare(b.ataRef));
}

/* ---------- Rutiner ---------- */
function ritaRutiner(){
  const pid=valtProjekt, p=projekt(pid);
  const summa=RUTINER.reduce((s,r)=>{const a=rutinAntal(pid,r);return{tot:s.tot+a.tot,klar:s.klar+a.klar};},{tot:0,klar:0});
  const proc=summa.tot?Math.round(summa.klar/summa.tot*100):0;
  const klaraKap=RUTINER.filter(r=>{const a=rutinAntal(pid,r);return a.tot>0&&a.klar===a.tot;}).length;
  const medPunkter=RUTINER.filter(r=>rutinAntal(pid,r).tot>0).length;
  const pabörjade=RUTINER.filter(r=>{const a=rutinAntal(pid,r);return a.klar>0&&a.klar<a.tot;}).length;

  const kapitel=r=>{
    const {tot,klar}=rutinAntal(pid,r);
    const oppen=oppenRutin===r.id;
    const kproc=tot?Math.round(klar/tot*100):0;
    return `<div class="kap ${oppen?"oppen":""} ${tot&&klar===tot?"klar":""}">
      <div class="kaph" onclick="vaxlaRutin('${r.id}')">
        <span class="kapnr">${esc(r.id)}</span>
        <div class="kaptxt">
          <b>${esc(r.titel)}</b>
          ${r.kalla?`<small>${esc(r.kalla)}</small>`:""}
        </div>
        ${tot?`<div class="kapprog">
          <div class="prog ${klar===tot?"done":""}"><span style="width:${kproc}%"></span></div>
          <small>${klar}/${tot}</small></div>`
          :`<span class="pill p-wait">Referens</span>`}
        <span class="kappil">${oppen?"▾":"▸"}</span>
      </div>
      ${oppen?`<div class="kapb">
        ${r.ingress?`<div class="kapingress">${esc(r.ingress)}</div>`:""}
        ${r.lank?`<div class="rowbtns" style="margin:0 0 18px">
          <button class="btn mini" onclick="visa('${r.lank[0]}')">${esc(r.lank[1])} →</button></div>`:""}
        ${r.grupper.map((g,gi)=>`<div class="grp">
          <h4>${esc(g.namn)}</h4>
          ${g.info?`<div class="info">${esc(g.info)}</div>`:""}
          ${g.text?`<ul class="kaplista">${g.text.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
          ${(g.punkter||[]).map(pt=>{
            const nyckel=rutinNyckel(r.id,gi,pt.n);
            const kl=rutinKlar(pid,nyckel);
            const cid="c_"+pid+"_"+nyckel.replace(/[|.]/g,"_");
            return `<div class="chk">
              <input type="checkbox" id="${cid}" ${kl?"checked":""}
                onchange="vaxlaRutinpunkt('${nyckel}',this.checked)">
              <label for="${cid}">${kl?`<s>${esc(pt.t)}</s>`:esc(pt.t)}
                ${pt.h?`<span class="hint">${esc(pt.h)}</span>`:""}</label>
            </div>`;
          }).join("")}
        </div>`).join("")}
      </div>`:""}
    </div>`;
  };

  document.getElementById("v-rutiner").innerHTML=`
    ${projektvaljare()}
    <div class="grid g4" style="margin-bottom:20px">
      ${kpi("Genomgånget",proc+" %",summa.klar+" av "+summa.tot+" punkter i "+esc(p.nr||p.namn),proc>=80?"":proc>=40?"warn":"bad")}
      ${kpi("Färdiga kapitel",klaraKap+"/"+medPunkter,"kapitel med alla punkter avbockade")}
      ${kpi("Påbörjade",pabörjade,"kapitel där arbetet är igång")}
      ${kpi("Kapitel totalt",RUTINER.length,"hela projektledarens handbok")}
    </div>

    <div class="card" style="margin-bottom:20px">
      <h3>Projektledarens handbok — ${esc((p.nr?p.nr+" ":"")+p.namn)}</h3>
      <div class="lead">ONE Nordics rollbeskrivning och entreprenadjuridiska flödesscheman som egna kapitel,
        avbockade separat för varje projekt. Det som sägs om entreprenaden gäller även DUS-avtal.
        Kapitel med egen arbetsflik har en genväg dit.</div>
    </div>

    <div class="kaplist">${RUTINER.map(kapitel).join("")}</div>

    <div class="note"><b>Så hänger det ihop:</b> kapitel 2.4 och 2.4.1 arbetas operativt i fliken
      <b>Störning</b>, ÄTA-dokumentationen i <b>Dagbok</b> och <b>ÄTA och hinder</b>, veckogenomgången
      i <b>Veckokoll</b> och avslutet i <b>Slutdokumentation</b>. Kapitlen här är regelverket och
      avbockningen — flikarna är där arbetet registreras.</div>`;
}
function vaxlaRutin(id){ oppenRutin=oppenRutin===id?null:id; rita(); }
function vaxlaByggfas(id){ oppenByggfas=oppenByggfas===id?null:id; rita(); }
function vaxlaRutinpunkt(nyckel,kryssad){
  const bef=STATE.rutinstatus.find(r=>r.projektId===valtProjekt&&r.punkt===nyckel);
  if(kryssad){
    if(bef){ bef.klar=true; bef.datum=idag(); }
    else STATE.rutinstatus.push({id:"rs"+Date.now()+Math.floor(Math.random()*99),
      projektId:valtProjekt,punkt:nyckel,klar:true,datum:idag(),anteckning:""});
  }else if(bef){
    STATE.rutinstatus=STATE.rutinstatus.filter(r=>r!==bef);
  }
  spara(); rita();
}

/* ---------- Tidplan ---------- */
function ritaTidplan(){
  const start=new Date("2026-09-01"), slut=new Date("2026-12-31");
  const span=slut-start;

function uppd(lista,id,falt,varde){
  const rad=STATE[lista].find(r=>r.id===id);
  if(!rad) return;
  rad[falt]=varde; spara(); rita();
}
function uppdNum(lista,id,falt,varde){ uppd(lista,id,falt,Number(varde)); }
function uppdBool(lista,id,falt,varde){
  const rad=STATE[lista].find(r=>r.id===id);
  if(rad){ rad[falt]=!!varde; spara(); }
}

function uppdKontrakt(pid,varde){
  const p=projekt(pid);
  if(!p) return;
  p.kontraktsvarde = varde===""||varde===null||varde===undefined ? null : Number(varde);

function uppdBetalplanFalt(id,falt,varde){
  const rad=STATE.betalplan.find(r=>r.id===id);
  if(!rad) return;
  const gammalt=rad[falt];
  rad[falt]=varde;
  if(falt==="status"&&gammalt!==varde) loggaHandelse("betalplan",id,gammalt,varde);
  rita(); sparaEkonomi();
}

const NAMN_KEY="batchc-portfolj-namn";
function hamtaNamn(){
  try{ return (localStorage.getItem(NAMN_KEY)||"").trim(); }catch(e){ return ""; }
}
function sparaNamn(v){
  try{ localStorage.setItem(NAMN_KEY,(v||"").trim()); }catch(e){}
}

/* Snabb statusändring via en <select> — uppdaterar OCH loggar ändringen. */
function uppdStatus(lista,id,falt,varde){
  const rad=STATE[lista]&&STATE[lista].find(r=>r.id===id);
  const gammalt=rad?rad[falt]:undefined;
  uppd(lista,id,falt,varde);
  if(rad&&gammalt!==varde){
    loggaHandelse(lista,id,gammalt,varde);
    try{ toast("Status uppdaterad och loggad"); }catch(e){}
  }
}

/* Läsbar etikett + tillhörande projekt för en rad, för loggens skull. */
function beskrivRad(lista,id){
  const rad=lista==="projekt"?projekt(id):(STATE[lista]||[]).find(r=>r.id===id);
  if(!rad) return null;
  switch(lista){
    case "projekt": return {etikett:(rad.nr?rad.nr+" ":"")+rad.namn, projektId:rad.id};
    case "milstolpar": return {etikett:rad.titel, projektId:rad.projektId};
    case "leveranser": return {etikett:rad.benamning, projektId:rad.projektId};
    case "ur": return {etikett:(rad.nr?rad.nr+" ":"")+rad.benamning, projektId:rad.projektId};
    case "risker": return {etikett:rad.titel.length>60?rad.titel.slice(0,57)+"…":rad.titel, projektId:rad.projektId};
    case "punkter": return {etikett:rad.titel.length>60?rad.titel.slice(0,57)+"…":rad.titel, projektId:rad.projektId};
    case "storningar": return {etikett:rad.rubrik||"Störning", projektId:rad.projektId};
    case "betalplan": return {etikett:"Betalplan "+rad.kod+" — "+rad.benamning, projektId:rad.projektId};
    default: return {etikett:String(id), projektId:rad.projektId||null};
  }
}

function loggaHandelse(lista,id,gammalt,nytt){
  const info=beskrivRad(lista,id);
  if(!info) return;
  const g=(PILL[gammalt]||[,gammalt||"—"])[1], n=(PILL[nytt]||[,nytt])[1];
  if(!Array.isArray(STATE.andringslogg)) STATE.andringslogg=[];
  STATE.andringslogg.unshift({
    ts: new Date().toISOString(),
    anvandare: hamtaNamn()||"Okänd",
    projektId: info.projektId||null,
    text: `${info.etikett}: status ändrad ${g} → ${n}`
  });
  if(STATE.andringslogg.length>150) STATE.andringslogg.length=150;
}

function fmtLoggTid(iso){
  const d=new Date(iso);
  const idagS=idag(), datS=d.toISOString().slice(0,10);
  const tid=d.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"});
  return (datS===idagS?"Idag":d.toLocaleDateString("sv-SE",{day:"numeric",month:"short"}))+" "+tid;
}

/* ---------- Räknare: á-priskontroll (AB 04/ABT 06 kap. 6 § 6) ---------- */
function raknaApris(){
  const v=id=>Number(document.getElementById(id).value.replace(",","."))||0;
  const ks=v("ap_ks"), pris=v("ap_pris"), m0=v("ap_m0"), m1=v("ap_m1");
  const ut=document.getElementById("ap_ut");
  if(!ks||!pris||!m0){ ut.className="out"; ut.innerHTML="Fyll i kontraktssumma, á-pris och kontrakterad mängd."; return; }
  const dm=m1-m0;
  const dproc=dm/m0*100;
  const varde=Math.abs(dm)*pris;
  const grans=ks*0.005;
  const gransMangd=grans/pris;
  const uppfyllt=Math.abs(dproc)>=25 && varde>grans;
  ut.className="out "+(uppfyllt?"yes":"no");
  ut.innerHTML=`<span class="big">${uppfyllt
      ? "Rätt att påkalla förhandling om nytt á-pris"
      : "Villkoren för omförhandling är inte uppfyllda"}</span>
    <ul>
      <li>Mängdändring: <b>${dm>0?"+":""}${dm.toLocaleString("sv-SE")}</b> enheter (${dproc>0?"+":""}${dproc.toFixed(1)} %)
        — kravet är minst ±25 % ${Math.abs(dproc)>=25?"✓":"✗"}</li>
      <li>Värde av ändringen: <b>${fmtSEK(Math.round(varde))}</b></li>
      <li>0,5 % av kontraktssumman: <b>${fmtSEK(Math.round(grans))}</b>
        — värdet måste överstiga detta ${varde>grans?"✓":"✗"}</li>
      ${uppfyllt&&dm>0?`<li>Det avtalade á-priset gäller för högst <b>${gransMangd.toLocaleString("sv-SE",{maximumFractionDigits:0})} enheter</b>
        tillkommande. För överskjutande mängd gäller inte á-priset.</li>`:""}
    </ul>
    ${uppfyllt?`<p style="margin:10px 0 0">Anmäl skriftligen till beställaren att á-priset inte längre gäller
      och påkalla förhandling om nytt á-pris. Nås ingen överenskommelse tillämpas självkostnadsprincipen
      (löpande räkning). Spara underrättelsen på Ones SharePoint.</p>`:""}`;
}

/* ---------- Räknare: slutavräkning (3.1) ---------- */
function raknaSlut(){
  const v=id=>Number(document.getElementById(id).value.replace(",","."))||0;
  const ks=v("sl_ks"), till=v("sl_till"), avg=v("sl_avg");
  const ut=document.getElementById("sl_ut");
  if(!ks){ ut.className="out"; ut.innerHTML="Fyll i kontraktssumman."; return; }
  const mellan=avg-till;
  const g20=ks*0.20;
  if(mellan<=0){
    ut.className="out no";
    ut.innerHTML=`<span class="big">Ingen särskild slutavräkning</span>
      Värdet av tillkommande arbeten (${fmtSEK(till)}) är inte mindre än avgående (${fmtSEK(avg)}).
      Fakturera ÄTA som vanligt enligt kontraktet.`;
    return;
  }
  const tio=mellan*0.10;
  const over=mellan-g20;
  ut.className="out yes";
  ut.innerHTML=`<span class="big">One har rätt till ${fmtSEK(Math.round(tio))} — 10 % av mellanskillnaden</span>
    <ul>
      <li>Avgående arbeten överstiger tillkommande med <b>${fmtSEK(Math.round(mellan))}</b></li>
      <li>20 % av kontraktssumman: <b>${fmtSEK(Math.round(g20))}</b></li>
      ${over>0
        ? `<li>Mellanskillnaden överstiger 20 %-gränsen med <b>${fmtSEK(Math.round(over))}</b> —
             One har utöver de 10 % även rätt till rimlig ersättning för utebliven vinst på det beloppet.</li>`
        : `<li>Mellanskillnaden understiger 20 %-gränsen — enbart de 10 % gäller.</li>`}
    </ul>
    <p style="margin:10px 0 0">Fakturera beställaren. Kontrollera att samtliga ÄTA-fakturor är skickade
      och att säkerheten satts ned efter godkänd slutbesiktning.</p>`;
}

};

/* Ansvarig roll: satt värde vinner, annars härleds den ur ägare/leverantör.
   Härledningen är en gissning — ändra på kortet när den blir fel. */
function harledRoll(rad){
  if(rad.roll) return rad.roll;
  const t=((rad.agare||"")+" "+(rad.leverantor||"")+" "+(rad.till||"")).toLowerCase();
  if(/energi|vexnet|nätägare|natagare|kraftnät/.test(t)) return "Nätägare";
  if(/ingrid|beställare|bestallare|young|gyllenklo|medina/.test(t)) return "Beställare";
  if(/harju|cramo|elleholm|a-bygg|jinert|catl|flexgen|veo|mekan|vinnergi/.test(t)) return "UE";
  return "PL";
}
function kortTitel(lista,rad){
  if(lista==="hseqavvikelser") return rad.text||rad.titel||"Rondavvikelse";
  if(lista==="ur") return (rad.nr?rad.nr+" — ":"")+(rad.benamning||"");
  if(lista==="punkter") return rad.titel||"";
  if(lista==="storningar") return (rad.nr?rad.nr+" — ":"")+(rad.rubrik||rad.rutaD||"Störning");
  return rad.titel||rad.benamning||"";
}
function kanbanRader(){
  const ut=[];
  STATE.hseqAvvikelseVy = [];
  (STATE.hseqRonder||[]).forEach(r=>(r.avvikelser||[]).forEach(a=>
    STATE.hseqAvvikelseVy.push({...a,projektId:r.projektId,rondId:r.id,
      titel:a.text||"Rondavvikelse",agare:a.ansvarig,forfaller:a.senast})));
  for(const lista of Object.keys(KANBAN)){
    const kalla = lista==="hseqavvikelser" ? STATE.hseqAvvikelseVy : (STATE[lista]||[]);
    for(const rad of kalla){
      const kol=KANBAN[lista].fran[rad.status]||"pagar";
      ut.push({lista,rad,kol,roll:harledRoll(rad),titel:kortTitel(lista,rad)});
    }
  }
  return ut.filter(k=>{
    if(tavlaTyp!=="alla" && k.lista!==tavlaTyp) return false;
    if(tavlaRoll!=="alla" && k.roll!==tavlaRoll) return false;
    if(tavlaProjekt!=="alla"){
      const pid=k.rad.projektId;
      if(pid!==tavlaProjekt && pid!=="bada") return false;
    }
    return true;
  });
}
function satTavlaFilter(vilket,varde){
  if(vilket==="projekt") tavlaProjekt=varde;
  if(vilket==="roll") tavlaRoll=varde;
  if(vilket==="typ") tavlaTyp=varde;
  rita();
}

/* --- drag & drop (mus) + flyttmeny (touch) --- */
let dragKort=null;
function kdragStart(ev,lista,id){
  dragKort={lista,id};
  try{ ev.dataTransfer.effectAllowed="move"; ev.dataTransfer.setData("text/plain",lista+"|"+id); }catch(e){}
  if(ev.currentTarget&&ev.currentTarget.classList) ev.currentTarget.classList.add("dragging");
}
function kdragEnd(ev){
  if(ev.currentTarget&&ev.currentTarget.classList) ev.currentTarget.classList.remove("dragging");
  dragKort=null;
}
function kdragOver(ev){ ev.preventDefault(); try{ev.dataTransfer.dropEffect="move";}catch(e){}
  ev.currentTarget.classList.add("over"); }
function kdragLeave(ev){ ev.currentTarget.classList.remove("over"); }
function kdrop(ev,kol){
  ev.preventDefault();
  ev.currentTarget.classList.remove("over");
  let d=dragKort;
  if(!d){
    let txt=""; try{ txt=ev.dataTransfer.getData("text/plain")||""; }catch(e){}
    const bit=txt.split("|"); if(bit.length===2) d={lista:bit[0],id:bit[1]};
  }
  dragKort=null;
  if(d) flyttaKort(d.lista,d.id,kol);
}
function flyttaKort(lista,id,kol){
  const karta=KANBAN[lista]; if(!karta) return;
  const ny=karta.till[kol]; if(!ny) return;
  if(lista==="hseqavvikelser"){
    (STATE.hseqRonder||[]).forEach(r=>(r.avvikelser||[]).forEach(a=>{ if(a.id===id) a.status=ny; }));
    spara(); rita(); return;
  }
  uppdStatus(lista,id,"status",ny);
}
function sattRoll(lista,id,roll){
  if(lista==="hseqavvikelser"){
    (STATE.hseqRonder||[]).forEach(r=>(r.avvikelser||[]).forEach(a=>{ if(a.id===id) a.roll=roll; }));
    spara(); rita(); return;
  }
  uppd(lista,id,"roll",roll);
}

function kanbanKort(k){
  const id=k.rad.id, lista=k.lista;
  const forfaller = k.rad.forfaller ? dagarTill(k.rad.forfaller) : null;
  const dl = k.rad.forfaller
    ? `<span class="pill ${forfaller!==null&&forfaller<0?"p-bad":(forfaller!==null&&forfaller<=7?"p-warn":"p-wait")}">${esc(k.rad.forfaller)}</span>` : "";
  return `<div class="kcard t-${lista}" draggable="true"
      ondragstart="kdragStart(event,'${lista}','${id}')" ondragend="kdragEnd(event)">
    <div class="ktop"><span class="ktyp">${esc(KANBAN[lista].namn)}</span>${taggProjekt(k.rad.projektId)}</div>
    <div class="ktitel">${esc(k.titel)}</div>
    ${(k.rad.agare||dl)?`<div class="kmeta">${k.rad.agare?esc(k.rad.agare):""} ${dl}</div>`:""}
    <div class="krad">
      <select title="Ansvarig roll" onchange="sattRoll('${lista}','${id}',this.value)">
        ${ROLLER.map(r=>`<option value="${r}"${r===k.roll?" selected":""}>${r}</option>`).join("")}
      </select>
      <select title="Flytta till kolumn" onchange="flyttaKort('${lista}','${id}',this.value)">
        ${KOLUMNER.map(([kk,nn])=>`<option value="${kk}"${kk===k.kol?" selected":""}>${esc(nn)}</option>`).join("")}
      </select>
    </div>
  </div>`;
}

function rapportRad(pid){
  let r=(STATE.rapportstatus||[]).find(x=>x.projektId===pid);
  if(!r){
    r={id:"rap-"+pid,projektId:pid,
       styr:{tid:"gul",leverabler:"gul",kvalitet:"gul",resurser:"gul",budget:"gul"},
       prio:{kostnad:30,tid:60,kvalitet:10},
       system:{poi:"ejstartad",pcs:"ejstartad",bess:"ejstartad",ems:"ejstartad",
               scada:"ejstartad",natjanst:"ejstartad"},
       framdrift:null, prognos:"", kommentar:"", mottagare:"Ingrid Capacity AB"};
    if(!Array.isArray(STATE.rapportstatus)) STATE.rapportstatus=[];
    STATE.rapportstatus.push(r);
  }
  if(!r.styr) r.styr={}; if(!r.system) r.system={};
  if(!r.prio) r.prio={kostnad:30,tid:60,kvalitet:10};
  return r;
}
function uppdRapport(pid,grupp,falt,varde){
  const r=rapportRad(pid);
  if(grupp) { r[grupp]=r[grupp]||{}; r[grupp][falt]=varde; }
  else r[falt]=varde;
  spara(); rita();
}
function uppdRapportPrio(pid,falt,varde){
  const r=rapportRad(pid);
  r.prio[falt]=Math.max(0,Math.min(100,Number(varde)||0));
  spara(); rita();
}
function laggTillOnepMilstolpar(){
  const finns=new Set(STATE.milstolpar.filter(m=>m.projektId===valtProjekt)
    .map(m=>String(m.titel||"").toLowerCase()));
  let n=0;
  ONEP_MILSTOLPAR.forEach((t,i)=>{
    if(!finns.has(t.toLowerCase())){
      STATE.milstolpar.push({id:"m"+Date.now()+"_"+i,projektId:valtProjekt,titel:t,datum:"",status:"planerad"});
      n++;
    }
  });
  if(n){ spara(); rita(); }
}
function framdriftBerakning(pid){
  const b=STATE.betalplan.filter(x=>x.projektId===pid);
  const fakt=b.filter(x=>x.status==="fakturerad").reduce((s,x)=>s+(Number(x.andel)||0),0);
  const m=STATE.milstolpar.filter(x=>x.projektId===pid);
  const klara=m.filter(x=>x.status==="klar").length;
  return {fakt, milTot:m.length, milKlara:klara,
          milProc: m.length?Math.round(klara/m.length*100):null};
}
function trafikval(pid,falt,varde){

/* ==========================================================================
   BESTÄLLARRAPPORT — SEKRETESSGRÄNS

   Hela rapporten byggs av EN funktion: byggRapportpaket(pid). Den är den
   enda vägen från STATE till något som kan visas för eller skickas till
   beställaren. Förhandsgranskning, PDF, CSV och Markdown läser uteslutande
   det paket som funktionen returnerar — aldrig STATE direkt.

   Tre spärrar i serie:
     1. PORT      — en post måste klara arOffentlig() för sin typ. Utkast,
                    interna risker och opublicerade punkter kommer aldrig in.
     2. PROJEKTION — varje fält kopieras namngivet. Ingen spread, ingen
                    Object.assign. Ett nytt internt fält i STATE kan därför
                    inte råka följa med.
     3. GRANSKNING — det färdiga paketet skannas efter förbjudna ord och
                    siffermönster. Träff blockerar export.
   ========================================================================== */

/* Statuslägen som betyder att ärendet FAKTISKT är kommunicerat till beställaren. */
const RAPPORT_ATA_PUBLIKA = ["skickad_best","godkand_dok","godkand","fakturerad","stangd"];

/* Ord som aldrig får förekomma i ett rapportpaket. Träff = blockerad export. */
const SEKRETESSORD = [
  /påslag/i, /marginal/i, /täckningsbidrag/i, /självkostnad/i, /inköpspris/i,
  /internpris/i, /\bUE-pris/i, /kalkyl/i, /\bvinst/i, /förtjänst/i,
  /\bintern[at]?\b/i, /konfidentiell/i, /\bej för beställaren\b/i,
  /spekul/i, /\brykte/i, /misstänker att/i, /resurskonflikt/i,
  /\bà-pris/i, /\ba-pris/i, /timpris/i, /timkostnad/i
];

/* Fältnamn som aldrig projiceras, oavsett var de dyker upp. */
const SEKRETESSFALT = [
  "kalkyl","apris","arvode","timmar","belopp","summa","kostnad","kostnadNetto",
  "budgetTim","budgetMtrl","budgetUE","kontraktsvarde","debiterbar","tidrader",
  "medarbetare","bemanning","fakturor","anteckning","internt","notering"
];

function txt(v){ return v===null||v===undefined ? "" : String(v); }

/* ---------- PORT: vad får över huvud taget komma in i rapporten ---------- */
function ataArPublik(u){
  return RAPPORT_ATA_PUBLIKA.includes(u.status);
}
function riskArPublik(r){
  return r.delaMedBestallare === true && r.status !== "stangd" && txt(r.atgard).trim() !== "";
}
function punktArPublik(p){
  return p.kravsAvBestallare === true && p.status !== "klarmarkerad";
}
function milstolpeArPublik(m){
  return txt(m.titel).trim() !== "";
}

/* ---------- Uteslutna poster (projektledarens egna avbockningar) ---------- */
function rapportExkluderad(pid,typ,id){
  const r=rapportRad(pid);
  return Array.isArray(r.exkluderade) && r.exkluderade.includes(typ+":"+id);
}
function vaxlaRapportpost(pid,typ,id,med){
  const r=rapportRad(pid);
  if(!Array.isArray(r.exkluderade)) r.exkluderade=[];
  const nyckel=typ+":"+id;
  const i=r.exkluderade.indexOf(nyckel);
  if(med && i>=0) r.exkluderade.splice(i,1);
  else if(!med && i<0) r.exkluderade.push(nyckel);
  spara(); rita();
}
const RAPPORT_SEKTIONER=[
  ["sammanfattning","Sammanfattning"],["framdrift","Framdrift och status"],
  ["milstolpar","Milstolpar i huvudtidplanen"],["ata","Aviserade ÄTA och hinder"],
  ["hms","HMS och BAS-U"],["beslut","Beslut som krävs av beställaren"],
  ["risker","Projektrisker och åtgärdsplaner"]
];
function sektionMed(pid,nyckel){
  const r=rapportRad(pid);
  if(!r.sektioner || typeof r.sektioner!=="object") return true;
  return r.sektioner[nyckel]!==false;
}
function vaxlaSektion(pid,nyckel,med){
  const r=rapportRad(pid);
  if(!r.sektioner || typeof r.sektioner!=="object") r.sektioner={};
  r.sektioner[nyckel]=!!med;
  spara(); rita();
}

/* ==========================================================================
   PAKETBYGGAREN — enda vägen ut
   ========================================================================== */
function byggRapportpaket(pid){
  const p = projekt(pid);
  const r = rapportRad(pid);
  const fd = framdriftBerakning(pid);

  /* --- Projekt: sex namngivna fält, inget kontraktsvärde --- */
  const paket = {
    projekt: {
      nr: txt(p.nr), namn: txt(p.namn), ort: txt(p.ort),
      effekt: p.mw ? p.mw+" MW / "+(p.mwh||"—")+" MWh" : "",
      fardigstallande: txt(p.fardigstallande), status: txt(p.status)
    },
    meta: {
      mottagare: txt(r.mottagare), avsandare: "ONE Nordic AB",
      upprattadAv: hamtaNamn() || "", datum: idag(),
      dagarTillFardigstallande: dagarTill(p.fardigstallande)
    },
    sektioner: {}, granskning: {ok:true, anmarkningar:[]}
  };

  /* --- Sammanfattning (projektledarens eller AI-genererad, alltid granskad) --- */
  if(sektionMed(pid,"sammanfattning")){
    paket.sektioner.sammanfattning = {
      text: txt(r.sammanfattning || r.prognos)
    };
  }

  /* --- Framdrift: procent och trafikljus. Inga belopp. --- */
  if(sektionMed(pid,"framdrift")){
    paket.sektioner.framdrift = {
      fardigstallandegrad: r.framdrift===null||r.framdrift===undefined ? null : Number(r.framdrift),
      milstolparKlara: fd.milKlara, milstolparTotalt: fd.milTot,
      milstolpeProcent: fd.milProc,
      styr: STYRPARAM.map(([k,namn])=>({
        parameter: namn,
        niva: txt((r.styr&&r.styr[k])||"gul"),
        text: TRAFIK[(r.styr&&r.styr[k])||"gul"][1]
      })),
      system: BESS_SYSTEM.map(([k,namn])=>({
        system: namn,
        status: txt((r.system&&r.system[k])||"ejstartad"),
        text: (PILL[(r.system&&r.system[k])||"ejstartad"]||[,"—"])[1]
      }))
    };
  }

  /* --- Milstolpar: titel, datum, status. Inget annat. --- */
  if(sektionMed(pid,"milstolpar")){
    paket.sektioner.milstolpar = STATE.milstolpar
      .filter(m=>m.projektId===pid && milstolpeArPublik(m) && !rapportExkluderad(pid,"mil",m.id))
      .slice().sort((a,b)=>txt(a.datum||"9999").localeCompare(txt(b.datum||"9999")))
      .map(m=>({
        titel: txt(m.titel), datum: txt(m.datum),
        status: txt(m.status), statusText: (PILL[m.status]||[,txt(m.status)])[1],
        dagarKvar: m.datum ? dagarTill(m.datum) : null
      }));
  }

  /* --- ÄTA och hinder: bara det som faktiskt skickats till beställaren.
         Belopp följer med ENDAST om projektledaren fyllt i det aviserade
         beloppet — internkalkylen är aldrig kopplad hit. --- */
  if(sektionMed(pid,"ata")){
    paket.sektioner.ata = STATE.ur
      .filter(u=>u.projektId===pid && ataArPublik(u) && !rapportExkluderad(pid,"ata",u.id))
      .map(u=>({
        nr: txt(u.nr), benamning: txt(u.benamning),
        klass: txt(u.klass==="hinder" ? "Hinder" : u.klass==="bada" ? "ÄTA och hinder" : "ÄTA"),
        status: txt(u.status), statusText: (PILL[u.status]||[,txt(u.status)])[1],
        aviseratBelopp: (typeof u.aviseratBelopp==="number" && u.aviseratBelopp>0)
          ? u.aviseratBelopp : null,
        tidspaverkan: txt(u.aviseradTid),
        anmaltDatum: txt(u.underrattadDatum || u.datum)
      }));
  }

  /* --- HMS och BAS-U: aggregat, aldrig enskilda personuppgifter --- */
  if(sektionMed(pid,"hms")){
    const ronder = STATE.hseqRonder.filter(x=>x.projektId===pid);
    const inc = STATE.hseqIncidenter.filter(x=>x.projektId===pid);
    const avv = oppnaRondavvikelser(pid);
    const amp = ampAktuell(pid);
    paket.sektioner.hms = {
      antalRonder: ronder.length,
      senasteRond: txt(senasteRond(pid) && senasteRond(pid).datum),
      dagarSedanRond: dagarSedanRond(pid),
      oppnaAvvikelser: avv.length,
      akutaAvvikelser: avv.filter(a=>a.niva==="akut").length,
      olyckor: inc.filter(i=>i.typ==="olycka").length,
      tillbud: inc.filter(i=>i.typ==="tillbud").length,
      miljoincidenter: inc.filter(i=>i.typ==="miljo").length,
      ampDatum: txt(amp && amp.datum),
      kommentar: txt(r.hmsKommentar)
    };
  }

  /* --- Beslut: punkter som projektledaren märkt som beställarbeslut, plus
     röda risker som ägs av beställaren (dessa listas automatiskt enligt
     kravspecen — kräver inget manuellt delningsbeslut som riskArPublik gör). --- */
  if(sektionMed(pid,"beslut")){
    const franPunkter = STATE.punkter
      .filter(pt=>gallerFor(pt,pid) && punktArPublik(pt) && !rapportExkluderad(pid,"punkt",pt.id))
      .map(pt=>({
        titel: txt(pt.titel), agare: txt(pt.agare),
        senast: txt(pt.forfaller),
        dagarKvar: pt.forfaller ? dagarTill(pt.forfaller) : null,
        konsekvens: txt(pt.konsekvensBestallare)
      }));
    const franRisker = STATE.risker
      .filter(x=>gallerFor(x,pid) && x.status!=="stangd" && x.agarskap==="bestallare"
        && riskMatrisFarg(x.sannolikhet,x.konsekvens)==="rod"
        && !rapportExkluderad(pid,"riskbeslut",x.id))
      .map(x=>({
        titel: "Risk: "+txt(x.titel), agare: "Beställaren",
        senast: "", dagarKvar: null,
        konsekvens: txt(x.hantera||x.forebygg||x.atgard)
      }));
    paket.sektioner.beslut = franPunkter.concat(franRisker)
      .sort((a,b)=>txt(a.senast||"9999").localeCompare(txt(b.senast||"9999")));
  }

  /* --- Risker: bara de projektledaren delat, och bara med åtgärdsplan --- */
  if(sektionMed(pid,"risker")){
    paket.sektioner.risker = STATE.risker
      .filter(x=>gallerFor(x,pid) && riskArPublik(x) && !rapportExkluderad(pid,"risk",x.id))
      .slice().sort((a,b)=>riskvarde(b)-riskvarde(a))
      .map(x=>({
        titel: txt(x.titel),
        niva: {rod:"Hög",gul:"Medel",gron:"Låg"}[riskMatrisFarg(x.sannolikhet,x.konsekvens)],
        atgard: txt(x.atgard), agare: txt(x.agare)
      }));
  }

  granskaPaket(paket);
  return paket;
}

/* ==========================================================================
   GRANSKNING — sista spärren
   Skannar varje strängvärde i paketet. Träff blockerar export.
   ========================================================================== */
function granskaPaket(paket){
  const anm=[];
  const ga=(v,stig)=>{
    if(v===null||v===undefined) return;
    if(typeof v==="string"){
      SEKRETESSORD.forEach(re=>{
        if(re.test(v)) anm.push({stig, ord:String(re).replace(/[/\\i]/g,""), utdrag:v.slice(0,90)});
      });
    } else if(Array.isArray(v)){
      v.forEach((x,i)=>ga(x,stig+"["+i+"]"));
    } else if(typeof v==="object"){
      Object.keys(v).forEach(k=>{
        if(SEKRETESSFALT.includes(k) && k!=="aviseratBelopp")
          anm.push({stig:stig+"."+k, ord:"fältnamn", utdrag:"Fältet "+k+" hör inte hemma i rapporten"});
        ga(v[k], stig+"."+k);
      });
    }
  };
  ga(paket.sektioner,"rapport");
  paket.granskning = {ok: anm.length===0, anmarkningar: anm};
  return paket.granskning;
}

/* ==========================================================================
   RÄKNARE — hur mycket som filtrerats bort, till sekretessbannern
   ========================================================================== */
function rapportFiltrering(pid){
  const ata = STATE.ur.filter(u=>u.projektId===pid);
  const risker = STATE.risker.filter(x=>gallerFor(x,pid) && x.status!=="stangd");
  const punkter = STATE.punkter.filter(pt=>gallerFor(pt,pid) && pt.status!=="klarmarkerad");
  return {
    ataTotalt: ata.length, ataMed: ata.filter(ataArPublik).length,
    riskTotalt: risker.length, riskMed: risker.filter(riskArPublik).length,
    punktTotalt: punkter.length, punktMed: punkter.filter(punktArPublik).length,
    ekonomiBort: ["kontraktsvärde","betalplan","internkalkyler","á-priser",
                  "tidrapport","resursbeläggning","fakturaunderlag","kostnadsrader"]
  };
}

/* ==========================================================================
   BESTÄLLARRAPPORT — VY
   Två lägen: Redigera rapport (vad ska ingå) och Förhandsgranska (exakt vad
   beställaren får). Båda lägena läser samma paket från byggRapportpaket().
   ========================================================================== */

let rapportLage = "forhandsgranska";
let aiArbetar = false;
let aiFel = "";
let SAMPLE = null, sampleKlar = false;

function satRapportLage(l){ rapportLage=l; rita(); }

async function hamtaSample(){
  if(sampleKlar) return SAMPLE;
  sampleKlar = true;
  try{
    SAMPLE = (window.claude && typeof window.claude.use==="function")
      ? await window.claude.use("sample") : null;
  }catch(e){ SAMPLE=null; }
  if(aktivVy==="rapport") rita();
  return SAMPLE;
}

}

/* ==========================================================================
   AI-SAMMANFATTNING
   Endast det granskade paketet skickas som underlag — aldrig STATE.
   ========================================================================== */
async function genereraAiSammanfattning(){
  const pid=valtProjekt;
  const s=await hamtaSample();
  if(!s){ aiFel="AI-sammanfattning är inte tillgänglig i den här vyn."; rita(); return; }
  const paket=byggRapportpaket(pid);
  if(!paket.granskning.ok){
    aiFel="Sekretessgranskningen har anmärkningar — åtgärda dem först.";
    rita(); return;
  }
  aiArbetar=true; aiFel=""; rita();
  const underlag=JSON.stringify({
    projekt:paket.projekt, meta:{datum:paket.meta.datum, mottagare:paket.meta.mottagare},
    framdrift:paket.sektioner.framdrift, milstolpar:paket.sektioner.milstolpar,
    ata:paket.sektioner.ata, hms:paket.sektioner.hms,
    beslut:paket.sektioner.beslut, risker:paket.sektioner.risker
  });
  const instruktion =
    "Du skriver lägesrapporten från en entreprenör till beställaren i ett svenskt "+
    "batterilagerprojekt under ABT 06.\n\n"+
    "Skriv en sammanfattning på svenska, tre till fem stycken, sakligt och professionellt:\n"+
    "1. Läget i stort och framdriften.\n"+
    "2. Vad som utförts sedan förra rapporten och vad som ligger närmast i tidplanen.\n"+
    "3. Aviserade ÄTA och hinder samt deras påverkan på tid.\n"+
    "4. Arbetsmiljöläget.\n"+
    "5. Vad beställaren behöver besluta och när.\n\n"+
    "Regler: håll dig strikt till underlaget nedan. Hitta inte på siffror, datum eller "+
    "händelser. Skriv inget om priser, kalkyler, marginaler eller interna förhållanden. "+
    "Undvik värdeord och brösttoner — beställaren vill ha fakta. Inga rubriker, ingen "+
    "punktlista, bara löpande text.\n\n"+
    "UNDERLAG (JSON):\n"+underlag;
  try{
    const svar=await s(instruktion,{modelTier:"default"});
    const text=(svar&&svar.text||"").trim();
    if(!text) throw {code:"tom",message:"Tomt svar"};
    const r=rapportRad(pid);
    r.sammanfattning=text;
    r.sammanfattningKalla="AI-genererad "+idag()+" — granskad av projektledaren innan utskick";
    aiArbetar=false; spara(); rita();
    toast("Sammanfattning skapad — läs igenom den innan du skickar.");
  }catch(e){
    aiArbetar=false;
    const k=(e&&e.code)||"";
    aiFel = k==="not_granted" ? "AI-sammanfattning kräver ditt godkännande i vyn."
          : k==="rate_limited" ? "För många anrop just nu — försök igen om en stund."
          : "Sammanfattningen kunde inte skapas"+(k?" ("+k+")":"")+".";
    rita();
  }
}

    ut.push("Milstolpar klara: **"+s.framdrift.milstolparKlara+" av "+s.framdrift.milstolparTotalt+"**");
    ut.push("");
    ut.push("| Styrparameter | Status |"); ut.push("|---|---|");
    s.framdrift.styr.forEach(x=>ut.push("| "+x.parameter+" | "+x.text+" |"));
    ut.push("");
    ut.push("| System | Status |"); ut.push("|---|---|");
    s.framdrift.system.forEach(x=>ut.push("| "+x.system+" | "+x.text+" |"));
    ut.push("");
  }
  if(s.milstolpar){
    ut.push("## Milstolpar i huvudtidplanen"); ut.push("");
    ut.push("| Milstolpe | Datum | Status |"); ut.push("|---|---|---|");
    s.milstolpar.forEach(m=>ut.push("| "+m.titel+" | "+(m.datum||"—")+" | "+m.statusText+" |"));
    ut.push("");
  }
  if(s.ata){
    ut.push("## Aviserade ÄTA och hinder"); ut.push("");
    if(!s.ata.length) ut.push("Inga aviserade ärenden i perioden.");
    else{
      ut.push("| Nr | Benämning | Typ | Status | Aviserat belopp | Tidspåverkan |");
      ut.push("|---|---|---|---|---|---|");
      s.ata.forEach(a=>ut.push("| "+a.nr+" | "+a.benamning+" | "+a.klass+" | "+a.statusText+" | "+
        (a.aviseratBelopp!==null?fmtSEK(a.aviseratBelopp):"—")+" | "+(a.tidspaverkan||"—")+" |"));
    }
    ut.push("");
  }
  if(s.hms){
    const h=s.hms;
    ut.push("## Arbetsmiljö — HMS och BAS-U"); ut.push("");
    ut.push("Skyddsronder genomförda: **"+h.antalRonder+"**"+(h.senasteRond?" (senast "+h.senasteRond+")":"")+"  ");
    ut.push("Olyckor: **"+h.olyckor+"** · Tillbud: **"+h.tillbud+"** · Miljöincidenter: **"+h.miljoincidenter+"**  ");
    ut.push("Öppna avvikelser från skyddsrond: **"+h.oppnaAvvikelser+"**"+
      (h.akutaAvvikelser?" varav **"+h.akutaAvvikelser+"** akuta":"")+"  ");
    if(h.ampDatum) ut.push("Arbetsmiljöplan senast reviderad: "+h.ampDatum+"  ");
    if(h.kommentar){ ut.push(""); ut.push(h.kommentar); }
    ut.push("");

  if(s.beslut){

    if(!s.beslut.length) ut.push("Inga öppna beslutspunkter.");
    else{
      ut.push("| Beslut | Ansvarig | Senast | Konsekvens vid uteblivet besked |");
      ut.push("|---|---|---|---|");
      s.beslut.forEach(b=>ut.push("| "+b.titel+" | "+(b.agare||"—")+" | "+(b.senast||"—")+" | "+(b.konsekvens||"—")+" |"));
    }
    ut.push("");
  }
  if(s.risker){
    ut.push("## Projektrisker och åtgärdsplaner"); ut.push("");
    if(!s.risker.length) ut.push("Inga risker delade i denna rapport.");
    else{
      ut.push("| Risk | Nivå | Åtgärd | Ansvarig |"); ut.push("|---|---|---|---|");
      s.risker.forEach(x=>ut.push("| "+x.titel+" | "+x.niva+" | "+x.atgard+" | "+(x.agare||"—")+" |"));
    }
    ut.push("");
  }
  ut.push("---");
  ut.push("*Rapporten är framställd ur ONE Nordics projektportfölj. Interna kostnadsunderlag, "+
    "prissättning, resursuppgifter och ej aviserade ärenden ingår inte.*");
  return ut.join("\n");
}

async function kopieraRapportMarkdown(){
  const paket=byggRapportpaket(valtProjekt);
  if(!paket.granskning.ok){ toast("Sekretessgranskningen har anmärkningar — export stoppad.","bad"); return; }
  const md=rapportMarkdown(paket);
  try{
    await navigator.clipboard.writeText(md);
    toast("Rapporten är kopierad som Markdown.");
    return;
  }catch(e){}
  const ta=document.getElementById("mdruta");
  if(ta){ ta.value=md; ta.classList.remove("hidden"); ta.select();
    toast("Markera och kopiera texten i rutan.","warn"); }
}

async function exportRapportCsv(){
  const pid=valtProjekt;
  const paket=byggRapportpaket(pid);
  if(!paket.granskning.ok){ toast("Sekretessgranskningen har anmärkningar — export stoppad.","bad"); return; }
  const rad=[];
  const e=v=>{ const s=txt(v); return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  rad.push("Avsnitt;Post;Fält 1;Fält 2;Fält 3;Fält 4");
  rad.push(["Projekt",paket.projekt.nr+" "+paket.projekt.namn,paket.projekt.ort,
            paket.projekt.effekt,paket.projekt.fardigstallande,paket.meta.datum].map(e).join(";"));
  (paket.sektioner.milstolpar||[]).forEach(m=>
    rad.push(["Milstolpe",m.titel,m.datum,m.statusText,m.dagarKvar===null?"":m.dagarKvar+" dagar kvar",""].map(e).join(";")));
  (paket.sektioner.ata||[]).forEach(a=>
    rad.push(["ÄTA/hinder",a.nr+" "+a.benamning,a.klass,a.statusText,
              a.aviseratBelopp!==null?a.aviseratBelopp:"",a.tidspaverkan].map(e).join(";")));
  (paket.sektioner.beslut||[]).forEach(b=>
    rad.push(["Beslut",b.titel,b.agare,b.senast,b.konsekvens,""].map(e).join(";")));
  (paket.sektioner.risker||[]).forEach(x=>
    rad.push(["Risk",x.titel,x.niva,x.atgard,x.agare,""].map(e).join(";")));
  if(paket.sektioner.hms){
    const h=paket.sektioner.hms;
    rad.push(["HMS","Skyddsronder",h.antalRonder,h.senasteRond,"",""].map(e).join(";"));
    rad.push(["HMS","Incidenter","Olyckor "+h.olyckor,"Tillbud "+h.tillbud,
              "Miljö "+h.miljoincidenter,"Öppna avvikelser "+h.oppnaAvvikelser].map(e).join(";"));
  }
  await laddaNer("Bestallarrapport_"+(paket.projekt.nr||paket.projekt.namn)+"_"+idag()+".csv",
    "﻿"+rad.join("\n"));
}

/* Äldre statusvärden migreras till ÄTA-loggens åtta lägen. */
function migreraUr(){
  const karta={pagaende:"oppen", komplettering:"oppen", ejpaborjad:"oppen"};
  let andrat=false;
  (STATE.ur||[]).forEach(u=>{
    if(karta[u.status]){ u.status=karta[u.status]; andrat=true; }
    if(!ATA_STATUS.includes(u.status)){ u.status="oppen"; andrat=true; }
    if(!u.klass){ u.klass="oklar"; andrat=true; }
  });
  return andrat;
}

function timmarSedan(datum){
  if(!datum) return null;
  const d=new Date(datum+"T00:00:00");
  if(isNaN(d)) return null;
  return Math.round((Date.now()-d.getTime())/36e5);
}
/* Underrättelse ska vara skickad inom 24 h från händelsen (ABT 06 kap. 2 § 7, kap. 5 § 4). */
function underrattelseLage(u){
  if(u.klass==="utgar"||u.status==="utgar") return null;
  if(u.underrattelseDatum) return {ok:true, txt:"Underrättelse skickad "+u.underrattelseDatum};
  if(!u.handelseDatum) return {ok:false, varning:false, txt:"Händelsedatum saknas — 24-timmarsfristen kan inte räknas"};
  const h=timmarSedan(u.handelseDatum);
  if(h===null) return null;
  if(h>24) return {ok:false, varning:true, txt:`Underrättelse saknas — ${Math.floor(h/24)} dygn sedan händelsen`};
  return {ok:false, varning:false, txt:`Underrättelse ska skickas inom ${24-h} h`};
}
/* Prissättning ska vara skriftligt godkänd innan arbetet startar. */
function prisGrind(u){
  if(u.klass==="hinder"||u.klass==="utgar"||u.status==="utgar") return null;
  if(u.godkantDatum) return {ok:true, txt:"Pris skriftligt godkänt "+u.godkantDatum};
  if(u.arbeteStartat) return {ok:false, varning:true, txt:"Arbetet är startat utan skriftligt godkänt pris"};
  return {ok:false, varning:false, txt:"Pris ej godkänt — arbetet ska inte starta"};
}

/* ==========================================================================
   ÄTA-KALKYLATOR — Bilaga 06.1, Prislista 2026 (kundpris mot beställaren)
   UE:s timpriser används aldrig som kundpris. En UE-faktura går in som
   faktisk kostnad + entreprenadarvode.
   ========================================================================== */
const PRISLISTA_061 = [
  ["Montör",945],["Ledande montör",1010],["Projektledare",1245],
  ["BESS-specialist / Driftsättare",1150],
  ["Provningsingenjör",1540],["Termograför",1400],["Elkonstruktör",1325],
  ["Eldriftledare / kopplingsledare",1245]
];
const OVERTID = [[1,"Normaltid"],[1.5,"Övertid 50 % (06–07, 16–20 mån–fre)"],
                 [2,"Övertid 100 % (annan tid)"],[3,"Storhelg 200 %"]];
const KOSTNADSTYP = [["material","Material"],["ue","Underentreprenör / konsult"],
                     ["hjalpmedel","Hjälpmedel, instrument"],["resa","Traktamente och resa"]];
const ERSATTNINGSFORM = [["lopande","Löpande räkning (självkostnad)"],
                         ["aprislista","Á-pris enligt Bilaga 06.1"],["fast","Fast pris"]];
const KM_PRIS = 16;   // servicebil/personbil, inget påslag

function tomKalkyl(){
  return {form:"lopande", arbete:[], maskin:[], kostnad:[], km:0, arvode:12,
          tidDagar:0, uppdaterad:""};
}
function kalkyl(u){ if(!u.kalkyl) u.kalkyl=tomKalkyl(); return u.kalkyl; }

function kalkylSummor(k){
  const arbete=(k.arbete||[]).reduce((s,r)=>s+(Number(r.timmar)||0)*(Number(r.apris)||0)*(Number(r.ot)||1),0);
  const f=1+(Number(k.arvode)||0)/100;
  const maskinNetto=(k.maskin||[]).reduce((s,r)=>s+(Number(r.timmar)||0)*(Number(r.apris)||0),0);
  const maskin=maskinNetto*f;
  const kostNetto=(k.kostnad||[]).reduce((s,r)=>s+(Number(r.belopp)||0),0);
  const kost=kostNetto*f;
  const km=(Number(k.km)||0)*KM_PRIS;
  return {arbete, maskinNetto, maskin, kostNetto, kost, km,
          arvodeBelopp:(maskin-maskinNetto)+(kost-kostNetto),
          total: Math.round(arbete+maskin+kost+km)};
}

function kalkylAndra(id,vag,index,falt,varde){
  const u=STATE.ur.find(x=>x.id===id); if(!u) return;
  const k=kalkyl(u);
  if(vag==="rot") k[falt]= (falt==="form"?varde:Number(varde)||0);
  else { const rad=(k[vag]||[])[index]; if(!rad) return;
         rad[falt] = (falt==="text"||falt==="roll"||falt==="typ") ? varde : Number(varde)||0; }
  k.uppdaterad=idag();
  spara(); rita();
}
function kalkylRad(id,vag,ta){
  const u=STATE.ur.find(x=>x.id===id); if(!u) return;
  const k=kalkyl(u);
  k[vag]=k[vag]||[];
  if(ta!==undefined) k[vag].splice(ta,1);
  else if(vag==="arbete") k.arbete.push({roll:"Montör",timmar:0,apris:945,ot:1});
  else if(vag==="maskin") k.maskin.push({text:"",timmar:0,apris:0});
  else k.kostnad.push({text:"",belopp:0,typ:"material"});
  spara(); rita();
}
/* Spara kalkylen på ÄTA-posten: beloppet skrivs över och status flyttas fram. */
function sparaKalkyl(id){
  const u=STATE.ur.find(x=>x.id===id); if(!u) return;
  const s=kalkylSummor(kalkyl(u));
  const gammaltBelopp=u.belopp;
  u.belopp=s.total;
  u.kalkyl.uppdaterad=idag();
  if(u.status==="oppen"){ uppdStatus("ur",id,"status","prissattning"); }
  else { spara(); rita(); }
  loggaHandelse("ur",id,gammaltBelopp?fmtSEK(gammaltBelopp):"utan belopp",fmtSEK(s.total));
}

const PUNKTROLL = ["PL","UE","Beställare","Nätägare","BAS-U"];

  const tidigare=STATE.byggmoten.filter(m=>m.projektId===valtProjekt)
    .sort((a,b)=>String(b.datum).localeCompare(String(a.datum)))[0];
  const arv=(tidigare?tidigare.punkter.filter(pt=>pt.status==="oppen"):[])
    .map(pt=>({...pt,id:"pt"+Date.now()+Math.random().toString(36).slice(2,6),
               text:pt.text,arv:true}));
  STATE.byggmoten.push({id,projektId:valtProjekt,nr,datum:idag(),plats:"",
    deltagare:"",status:"utkast",punkter:arv});
  oppetMote=id; spara(); rita();
}
function uppdMote(id,falt,varde){
  const m=STATE.byggmoten.find(x=>x.id===id); if(!m) return;
  const gammalt=m[falt]; m[falt]=varde;
  if(falt==="status"&&gammalt!==varde) loggaHandelse("byggmoten",id,gammalt,varde);
  spara(); rita();
}
function nyMotespunkt(moteId,para){
  const m=STATE.byggmoten.find(x=>x.id===moteId); if(!m) return;
  m.punkter.push({id:"pt"+Date.now(),para,text:"",ansvarig:"PL",status:"oppen",urId:""});
  spara(); rita();
}
function uppdMotespunkt(moteId,ptId,falt,varde){
  const m=STATE.byggmoten.find(x=>x.id===moteId); if(!m) return;
  const pt=m.punkter.find(x=>x.id===ptId); if(!pt) return;
  pt[falt]=varde; spara(); rita();
}
function taBortMotespunkt(moteId,ptId){
  const m=STATE.byggmoten.find(x=>x.id===moteId); if(!m) return;
  m.punkter=m.punkter.filter(x=>x.id!==ptId); spara(); rita();
}
/* Skapa ett ÄTA-/hinderärende direkt ur en mötespunkt och koppla ihop dem. */
function areandeFranPunkt(moteId,ptId){
  const m=STATE.byggmoten.find(x=>x.id===moteId); if(!m) return;
  const pt=m.punkter.find(x=>x.id===ptId); if(!pt||!pt.text) {
    toast("Skriv punktens text först.","warn"); return; }
  const antal=STATE.ur.filter(u=>u.projektId===m.projektId).length+1;
  const id="u"+Date.now();
  STATE.ur.push({id,projektId:m.projektId,nr:"UR"+String(antal).padStart(3,"0"),
    benamning:pt.text,status:"oppen",klass:pt.para==="5"?"hinder":"ata",
    handelseDatum:m.datum||idag(),underrattelseDatum:"",prisgrund:"lopande",
    belopp:null,godkantDatum:"",fakturaDatum:"",arbeteStartat:false,orsak:"",
    kalla:`Byggmöte ${m.nr} §${pt.para}`});
  pt.urId=id;
  spara(); rita();
}
function motesFlagga(m){
  return m.punkter.filter(pt=>(pt.para==="4"||pt.para==="5")&&!pt.urId&&pt.text);
}

/* ==========================================================================
   HSEQ OCH KMA — BAS-U
   Skyddsrond varannan vecka, incidentrapport inom 24 h, ID06 och personalliggare.
   Brott mot HSE- eller miljöplanen är vitesgrundande enligt kontraktet.
   ========================================================================== */
const HSEQ_VITE = 10000;
const RONDPUNKTER = [
  ["elskarm","Elskärmning, högspänning och avspärrningar"],
  ["heta","Heta arbeten och brandutrustning"],
  ["ppe","Personlig skyddsutrustning och ID06-kontroll"],
  ["lyft","Kranlyft, schakt och fallskydd"],
  ["kemi","Kemikalier, miljö och saneringsutrustning"]
];
const AVVIKELSENIVA = [["lag","Låg"],["medium","Medium"],["akut","Akut"]];
const INCIDENTTYP = [["tillbud","Tillbud"],["olycka","Olycka"],["miljo","Miljöincident"]];

function senasteRond(pid){
  return STATE.hseqRonder.filter(r=>r.projektId===pid)
    .sort((a,b)=>String(b.datum).localeCompare(String(a.datum)))[0]||null;
}
function dagarSedanRond(pid){
  const r=senasteRond(pid);
  if(!r||!r.datum) return null;
  const d=dagarTill(r.datum);
  return d===null?null:Math.abs(Math.min(d,0));
}
function ampAktuell(pid){
  return STATE.hseqAmp.filter(a=>a.projektId===pid)
    .sort((a,b)=>String(b.datum).localeCompare(String(a.datum)))[0]||null;
}
function oppnaRondavvikelser(pid){
  const ut=[];
  STATE.hseqRonder.filter(r=>r.projektId===pid).forEach(r=>
    (r.avvikelser||[]).filter(a=>a.status!=="atgardad").forEach(a=>ut.push({...a,rondId:r.id,rondDatum:r.datum})));
  return ut;
}
/* En incident ska vara rapporterad inom 24 timmar. */
function incidentLage(i){
  if(i.rapporterad) return {ok:true,txt:"Rapporterad "+(i.rapportDatum||"")};
  const h=timmarSedan(i.datum);
  if(h===null) return {ok:false,varning:false,txt:"Datum saknas"};
  if(h>24) return {ok:false,varning:true,txt:`Rapport saknas — ${Math.floor(h/24)} dygn sedan händelsen`};
  return {ok:false,varning:false,txt:`Rapport ska skickas inom ${Math.max(0,24-h)} h`};
}

  const id="sr"+Date.now();
  STATE.hseqRonder.push({id,projektId:valtProjekt,datum:idag(),utfordAv:hamtaNamn()||"",
    checklista:{},enia:"",avvikelser:[]});

}

function revideraAmp(){
  const nuvarande=ampAktuell(valtProjekt);

  loggaHandelse("hseqAmp",id,nuvarande?nuvarande.version:"—","rev "+ver);
}

    <div class="grid g2" style="margin-top:16px">

        <div class="tscroll"><table>

          <tbody>${ronder.length?ronder.map(x=>{

          }).join(""):`<tr><td colspan="5">Ingen rond registrerad.</td></tr>`}</tbody>

          <div style="font-size:13px">${amp?`${esc(amp.version)} — reviderad ${esc(amp.datum)}`

        <div class="rowbtns" style="margin-top:8px">

          <tbody>${id06.length?id06.slice(0,6).map(x=>`<tr>

                   ["mottagen","Under granskning"],["godkand","Godkänd"]];
/* Matchar mot krav-texten (inte kategoriindex) så mallen kan justeras utan
   att låsningen tappar bort sig. */
function slutdokArLast(d,pid){
  return /slutbesiktningsprotokoll/i.test(d.krav||"") && !slutdokKritisktKlart(pid);
}

function slutdokRader(pid){
  if(!Array.isArray(STATE.slutdok)) STATE.slutdok=[];
  let rader=STATE.slutdok.filter(d=>d.projektId===pid);
  if(!rader.length){
    SLUTDOK_MALL.forEach(([kat,krav],ki)=>krav.forEach((k,i)=>{
      STATE.slutdok.push({id:`sd-${pid}-${ki}-${i}`,projektId:pid,kategori:kat,krav:k,
        status:"ejpaborjad",ansvarig:"",senast:"",referens:""});
    }));
    rader=STATE.slutdok.filter(d=>d.projektId===pid);
  }
  return rader;
}
function uppdSlutdok(id,falt,varde){
  const d=STATE.slutdok.find(x=>x.id===id); if(!d) return;
  const gammalt=d[falt]; d[falt]=varde;
  if(falt==="status"&&gammalt!==varde){
    const g=(DOKSTATUS.find(s=>s[0]===gammalt)||["",gammalt])[1];
    const n=(DOKSTATUS.find(s=>s[0]===varde)||["",varde])[1];
    STATE.andringslogg.unshift({ts:new Date().toISOString(),anvandare:hamtaNamn()||"okänd",
      projektId:d.projektId,text:`Slutdok ${d.krav}: ${g} → ${n}`});
    if(STATE.andringslogg.length>150) STATE.andringslogg.length=150;
  }
  spara(); rita();
}
function slutdokIndex(pid){
  const rader=slutdokRader(pid);
  const godkanda=rader.filter(d=>d.status==="godkand").length;
  return {rader, godkanda, av:rader.length,
          proc: rader.length?Math.round(godkanda/rader.length*100):0};
}
/* Kritiska kategorier 1–4 låser upp M6 när allt är godkänt. */
function slutdokKritisktKlart(pid){
  const kritiska=SLUTDOK_MALL.slice(0,4).map(([k])=>k);
  const rader=slutdokRader(pid).filter(d=>kritiska.includes(d.kategori));
  return rader.length>0 && rader.every(d=>d.status==="godkand");
}
function dagarTillM6(pid){
  const m=STATE.milstolpar.find(x=>x.projektId===pid&&/färdigställ|slutbesikt/i.test(x.titel||""));
  return m&&m.datum?dagarTill(m.datum):null;
}

/* ==========================================================================
   RISKER — kategori, riskägare och tvåstegs åtgärdsplan
   ========================================================================== */
const RISKKATEGORI = [["teknik","Teknik / BESS (POI, PCS, EMS)"],["mark","Entreprenad / mark"],
  ["leverans","Leverans / long-lead"],["kontrakt","Kontrakt / ekonomi"],["hseq","HSEQ / arbetsmiljö"]];
const RISKAGARE = [["one","ONE Nordic (entreprenörsrisk)"],["bestallare","Beställaren"],
  ["delad","Delad / tredje part"]];
const RISKSTATUS_NY = [["oppen","Aktiv"],["overvakad","Mitigerad / bevakad"],
  ["stangd","Stängd / avförd"],["utlost","Utlöst"]];

/* 5×5-riskmatrisen enligt kravspecen — konsekvens väger tyngre än sannolikhet
   (t.ex. S1×K5 är Gul, inte Röd, medan S5×K1 är Gul, inte Grön), så färgen
   slås upp i tabellen och räknas inte fram som en enkel produkt-tröskel. */
const RISKMATRIS_TABELL = [
  ["gron","gron","gron","gul","gul"],   // sannolikhet 1
  ["gron","gron","gron","gul","rod"],   // sannolikhet 2
  ["gron","gron","gul","rod","rod"],    // sannolikhet 3
  ["gron","gul","gul","rod","rod"],     // sannolikhet 4
  ["gul","gul","rod","rod","rod"]       // sannolikhet 5
];
function riskMatrisFarg(s,k){
  s=Math.max(1,Math.min(5,Number(s)||1));
  k=Math.max(1,Math.min(5,Number(k)||1));
  return RISKMATRIS_TABELL[s-1][k-1];
}
function riskNiva(r){
  return riskMatrisFarg(r.sannolikhet,r.konsekvens);
}
/* Exponentiellt riskvärde i kronor: (sannolikhet × konsekvens) × estimerad
   finansiell påverkan — det mått som styr KPI:n "Exponentiellt Riskvärde". */
function riskExponering(r){
  return riskvarde(r)*(Number(r.estimeradKostnadSEK)||0);
}
function uppdRisk(id,falt,varde){
  if(falt==="status") uppdStatus("risker",id,"status",varde);
  else uppd("risker",id,falt,varde);
}
/* Utlöst risk som ligger hos beställaren blir ett hinderärende med 24-timmarsklocka. */
function riskTillArende(id){
  const r=STATE.risker.find(x=>x.id===id); if(!r) return;
  const pid = r.projektId==="bada" ? valtProjekt : r.projektId;
  const antal=STATE.ur.filter(u=>u.projektId===pid).length+1;
  const nyId="u"+Date.now();
  STATE.ur.push({id:nyId,projektId:pid,nr:"UR"+String(antal).padStart(3,"0"),
    benamning:r.titel,status:"oppen",
    klass: r.agarskap==="bestallare" ? "hinder" : "oklar",
    handelseDatum:idag(),underrattelseDatum:"",prisgrund:"lopande",belopp:null,
    godkantDatum:"",fakturaDatum:"",arbeteStartat:false,orsak:
      r.agarskap==="bestallare"?"best_atagande":"", kalla:"Risk "+r.id});
  r.status="utlost"; r.arendeId=nyId;
  spara(); rita();
  visa("ata");
}

function ritaRiskmatris(pid){
  const rutor=[];
  for(let k=5;k>=1;k--){
    const rad=[];
    for(let s=1;s<=5;s++){
      const rv=s*k;
      const traffar=STATE.risker.filter(r=>gallerFor(r,pid)&&r.status!=="stangd"
        &&Number(r.sannolikhet)===s&&Number(r.konsekvens)===k);
      const kl=riskMatrisFarg(s,k);
      rad.push(`<td class="mtx ${kl}" title="Sannolikhet ${s} × konsekvens ${k} = ${rv}">
        ${traffar.length?`<b>${traffar.length}</b>`:""}</td>`);
    }
    rutor.push(`<tr><th class="mtxax">${k}</th>${rad.join("")}</tr>`);
  }
  return `<table class="matris">
    <tbody>${rutor.join("")}
    <tr><th></th>${[1,2,3,4,5].map(s=>`<th class="mtxax">${s}</th>`).join("")}</tr></tbody>
  </table>`;
}

function ritaRisker2(){
  const pid=valtProjekt, p=projekt(pid);
  const risker=STATE.risker.filter(r=>gallerFor(r,pid));
  const aktiva=risker.filter(r=>r.status!=="stangd");
  const kritiska=aktiva.filter(r=>riskvarde(r)>=15);
  const utanForebygg=kritiska.filter(r=>!r.forebygg&&!r.atgard);
  const exponering=aktiva.reduce((s,r)=>s+riskExponering(r),0);

  document.getElementById("v-risker").innerHTML=`
    ${projektvaljare()}

    <div class="grid g5">
      ${kpi("Identifierade risker",risker.length,aktiva.length+" aktiva")}
      ${kpi("Kritiska (RV ≥ 15)",kritiska.length,"kräver åtgärdsplan",kritiska.length?"bad":"")}
      ${kpi("Exponentiellt Riskvärde",fmtSEK(exponering),"RV × est. finansiell påverkan")}
      ${kpi("Beställarens risker",aktiva.filter(r=>r.agarskap==="bestallare").length,"lyfts i beställarrapporten")}
      ${kpi("Utan förebyggande åtgärd",utanForebygg.length,"av de kritiska",utanForebygg.length?"warn":"")}

let toastTimer=null;
/* Egen dialogruta. prompt()/confirm() är blockerade i artifact-sandboxen och
   returnerar då null utan att något syns — därför frågar appen i sidan i stället. */
let modalSvara=null;
function modalStang(svar){
  const r=document.getElementById("mdl");
  if(r) r.classList.remove("on");
  const f=modalSvara; modalSvara=null;
  if(f) f(svar);
}
function modalBygg(){
  if(document.getElementById("mdl")) return;
  const d=document.createElement("div");
  d.id="mdl"; d.className="mdl"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true");
  d.innerHTML='<div class="mbox"><div class="mhd"></div><div class="mkropp"></div><div class="mfot"></div></div>';
  d.addEventListener("mousedown",e=>{ if(e.target===d) modalStang(null); });
  document.body.appendChild(d);
  document.addEventListener("keydown",e=>{
    const r=document.getElementById("mdl");
    if(!r||!r.classList.contains("on")) return;
    if(e.key==="Escape"){ e.preventDefault(); modalStang(null); }
    if(e.key==="Enter"&&e.target&&e.target.tagName!=="TEXTAREA"){
      e.preventDefault(); const ok=r.querySelector(".mfot .btn:not(.sec)"); if(ok) ok.click();
    }
  });
}
/* falt: [{namn,etikett,typ:"text"|"textarea"|"date"|"number",placeholder,varde,valfri}]
   Löser ut ett objekt med fältvärden, eller null om användaren avbryter. */
function fraga(o){
  modalBygg();
  const r=document.getElementById("mdl");
  const falt=o.falt||[{namn:"varde",etikett:o.etikett||"Värde"}];
  r.querySelector(".mhd").innerHTML=
    `<h3>${esc(o.titel||"Fyll i")}</h3>`+(o.lead?`<p>${esc(o.lead)}</p>`:"");
  r.querySelector(".mkropp").innerHTML=falt.map((f,i)=>{
    const id="mf"+i, v=esc(f.varde||""), ph=esc(f.placeholder||"");
    const inn = f.typ==="textarea"
      ? `<textarea id="${id}" placeholder="${ph}">${v}</textarea>`
      : `<input id="${id}" type="${f.typ||"text"}" value="${v}" placeholder="${ph}">`;
    return `<div class="f"><label>${esc(f.etikett||f.namn)}</label>${inn}</div>`;
  }).join("");
  r.querySelector(".mfot").innerHTML=
    `<button class="btn sec" onclick="modalStang(null)">Avbryt</button>
     <button class="btn${o.fara?" fara":""}" onclick="modalSvar()">${esc(o.ok||"Spara")}</button>`;
  r.classList.add("on");
  setTimeout(()=>{ const f=r.querySelector(".mkropp input,.mkropp textarea"); if(f) f.focus(); },40);
  return new Promise(res=>{
    modalSvara=res;
    r._falt=falt;
  });
}
function modalSvar(){
  const r=document.getElementById("mdl"); if(!r) return;
  const falt=r._falt||[], ut={};
  let tomt=false;
  falt.forEach((f,i)=>{
    const el=document.getElementById("mf"+i);
    const v=el?String(el.value||"").trim():"";
    if(!v && !f.valfri && i===0) tomt=true;
    ut[f.namn]=v;
  });
  if(tomt){ const el=document.getElementById("mf0"); if(el){ el.focus(); el.style.borderColor="var(--rod)"; } return; }
  modalStang(ut);
}
/* Ja/nej-ruta. Löser ut true eller false. */
function bekrafta(txt,o){
  o=o||{};
  modalBygg();
  const r=document.getElementById("mdl");
  r.querySelector(".mhd").innerHTML=`<h3>${esc(o.titel||"Bekräfta")}</h3><p>${esc(txt)}</p>`;
  r.querySelector(".mkropp").innerHTML="";
  r.querySelector(".mfot").innerHTML=
    `<button class="btn sec" onclick="modalStang(false)">Avbryt</button>
     <button class="btn${o.fara===false?"":" fara"}" onclick="modalStang(true)">${esc(o.ok||"Ta bort")}</button>`;
  r._falt=[];
  r.classList.add("on");
  setTimeout(()=>{ const b=r.querySelector(".mfot .btn:not(.sec)"); if(b) b.focus(); },40);
  return new Promise(res=>{ modalSvara=res; });
}

function toast(txt,typ){
  let el=document.getElementById("toast");

      kor:()=>{ valjProjekt(u.projektId); oppenAta=u.id; visa("ata"); }}));
  MILSTOLPE_MODELL.forEach(m=>
    ut.push({t:"Milstolpe",label:m.kod+" · "+m.namn,sub:m.andel+" %",kor:()=>visa("milstolpar")}));

      kor:()=>{ valjProjekt(m.projektId); oppetMote=m.id; visa("moten"); }}));

function oppnaCmd(){
  document.getElementById("cmdk").classList.add("on");
  const i=document.getElementById("cmdinput"); i.value=""; i.focus(); filtreraCmd();
}
function stangCmd(){ document.getElementById("cmdk").classList.remove("on"); }
function filtreraCmd(){
  const q=(document.getElementById("cmdinput").value||"").toLowerCase().trim();
  const alla=cmdIndex();
  cmdTraffar = q ? alla.filter(c=>(c.label+" "+c.t+" "+c.sub).toLowerCase().includes(q)).slice(0,40)
                 : alla.filter(c=>c.t==="Vy"||c.t==="Site").slice(0,14);
  cmdVald=0;
  document.getElementById("cmdlist").innerHTML = cmdTraffar.length
    ? cmdTraffar.map((c,i)=>`<li data-i="${i}" aria-selected="${i===0}">
        <span class="ct">${esc(c.t)}</span><span class="cl">${esc(c.label)}</span>
        ${c.sub?`<span class="cs">${esc(c.sub)}</span>`:""}</li>`).join("")
    : `<li class="ctom">Inga träffar</li>`;
  document.querySelectorAll("#cmdlist li[data-i]").forEach(li=>{
    li.onclick=()=>{ cmdTraffar[+li.dataset.i].kor(); stangCmd(); };
  });
}
addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); oppnaCmd(); return; }
  const oppen=document.getElementById("cmdk")&&document.getElementById("cmdk").classList.contains("on");
  if(!oppen) return;
  if(e.key==="Escape"){ stangCmd(); return; }
  const lis=[...document.querySelectorAll("#cmdlist li[data-i]")];
  if(e.key==="ArrowDown"){ e.preventDefault(); cmdVald=Math.min(cmdVald+1,lis.length-1); }
  if(e.key==="ArrowUp"){ e.preventDefault(); cmdVald=Math.max(cmdVald-1,0); }
  if(e.key==="Enter"&&cmdTraffar[cmdVald]){ cmdTraffar[cmdVald].kor(); stangCmd(); return; }
  lis.forEach((li,i)=>li.setAttribute("aria-selected",i===cmdVald));
  if(lis[cmdVald]) lis[cmdVald].scrollIntoView({block:"nearest"});
});

function passerarFilter(u){
  if(snabbFilter==="alla") return true;
  const und=underrattelseLage(u), pris=prisGrind(u);
  if(snabbFilter==="larm") return !!((und&&und.varning)||(pris&&pris.varning));
  if(snabbFilter==="oppna") return !["stangd","utgar"].includes(u.status);
  if(snabbFilter==="min"){
    return ["oppen","prissattning","godkand"].includes(u.status)
      || !!((und&&und.varning)||(pris&&pris.varning));
  }
  return true;
}
