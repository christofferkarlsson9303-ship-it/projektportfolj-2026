function kfG(g){return {marktemp:String(g.marktemp),rho:g.rho,djup:g.djup,grupper:1,avst:String(g.avst),ror:g.ror};}
function genBess(g){
  const nB=Math.ceil(g.mwh/g.mwhC), nS=Math.ceil(g.mw/g.mwS), perS=Math.ceil(nB/nS), nR=Math.ceil(nS/g.sPerR);
  const out=[]; const pad=n=>String(n).padStart(2,"0");
  out.push({lib:"etab",ident:"Projekt",params:{veckor:g.veckor,mw:g.mw}});
  out.push({lib:"mark",ident:"Område",params:{yta:Math.round(nB*60+nS*45+600),kran:200,stangsel:g.stangsel,grind:2,stolpe:4,krantim:Math.ceil((nB+nS)*1.5+8)}});
  out.push({lib:"sv",ident:"+SV01",params:{fack:nR+3,lev:"UE/ONE Nordic",jord:40}});
  out.push({lib:"hk",ident:"+HK01",params:{trafo:"Ja",kabel:"AXQJ PURE 4x150/41",langd:40}});
  let b=0;
  for(let s=1;s<=nS;s++){out.push({lib:"skid",ident:"+MV"+pad(s),params:{mw:g.mwS,jord:30,kct:1}});
    for(let j=0;j<perS&&b<nB;j++){b++;out.push({lib:"batt",ident:"+B"+pad(b),params:{skid:"+MV"+pad(s),dckabel:"AXQ 1x240 Al",dcn:g.dcn,dcl:g.dcl,aux:"Nej – matas från skid",auxl:60,jord:35}});}}
  for(let r=0;r<nR;r++){const skids=[];for(let s=r*g.sPerR+1;s<=Math.min(nS,(r+1)*g.sPerR);s++)skids.push(s);
    skids.forEach((s,i)=>{const nedstr=skids.length-i; const mw=nedstr*g.mwS; const last=i===0;
      out.push({lib:"mv",ident:`+W${pad(r+1)}${pad(i+1)}`,params:{fran:"+MV"+pad(s),till:last?"+SV01":"+MV"+pad(skids[i-1]),...mvVal(mw,g.kv,Object.assign({},kfG(g),{grupper:last?nR:1})),langd:last?g.lSV:g.lSkid,mw,kv:g.kv,...kfG(g),grupper:last?nR:1,skarv:0,schakt:"N075 0,4–0,9 m normal (137.13)"}});});}
  if(g.poc==="Ja") out.push({lib:"poc",ident:"+W00",params:{...mvVal(g.mw,g.kv,kfG(g)),langd:g.lPoc,mw:g.mw,kv:g.kv,...kfG(g)}});
  out.push({lib:"fiber",ident:"+F01",params:{langd:Math.round(nS*g.lSkid+nR*g.lSV+50),nod:nS+2,data:6,datal:30}});
  out.push({lib:"jord",ident:"+J01",params:{ring:Math.round(g.stangsel*1.1+nB*10),spett:Math.max(8,nS*2),staket:Math.ceil(g.stangsel/25),ask:0}});
  return {items:out,nB,nS,nR,perS};
}

function codeCost(c,n,k){
  const r=S.settings.rates,f=+k.faktor||1,pa=k.pas||{};
  const hb=(c.b||0)*n*f,hm=(c.m||0)*n*f,hx=(c.x||0)*n*f;
  let arb=(c.b!=null||c.m!=null)?((c.b||0)*r.bered+(c.m||0)*r.mont)*n*f:(c.arb||0)*n;
  let msk=c.x!=null?(c.mk!=null?c.mk*(r.maskin/1190)*n*f:hx*r.maskin):(c.mk||0)*n;
  let mat=k.matMode==="beredning"?0:(c.mat||0)*n;
  let ov=(c.ov||0)*n;
  arb*=1+(+pa.arb||0)/100; mat*=1+(+pa.mat||0)/100; msk*=1+(+pa.msk||0)/100; ov*=1+(+pa.ov||0)/100;
  return {hb,hm,hx,arb,mat,msk,ov,tot:arb+mat+msk+ov};
}
function kalkylSum(k,p){
  const t={hb:0,hm:0,hx:0,arb:0,mat:0,msk:0,ov:0,tot:0,rows:[]};
  k.rader.forEach(r=>{const c=r.egen?{b:r.b,m:r.m,x:r.x,arb:0,mat:r.mat,mk:null,ov:r.ov,ben:r.ben,enh:r.enh}:cat(r.kod); if(!c){t.rows.push({r,c:null,v:null});return;}
    const v=codeCost(c,+r.n||0,k); t.rows.push({r,c,v}); ["hb","hm","hx","arb","mat","msk","ov","tot"].forEach(x=>t[x]+=v[x]);});
  if(k.matMode==="beredning"&&p){const m=aggMateriel(p).reduce((a,x)=>a+x.n*x.pris,0)*(1+(+(k.pas||{}).mat||0)/100);t.matBer=m;t.mat+=m;t.tot+=m;}
  t.risk=t.tot*(1+(+k.risk||0)/100); t.vinst=t.risk*(1+(+k.vinst||0)/100); return t;
}
function ufKalkyl(p){return p.kalkyler.find(k=>k.status==="UF")||p.kalkyler.find(k=>k.status==="Huv")||p.kalkyler[0];}
function aggMateriel(p,s=S){const m={};p.beredning.konst.forEach(k=>k.m.forEach(x=>{const a=s.materiel.find(z=>z.art===x.art);const key=x.art;m[key]=m[key]||{art:x.art,ben:a?.ben||"Okänd artikel",enh:a?.enh||"",pris:a?.pris||0,lev:a?.lev||"",lk:a?.lk,bl:a?.bl,kalla:a?.kalla||"",n:0,konst:[]};m[key].n+=+x.n||0;m[key].konst.push(k.ident);}));return Object.values(m).filter(x=>x.n);}
function aggKoder(p){const m={};p.beredning.konst.forEach(k=>k.k.forEach(x=>{m[x.kod]=(m[x.kod]||0)+(+x.n||0);}));return m;}
function kalkylFromBeredning(p,s=S){const ak=aggKoder(p);const k={id:uid(),nr:"K"+(2000+Math.floor(Math.random()*8000)),namn:"Kalkyl av beredning "+p.beredning.nr,typ:"P2",status:p.kalkyler.length?"Alt":"Huv",faktor:1,pas:{arb:0,mat:0,msk:0,ov:0},risk:0,vinst:0,matMode:"katalog",
  rader:Object.entries(ak).sort((a,b)=>a[0].localeCompare(b[0],"sv",{numeric:true})).map(([kod,n])=>({id:uid(),kod,n:+n.toFixed(4),matris:1,kom:""}))};p.kalkyler.push(k);return k;}
function utfall(p){const r=S.settings.rates;const t={hb:0,hm:0,hx:0,arb:0,msk:0,mat:0,ov:0};
  p.tid.forEach(x=>{if(x.roll==="bered"){t.hb+=+x.h;t.arb+=x.h*r.bered;}else if(x.roll==="mont"){t.hm+=+x.h;t.arb+=x.h*r.mont;}else{t.hx+=+x.h;t.msk+=x.h*r.maskin;}});
  p.bestallningar.filter(b=>b.status==="Levererad").forEach(b=>b.rader.forEach(x=>t.mat+=x.n*x.pris));
  p.kostnader.forEach(x=>{if(x.typ==="Materiel")t.mat+=+x.belopp;else if(x.typ==="Maskin")t.msk+=+x.belopp;else t.ov+=+x.belopp;});
  t.tot=t.arb+t.msk+t.mat+t.ov; return t;}
function fakturerat(p){return p.fakturor.filter(f=>f.status!=="Makulerad").reduce((a,f)=>a+f.netto,0);}
function ataGodk(p){return p.ata.filter(a=>a.status==="Godkänd").reduce((a,x)=>a+(+x.belopp||0),0);}

function lopandeUnderlag(p){const d=S.settings.deb,rows=[];
  const t=p.tid.filter(x=>!x.fakt); const roller={bered:"Beredare",mont:"Montör",maskin:"Maskin"};
  Object.keys(roller).forEach(rk=>{const hh=t.filter(x=>x.roll===rk).reduce((a,x)=>a+(+x.h),0);if(hh)rows.push({text:`Arbete ${roller[rk].toLowerCase()} enligt tidrapport`,antal:hh,enh:"tim",apris:d[rk],src:"tid",roll:rk});});
  p.kostnader.filter(x=>!x.fakt).forEach(x=>{const pas=x.typ==="Materiel"?S.settings.matPaslag:S.settings.uePaslag;rows.push({text:`${x.text} (${x.lev}) inkl. ${pas} % påslag`,antal:1,enh:"st",apris:x.belopp*(1+pas/100),src:"kost",id:x.id});});
  return rows;}
function createFaktura(p,s=S,o={}){
  const nr="F"+(26000+s.projects.reduce((a,x)=>a+x.fakturor.length,0)+1);const rows=[];const datum=o.datum||today();
  if(o.planId){const pl=p.fakturaplan.find(x=>x.id===o.planId);rows.push({text:`Delfaktura enligt fakturaplan: ${pl.text} (${pl.pct} % av ${kr(p.kontrakt)})`,antal:1,enh:"st",apris:p.kontrakt*pl.pct/100});pl.fakt=nr;}
  if(o.lopande){lopandeUnderlag(p).forEach(r=>rows.push(r));p.tid.filter(x=>!x.fakt).forEach(x=>x.fakt=nr);p.kostnader.filter(x=>!x.fakt).forEach(x=>x.fakt=nr);}
  if(o.ata!==false){p.ata.filter(a=>a.status==="Godkänd"&&!a.fakt&&(o.ata||o.lopande)).forEach(a=>{rows.push({text:`${a.nr}: ${a.text}`,antal:1,enh:"st",apris:+a.belopp});a.fakt=nr;});}
  const netto=rows.reduce((a,r)=>a+r.antal*r.apris,0);
  const f={id:uid(),nr,datum,forfall:addDays(datum,30),status:"Utkast",rows,netto,moms:netto*s.settings.moms/100};p.fakturor.push(f);return f;}

function vUppf(){const p=P();const k=ufKalkyl(p);const t=k?kalkylSum(k,p):null;const u=utfall(p);const fg=(+p.fardig||0)/100;
  const intakt=p.debitering==="fast"?p.kontrakt+ataGodk(p):fakturerat(p)+lopandeUnderlag(p).reduce((a,r)=>a+r.antal*r.apris,0);
  const ueSak=t?t.rows.filter(x=>x.c?.kat==="BESS"&&x.v&&!x.v.tot).length:0;const prog=t?(u.arb+t.arb*(1-fg))+(u.msk+t.msk*(1-fg))+(u.ov+t.ov*(1-fg))+Math.max(u.mat,t.mat):u.tot;
  const rows=[["Timmar bered.",t?.hb,u.hb,true],["Timmar montör",t?.hm,u.hm,true],["Maskintimmar",t?.hx,u.hx,true],["Arbete",t?.arb,u.arb],["Materiel",t?.mat,u.mat],["Maskin",t?.msk,u.msk],["Övrigt/UE",t?.ov,u.ov],["Totalt",t?.tot,u.tot]];
  const max=Math.max(...rows.filter(r=>!r[3]).map(r=>Math.max(r[1]||0,r[2]||0)),1),maxh=Math.max(...rows.filter(r=>r[3]).map(r=>Math.max(r[1]||0,r[2]||0)),1);
  const bars=rows.map(([l,a,bv,isH])=>{const m=isH?maxh:max;const over=(bv||0)>(a||0)*fg*1.1&&fg>0;return `<div>${l}</div><div class="bars"><div class="b k" style="width:${(a||0)/m*100}%" title="Kalkyl"></div><div class="b u ${over?"over":""}" style="width:${(bv||0)/m*100}%" title="Utfall"></div><div class="small muted">${isH?`${h(a)} / ${h(bv)} tim`:`${kr(a)} / ${kr(bv)}`}</div></div>`;}).join("");
  return `${flow("Uppföljning")}${phead("Uppföljning",k?`<span class="small muted">mot ${esc(k.nr)} (${k.status})</span>`:"")}
  <div class="kpis"><div class="kpi"><div class="l">Intäkt (order)</div><div class="v">${kr(intakt)}</div><div class="s">${p.debitering==="fast"?"kontrakt + godkända ÄTA":"fakturerat + ofakturerat"}</div></div>
  <div class="kpi"><div class="l">Kalkylerad kostnad</div><div class="v">${t?kr(t.tot):"–"}</div><div class="s">grundkalkyl</div></div>
  <div class="kpi"><div class="l">Utfall</div><div class="v">${kr(u.tot)}</div><div class="s">färdigställt ${fmt(p.fardig)} %</div></div>
  <div class="kpi"><div class="l">Prognos slutkostnad</div><div class="v">${kr(prog)}</div><div class="s">utfall + kvarvarande kalkyl</div></div>
  <div class="kpi"><div class="l">Prognos TB${ueSak?` <span class="pill p-orange">${ueSak} UE utan pris</span>`:""}</div><div class="v" style="color:${intakt-prog<0?"var(--red)":"var(--green)"}">${kr(intakt-prog)}</div><div class="s">${intakt?fmt((intakt-prog)/intakt*100,1):"–"} % TG</div></div></div>
  <div class="panel"><div class="ph"><h2>Kalkyl mot utfall</h2><div class="sp"></div><div class="legend"><span class="lk">Kalkyl</span><span class="lu">Utfall</span></div></div><div class="cmp">${bars}</div>
  <p class="small muted" style="margin:12px 0 0">Röd stapel: utfallet överstiger kalkylen × färdigställandegrad med mer än 10 %. Utfall tid värderas till internkostnad (KLG-timpriser). Prognos: arbete, maskin och övrigt = utfall + kalkyl × (1 − färdigställandegrad); materiel = det högsta av utfall och kalkyl.</p></div>`;
}

function modal(html){document.getElementById("ovl").innerHTML=`<div class="ov" data-a="closeov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;}
function closeModal(){document.getElementById("ovl").innerHTML="";}
function konstModal(libId,existing){const L=LIB.find(l=>l.id===libId);const pr=existing?existing.params:defaults(L);
  modal(`<div class="ph"><div><div class="small muted">${esc(L.grupp)}</div><h2>${esc(L.namn)}</h2></div><div class="sp"></div><button class="btn g" data-a="close" aria-label="Stäng">✕</button></div>
  <div class="form">${L.params.map(x=>`<label>${esc(x.l)} ${x.t==="text"?`<input id="kp_${x.k}" value="${esc(pr[x.k])}">`:x.n?`<input type="number" step="any" id="kp_${x.k}" value="${esc(pr[x.k])}">`:`<select id="kp_${x.k}">${x.o.map(o=>`<option ${o===pr[x.k]?"selected":""}>${esc(o)}</option>`).join("")}</select>`}</label>`).join("")}
  ${existing?"":`<label>Identitet <input id="kp__ident" placeholder="t.ex. KS 14"></label>`}</div>
  <p class="small muted" style="margin:0">${existing?"Materiel och kalkylkoder genereras om från valen. Manuella ändringar på konstruktionen skrivs över.":"Materiel och P2-koder genereras från valen."}</p>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn s" data-a="close">Avbryt</button><button class="btn" data-a="savekonst" data-id="${libId}" data-k="${existing?existing.id:""}">${existing?"Generera om":"Lägg på skrivbordet"}</button></div>`);}
function fakturaModal(f){const p=P();
  modal(`<div class="ph"><h2>Faktura ${esc(f.nr)}</h2><div class="sp"></div>${statusPill(f.status)}<button class="btn g" data-a="close" aria-label="Stäng">✕</button></div>
  <div class="inv"><div class="ih"><div><div class="logo">ONE Nordic AB</div><div class="small muted">one-nordic.se</div></div><div class="small" style="text-align:right">Fakturanr <b>${esc(f.nr)}</b><br>Fakturadatum ${esc(f.datum)}<br>Förfallodatum ${esc(f.forfall)}</div></div>
  <div class="small"><b>${esc(p.kund)}</b><br>Er referens: ${esc(p.refnr||"–")}<br>Projekt: ${esc(p.pnr)} ${esc(p.namn)}</div>
  <div class="tw"><table><thead><tr><th>Specifikation</th><th class="r">Antal</th><th>Enh</th><th class="r">À-pris</th><th class="r">Belopp</th></tr></thead><tbody>${f.rows.map(r=>`<tr><td>${esc(r.text)}</td><td class="r">${fmt(r.antal,r.antal%1?1:0)}</td><td>${esc(r.enh)}</td><td class="r">${fmt(r.apris,2)}</td><td class="r">${kr(r.antal*r.apris)}</td></tr>`).join("")}
  <tr class="sum"><td colspan="4">Netto</td><td class="r">${kr(f.netto)}</td></tr><tr><td colspan="4">Moms ${S.settings.moms} %</td><td class="r">${kr(f.moms)}</td></tr><tr class="sum"><td colspan="4">Att betala</td><td class="r">${kr(f.netto+f.moms)}</td></tr></tbody></table></div>
  <div class="small muted">Betalningsvillkor 30 dagar netto. Fakturaunderlag genererat ur ONE Bered.</div></div>`);}
function bestModal(b){const p=P();const u=p.beredning.upplag.find(x=>x.nr==b.upplag);
  modal(`<div class="ph"><h2>Beställning ${esc(b.nr)}</h2><div class="sp"></div>${statusPill(b.status)}<button class="btn g" data-a="close" aria-label="Stäng">✕</button></div>
  <div class="small">Leverantör: <b>${esc(b.lev)}</b> · Projekt ${esc(p.pnr)} · Leveransadress: ${esc(u?.adr||"–")}</div>
  <div class="tw"><table><thead><tr><th>Art.nr</th><th>Benämning</th><th class="r">Antal</th><th>Enh</th><th class="r">Belopp</th></tr></thead><tbody>${b.rader.map(r=>`<tr><td><span class="code">${esc(r.art)}</span></td><td>${esc(r.ben)}</td><td class="r">${fmt(r.n,r.n%1?1:0)}</td><td>${esc(r.enh)}</td><td class="r">${kr(r.n*r.pris)}</td></tr>`).join("")}</tbody></table></div>`);}

function genModal(){const p=P();const g=Object.assign({},GEN_DEF,p.bess?.gen||{});
  const f=(k,l,unit="")=>`<label>${l} <input type="number" step="any" id="g_${k}" value="${esc(g[k])}"></label>`;
  modal(`<div class="ph"><div><div class="small muted">Beredning ${esc(p.beredning.nr)}</div><h2>BESS-generator</h2></div><div class="sp"></div><button class="btn g" data-a="close" aria-label="Stäng">✕</button></div>
  <p class="small muted" style="margin:0">Bygger hela skrivbordet: battericontainrar, MV-skids, radialer med dimensionerad MV-kabel, ställverk, hjälpkraft, fiber, jordnät, mark och etablering. Ange data enligt leverantörens datablad.</p>
  <h3>Anläggning</h3><div class="form">${f("mw","Effekt (MW)")}${f("mwh","Energi (MWh)")}<label>Hårdvaruprofil <select id="g_profil">${["Generisk","CATL EnerX + Power Electronics MV-skid","Sungrow + MVS"].map(o=>`<option ${o===g.profil?"selected":""}>${o}</option>`).join("")}</select></label>${f("mwhC","MWh per battericontainer")}${f("mwS","MW per MV-skid")}${f("veckor","Entreprenadtid (veckor)")}</div>
  <h3>Mellanspänning</h3><div class="form">${f("kv","Driftspänning (kV)")}${f("sPerR","MV-skids per radial")}${f("lSkid","Avstånd skid–skid (m)")}${f("lSV","Avstånd närmaste skid–ställverk (m)")}<label>Marktemperatur (°C) <select id="g_marktemp">${Object.keys(KF_TEMP).map(o=>`<option ${o==String(g.marktemp)?"selected":""}>${o}</option>`).join("")}</select></label><label>Värmeresistivitet (K·m/W) <select id="g_rho">${Object.keys(KF_RHO).map(o=>`<option ${o===g.rho?"selected":""}>${o}</option>`).join("")}</select></label><label>Förläggningsdjup (m) <select id="g_djup">${Object.keys(KF_DJUP).map(o=>`<option ${o===g.djup?"selected":""}>${o}</option>`).join("")}</select></label><label>Avstånd mellan radialer i schakt (mm) <select id="g_avst">${Object.keys(KF_GRP).map(o=>`<option ${o==String(g.avst)?"selected":""}>${o}</option>`).join("")}</select></label><label>MV i rör <select id="g_ror">${["Nej","Ja"].map(o=>`<option ${o===g.ror?"selected":""}>${o}</option>`).join("")}</select></label><label>POC-kabel i entreprenaden <select id="g_poc">${["Nej","Ja"].map(o=>`<option ${o===g.poc?"selected":""}>${o}</option>`).join("")}</select></label>${f("lPoc","POC-kabel längd (m)")}</div>
  <h3>DC och område</h3><div class="form">${f("dcn","DC-kablar per container (+/−)")}${f("dcl","DC-längd per kabel (m)")}${f("stangsel","Stängsel (m)")}</div>
  <p class="small" style="margin:0"><span class="pill p-orange">Ersätter</span> Befintliga konstruktioner på skrivbordet ersätts. Kalkyler påverkas inte förrän du kör "Kalkyl av beredning".</p>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn s" data-a="close">Avbryt</button><button class="btn" data-a="rungen">Generera beredning</button></div>`);}
/* ============ HÄNDELSER ============ */
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,id=el.dataset.id,p=P();
  if(a==="closeov"&&e.target!==el)return;
  if(["selproj","katq","catfile","jsonfile","selkalk"].includes(a))return;
  if(a==="goto"){e.preventDefault();S.ui.pid=id;UI.tab="projekt";}
  else if(a==="tab"){UI.tab=id;window.scrollTo(0,0);}
  else if(a==="close"||a==="closeov"){closeModal();return;}
  else if(a==="newproj"){const np=newProject(S,{pnr:"26-"+String(500+S.projects.length).padStart(4,"0")});S.ui.pid=np.id;UI.tab="projekt";toast("Projekt "+np.pnr+" upplagt");}
  else if(a==="copyproj"){const c=JSON.parse(JSON.stringify(p));c.id=uid();c.pnr=p.pnr+"-K";c.namn=p.namn+" (kopia)";c.exempel=false;c.tid=[];c.kostnader=[];c.fakturor=[];c.bestallningar=[];c.ata=[];c.fakturaplan.forEach(x=>x.fakt=null);S.projects.push(c);S.ui.pid=c.id;toast("Kopierat med beredning och kalkyler");}
  else if(a==="adddag")p.dagbok.push({d:today(),t:"",h:0});
  else if(a==="del"){const arr=getPath(S,el.dataset.p);arr.splice(+el.dataset.i,1);}
  else if(a==="selk"){if(e.target.closest("button"))return;UI.selK=id;}
  else if(a==="mv"){const k=p.beredning.konst,i=+el.dataset.i,j=i+ +el.dataset.d;if(j>=0&&j<k.length)[k[i],k[j]]=[k[j],k[i]];}
  else if(a==="addkonst"){konstModal(id);return;}
  else if(a==="genbess"){genModal();return;}
  else if(a==="rungen"){const g={};Object.keys(GEN_DEF).forEach(k=>{const el2=document.getElementById("g_"+k);if(el2)g[k]=typeof GEN_DEF[k]==="number"?(+el2.value||GEN_DEF[k]):el2.value;});const r=applyGen(p,g);UI.selK=null;closeModal();toast(`${r.nB} containrar, ${r.nS} MV-skids, ${r.nR} radialer genererade`);}
  else if(a==="copykabel"){const rows=kabellista(p);const t=["Kabel-ID\tFrån\tTill\tTyp\tKabel\tE-nr\tAntal\tLängd m\tFörläggning",...rows.map(r=>[r.id,r.fran,r.till,r.typ,r.ben,r.art,r.antal,r.langd,r.forl].join("\t"))].join("\n");navigator.clipboard?.writeText(t).then(()=>toast("Kabellista kopierad – klistra in i Excel")).catch(()=>toast("Kopiering blockerad i denna vy"));return;}
  else if(a==="editkonst"){const k=p.beredning.konst.find(x=>x.id===id);konstModal(k.lib,k);return;}
  else if(a==="savekonst"){const L=LIB.find(l=>l.id===id);const pr={};L.params.forEach(x=>{const v=document.getElementById("kp_"+x.k).value;pr[x.k]=x.n?+v:v;});const r=L.build(pr);
    if(el.dataset.k){const k=p.beredning.konst.find(x=>x.id===el.dataset.k);k.params=pr;k.m=r.m.filter(x=>x[1]).map(([a,n])=>({art:a,n}));k.k=r.k.filter(x=>x[1]).map(([c,n])=>({kod:c,n}));k.c=r.c;toast("Konstruktionen genererad om");}
    else{const k={id:uid(),lib:id,params:pr,ident:document.getElementById("kp__ident").value||(L.post?L.post+"01":L.namn),upplag:p.beredning.upplag[0]?.nr||"",anm:"",m:r.m.filter(x=>x[1]).map(([a,n])=>({art:a,n})),k:r.k.filter(x=>x[1]).map(([c,n])=>({kod:c,n})),c:r.c};p.beredning.konst.push(k);UI.selK=k.id;toast("Lagd på skrivbordet");}
    closeModal();}
  else if(a==="dupkonst"){const k=p.beredning.konst.find(x=>x.id===id);const c=JSON.parse(JSON.stringify(k));c.id=uid();c.ident+=" (kopia)";p.beredning.konst.splice(p.beredning.konst.indexOf(k)+1,0,c);UI.selK=c.id;}
  else if(a==="addart"){const k=p.beredning.konst.find(x=>x.id===id);k.m.push({art:document.getElementById("addArt").value,n:1});}
  else if(a==="addkod"){const v=document.getElementById("addKod").value.trim();if(!cat(v)){toast("Koden finns inte i katalogen");return;}p.beredning.konst.find(x=>x.id===id).k.push({kod:v,n:1});}
  else if(a==="addupplag")p.beredning.upplag.push({nr:(p.beredning.upplag.length+1),adr:""});
  else if(a==="kalkav"){const k=kalkylFromBeredning(p);UI.kalkId=k.id;UI.tab="kalkyl";toast("Kalkyl "+k.nr+" skapad av beredning");}
  else if(a==="newkalk"){const k={id:uid(),nr:"K"+(2000+Math.floor(Math.random()*8000)),namn:"Ny kalkyl",typ:"P2",status:p.kalkyler.length?"Alt":"Huv",faktor:1,pas:{arb:0,mat:0,msk:0,ov:0},risk:0,vinst:0,matMode:"katalog",rader:[]};p.kalkyler.push(k);UI.kalkId=k.id;UI.tab="kalkyl";}
  else if(a==="openkalk"){UI.kalkId=id;UI.tab="kalkyl";}
  else if(a==="copykalk"){const k=p.kalkyler.find(x=>x.id===UI.kalkId);const c=JSON.parse(JSON.stringify(k));c.id=uid();c.nr="K"+(2000+Math.floor(Math.random()*8000));c.namn+=" (kopia)";c.status="Alt";p.kalkyler.push(c);UI.kalkId=c.id;toast("Kalkyl kopierad");}
  else if(a==="kaddkod"){const k=p.kalkyler.find(x=>x.id===UI.kalkId);const v=document.getElementById("kKod").value.trim();if(!cat(v)){toast("Koden finns inte i katalogen");return;}k.rader.push({id:uid(),kod:v,n:+document.getElementById("kAntal").value||1,matris:1,kom:""});}
  else if(a==="kaddegen"){const k=p.kalkyler.find(x=>x.id===UI.kalkId);k.rader.push({id:uid(),egen:true,kod:"EGEN",ben:"Egen kod",enh:"st",n:1,b:0,m:1,x:0,mat:0,ov:0,matris:1});toast("Egen kod: 1 montörstimme – ändra benämning och antal");}
  else if(a==="mkbest"){const mat=aggMateriel(p);if(!mat.length){toast("Beredningen saknar materiel");return;}const nr="B-"+(1001+S.projects.reduce((a,x)=>a+x.bestallningar.length,0));
    p.bestallningar.push({id:uid(),nr,lev:p.beredning.lev,datum:today(),status:"Skapad",upplag:p.beredning.upplag[0]?.nr||"",rader:mat.filter(r=>!r.bl).map(r=>({art:r.art,n:r.n,pris:r.pris,ben:r.ben,enh:r.enh}))});const t=p.tidlagen.find(x=>x.n.startsWith("Materiel"));if(t&&!t.start)t.start=today();toast("Beställning "+nr+" skapad");}
  else if(a==="showbest"){bestModal(p.bestallningar.find(x=>x.id===id));return;}
  else if(a==="addtid")p.tid.push({id:uid(),d:today(),pers:"",roll:"mont",h:8,kom:"",fakt:null});
  else if(a==="addkost")p.kostnader.push({id:uid(),d:today(),lev:"",typ:"UE",belopp:0,text:"",fakt:null});
  else if(a==="addplan")p.fakturaplan.push({id:uid(),text:"Ny milstolpe",datum:today(),pct:0,fakt:null});
  else if(a==="addata")p.ata.push({id:uid(),nr:"ÄTA "+(p.ata.length+1),text:"",belopp:0,status:"Begärd",fakt:null});
  else if(a==="fakplan"){const f=createFaktura(p,S,{planId:id,ata:false});toast("Faktura "+f.nr+" skapad");fakturaModal(f);}
  else if(a==="fakata"){if(!p.ata.some(x=>x.status==="Godkänd"&&!x.fakt)){toast("Inga ofakturerade godkända ÄTA");return;}const f=createFaktura(p,S,{ata:true});toast("Faktura "+f.nr+" skapad");fakturaModal(f);}
  else if(a==="faklop"){if(!lopandeUnderlag(p).length&&!p.ata.some(x=>x.status==="Godkänd"&&!x.fakt)){toast("Inget ofakturerat underlag");return;}const f=createFaktura(p,S,{lopande:true});toast("Faktura "+f.nr+" skapad");fakturaModal(f);}
  else if(a==="showfak"){fakturaModal(p.fakturor.find(x=>x.id===id));return;}
  else if(a==="regtab")UI.regTab=id;
  else if(a==="katf")UI.katF=id;
  else if(a==="copyjson"){const t=document.getElementById("jsonOut");const done=()=>toast("JSON kopierad");navigator.clipboard?.writeText(t.value).then(done).catch(()=>{t.select();toast("Markerat – kopiera med Ctrl+C");});return;}
  else if(a==="resetq"){document.getElementById("resetBox").innerHTML=`<p class="small" style="margin:10px 0 6px">All data i webbläsaren ersätts med exempeldata.</p><button class="btn" data-a="reset">Ja, återställ</button>`;return;}
  else if(a==="reset"){S=seed();UI.selK=null;UI.kalkId=null;toast("Exempeldata återställd");}
  else return;
  save();render();
});
document.addEventListener("change",e=>{const el=e.target;
  if(el.id==="projSel"){S.ui.pid=el.value;UI.selK=null;UI.kalkId=null;save();render();return;}
  if(el.id==="selkalk"){UI.kalkId=el.value;render();return;}
  if(el.id==="catFile"&&el.files[0]){const r=new FileReader();r.onload=()=>importCatalog(r.result,el.files[0].name);r.readAsText(el.files[0],"utf-8");return;}
  if(el.id==="jsonFile"&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.projects)throw 0;d.catalog=d.catalog||S.catalog;d.catSource=d.catSource||S.catSource;S=d;save();render();toast("Data inläst");}catch(x){toast("Filen är inte en giltig ONE Bered-export");}};r.readAsText(el.files[0]);return;}
  if(el.dataset.bind){let v=el.value;if(el.dataset.t==="num")v=v===""?0:+v;setPath(S,el.dataset.bind,v);save();render();}
});
document.addEventListener("input",e=>{const el=e.target;if(el.id==="katQ"){UI.katQ=el.value;const pos=el.selectionStart;render();const n=document.getElementById("katQ");n.focus();n.setSelectionRange(pos,pos);}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
function importCatalog(text,name){
  const lines=text.replace(/^﻿/,"").split(/\r?\n/).filter(Boolean);const hd=lines[0].split(";").map(s=>s.trim());const ix=k=>hd.indexOf(k);
  if(ix("kod")<0||ix("katalog")<0){toast("CSV saknar kolumnerna katalog och kod");return;}
  const num=v=>{if(v==null||v==="")return null;const n=+String(v).replace(",",".");return isNaN(n)?null:n;};
  const rows=lines.slice(1).map(l=>{const c=l.split(";");const g=k=>c[ix(k)];return {kat:g("katalog"),kod:g("kod"),grp:g("grupp")||"",ben:g("benamning")||"",enh:g("enhet")||"",b:num(g("bered_h")),m:num(g("mont_h")),x:num(g("maskin_h")),arb:num(g("arbete_kr")),mat:num(g("material_kr")),mk:num(g("maskin_kr")),ov:num(g("ovrigt_kr")),sum:num(g("summa_kr"))};}).filter(r=>r.kod);
  S.catalog=rows;S.catSource=name+" (importerad "+today()+")";save();render();toast(fmt(rows.length)+" koder importerade");
}
load();
render();
</script>
